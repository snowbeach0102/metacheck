        <div class="grow min-h-[16px]"></div>
        <button type="button" class="btn btn-md btn-gray w-full" data-action="flip"><i class="fa-solid fa-rotate-left"></i>문제 다시 보기</button>
      </article>
    </div>
  </div>
  <!-- 카드 조작 바: 화면 아래에 붙어 있어 스크롤하지 않아도 넘기기 · 재도전 · 해소를 누를 수 있어요 -->
  <div class="sticky z-20 bottom-[calc(76px+env(safe-area-inset-bottom))] md:bottom-4">
    <div class="flex items-center gap-2 p-2 rounded-2xl bg-surface/95 backdrop-blur-md shadow-float ring-1 ring-ink-200/70">
      <button type="button" class="w-11 h-11 shrink-0 rounded-xl grid place-items-center text-ink-700 hover:bg-ink-100 disabled:opacity-30" data-action="card-move" data-d="-1" ${idx === 0 ? 'disabled' : ''} aria-label="이전 카드"><i class="fa-solid fa-chevron-left"></i></button>
      ${retryBtnHTML(i, r, 'flex-1 min-w-0 !px-2')}
      ${resolveBtnHTML(i, r, 'flex-1 min-w-0 !px-2')}
      <button type="button" class="w-11 h-11 shrink-0 rounded-xl grid place-items-center text-ink-700 hover:bg-ink-100 disabled:opacity-30" data-action="card-move" data-d="1" ${idx >= items.length - 1 ? 'disabled' : ''} aria-label="다음 카드"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>
  <p class="text-center text-xs text-ink-500">좌우로 밀거나 ← → 키로도 넘길 수 있어요</p>`;
}

/* [index5] 복습 목록 보기 묶음 — 카드가 한 줄로 길게 이어져 어느 단원 문제인지 헷갈리던 것을 '지금 보는 범위의 한 단계 아래'로 나눠요
 *  여러 단원이 섞여 있으면(과목 · 전체 모아보기) → 단원별 (같은 단원을 여러 회차 풀었어도 한 묶음)
 *  한 단원만 보면(진단 하나 · 단원이 하나뿐인 과목) → 개념별
 *  묶음 순서 = 그 묶음에서 가장 급한 카드의 순서(착각이 있는 단원이 먼저) · 묶음 안 순서는 덱 순서 그대로
 *  묶음이 하나뿐이면 나누지 않고 예전처럼 한 줄로 보여 줘요 */
function reviewGroups(items) {
  const topicKey = (i) => `${i.h.subject}|${normName(i.h.topic).toLowerCase()}`;
  const by = new Set(items.map(topicKey)).size > 1 ? 'topic' : 'concept';
  const map = new Map();
  items.forEach((i) => {
    const key = by === 'topic' ? `t:${topicKey(i)}` : `c:${i.h.bankId}:${i.cid}`;
    if (!map.has(key)) map.set(key, by === 'topic'
      ? { key, ic: BANK_EMOJI[i.h.bankId] || '📘', title: i.h.topic, subject: i.h.subject, items: [] }
      : { key, ic: '<i class="fa-solid fa-lightbulb text-base text-brand-500"></i>', title: conceptOf(i.h.bankId, i.cid).name, subject: i.h.subject, items: [] });
    map.get(key).items.push(i);
  });
  return { by, groups: [...map.values()] };
}
/** [모두 접기 / 펼치기] 글자: 묶음이 하나라도 펼쳐져 있으면 '모두 접기' */
function syncGrpAllBtn() {
  const b = $('#grp-all');
  if (b) b.textContent = [...document.querySelectorAll('#view-review details[data-grp]')].some((d) => d.open) ? '모두 접기' : '모두 펼치기';
}
function reviewListHTML(items) {
  const { by, groups } = reviewGroups(items);
  const grouped = groups.length > 1;
  // 카드 머리 줄의 위치 글자: 묶음 머리글과 겹치는 단원 · 개념 이름은 다시 쓰지 않아요
  const where = (i) => {
    const c = esc(conceptOf(i.h.bankId, i.cid).name);
    if (!grouped) return `${RT.reviewScope === 'all' ? `${esc(i.h.topic)} · ` : ''}${c}`;
    return by === 'topic' ? c : '';
  };
  const row = (i) => {
    const h = i.h, q = getQ(i.qid), r = h.review[i.qid] || {}, key = h.id + i.qid, m = STATUS[i.status], w = where(i);
    return `
    <details class="card overflow-hidden group ${r.done ? 'opacity-75' : i.status === 'ILLUSION' ? 'ring-2 ' + TONE[m.tone].ring : ''}" data-row="${key}" ${RT.openRows.has(key) ? 'open' : ''}>
      <summary class="p-5 flex items-start gap-3 cursor-pointer">
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-1.5">${r.pinned && !r.done ? '<span class="chip bg-solid-danger text-white">📌 1순위</span>' : ''}<span class="chip ${TONE[m.tone].chip}">${m.emoji} ${m.short}</span>${levelChip(i.lv)}${w ? `<span class="text-xs font-bold text-ink-600">${w}</span>` : ''}${r.done ? '<span class="chip bg-mastery-50 text-mastery-700">✓ 해소</span>' : ''}</div>
          <p class="mt-2.5 text-[15px] font-semibold leading-relaxed break-keep line-clamp-2 group-open:line-clamp-none">${esc(q.q)}</p>
        </div>
        <i class="fa-solid fa-chevron-down text-ink-400 text-xs mt-1 transition group-open:rotate-180"></i>
      </summary>
      <div class="px-5 pb-5">
        ${cardFrontHTML(i, q, r).split('</h2>')[1]}
        <div class="mt-3 pt-3 border-t border-ink-100 flex flex-col">${cardBackHTML(i, q, r)}</div>
        <div class="mt-4 grid ${resolveBtnHTML(i, r) ? 'grid-cols-2' : 'grid-cols-1'} gap-2">
          ${retryBtnHTML(i, r)}
          ${resolveBtnHTML(i, r)}
        </div>
      </div>
    </details>`;
  };
  if (!grouped) return `<div class="space-y-3">${items.map(row).join('')}</div>`;
  const showSubject = RT.reviewScope === 'all' && RT.reviewSubject === 'ALL'; // 모든 과목을 모아 볼 때만 머리글에 과목 이름
  const anyOpen = groups.some((g) => !RT.reviewGrpClosed.has(g.key));
  // 묶음 머리글 요약: 유형별 개수(착각 · 불안정 · 노베이스) + 해소한 카드 수
  const tally = (g) => {
    const n = { ILLUSION: 0, INSTABILITY: 0, DEFICIT: 0 };
    let done = 0;
    g.items.forEach((i) => { if (i.status in n) n[i.status]++; if ((i.h.review[i.qid] || {}).done) done++; });
    const parts = Object.entries(n).filter(([, v]) => v).map(([k, v]) => `<span class="whitespace-nowrap">${STATUS[k].emoji} ${STATUS[k].short} ${v}</span>`);
    if (done) parts.push(`<span class="whitespace-nowrap text-mastery-700">✓ 해소 ${done}</span>`);
    return parts.join('');
  };
  return `
  <div class="px-1 flex items-center justify-between gap-2">
    <p class="text-[13px] font-extrabold text-ink-700 break-keep"><i class="fa-solid fa-folder-tree mr-1.5 text-brand-500" aria-hidden="true"></i>${by === 'topic' ? '단원' : '개념'}별로 묶었어요 · ${groups.length}묶음</p>
    <button type="button" id="grp-all" class="shrink-0 h-9 px-3.5 rounded-full text-[13px] font-bold bg-surface ring-1 ring-ink-200 text-ink-700 hover:ring-brand-300 transition" data-action="review-grp-all">${anyOpen ? '모두 접기' : '모두 펼치기'}</button>
  </div>
  <div class="space-y-4">${groups.map((g) => `
    <details data-grp="${esc(g.key)}" ${RT.reviewGrpClosed.has(g.key) ? '' : 'open'}>
      <summary class="flex items-center gap-3 rounded-2xl bg-brand-50 ring-1 ring-brand-200 hover:ring-brand-400 px-3.5 py-3 cursor-pointer select-none transition">
        <span class="w-10 h-10 shrink-0 rounded-xl bg-surface shadow-sm grid place-items-center text-lg" aria-hidden="true">${g.ic}</span>
        <span class="min-w-0 flex-1">
          <span class="block text-[11px] font-bold text-brand-700 truncate">${by === 'topic' ? `${showSubject ? `${esc(g.subject)} · ` : ''}단원` : '개념'}</span>
          <span class="block text-[16px] font-extrabold text-ink-900 leading-snug break-keep">${esc(g.title)}</span>
          <span class="mt-0.5 flex flex-wrap gap-x-2 gap-y-0.5 text-xs font-bold text-ink-600">${tally(g)}</span>
        </span>
        <span class="shrink-0 min-w-[30px] h-7 px-2 rounded-full bg-ink-100 text-ink-800 text-[13px] font-extrabold grid place-items-center tnum"><span class="sr-only">카드 </span>${g.items.length}<span class="sr-only">장</span></span>
        <i class="grp-chev fa-solid fa-chevron-down text-xs text-ink-500 transition-transform" aria-hidden="true"></i>
      </summary>
      <div class="mt-2.5 ml-2 pl-3 border-l-2 border-brand-200 space-y-3">${g.items.map(row).join('')}</div>
    </details>`).join('')}
  </div>`;
}

/* =====================================================================
 * 학습 기록 — 요약 지표 · 날짜별 묶음
 * ===================================================================== */
/** [변경] 예시 기록은 내 진단이 하나도 없을 때만 목록 · 통계에 들어가요 (visibleHistory) */
function historyFiltered() {
  const f = S.histFilter;
  let list = visibleHistory().filter((h) => f.subject === 'ALL' || h.subject === f.subject);
  if (f.status === 'ILLUSION') list = list.filter((h) => unresolvedCount(h) > 0);
  if (f.status === 'CLEAR') list = list.filter((h) => unresolvedCount(h) === 0);
  return list;
}

/** 과목 목록: 최근에 진단한 과목이 앞에 오도록 (칩 순서 = 기본 필터 후보 순서) */
function historySubjects() {
  return [...new Set(visibleHistory().slice().sort((a, b) => new Date(b.date) - new Date(a.date)).map((h) => h.subject))];
}
/** 기본 과목 필터: 가장 최근에 직접 진단한 과목. 내 진단 기록이 아예 없을 때(예시 기록뿐)만 'ALL' */
function defaultHistSubject() {
  const mine = S.history.filter((h) => !h.sample).sort((a, b) => new Date(b.date) - new Date(a.date))[0];
  return mine ? mine.subject : 'ALL';
}

/* [변경] 학습 기록 대시보드
 *  - 과목 필터: <select> 드롭다운 → 가로 스크롤 칩 리스트 (최근 진단 과목 순, 원클릭 전환)
 *  - 기본 과목: 가장 최근에 진단한 과목 (진입 시 go()에서 적용)
 *  - '모든 과목(ALL)'은 난이도가 다른 과목이 섞여 평균이 왜곡되므로
 *    ① 평균 정확도 카드는 계산하지 않고 '–' · '단일 과목 선택 필요'만 표시
 *    ② 분석 리포트 탭은 추이 차트 · 개념별 성장을 그리지 않고 과목 선택 안내만 표시
 *  [변경] 시간대별 컨디션 분석은 뺐어요 — 수십 문항 이상 쌓여야 의미가 있고, 부족하면 예시 데이터로 채워 신뢰를 깎았어요
 *  [변경] 분석 리포트 = 정확도 추이 + 개념별 성장(착각 → 확실한 내 지식 전환율)
 */
function renderHistory(opt = {}) {
  const f = S.histFilter;
  const subjects = historySubjects();
  if (f.subject !== 'ALL' && !subjects.includes(f.subject)) f.subject = defaultHistSubject();
  const allSubjects = f.subject === 'ALL';
  const list = historyFiltered();
  // 통계는 '필터링된 목록'으로만 계산해요 → '착각 없음'에서 미해결 착각이 보이는 모순이 생기지 않아요
  const count = list.length;
  // [index5] 위 통계 칸: '평균 메타인지 점수' → '평균 정답률' — 결과 화면 · 기록 카드가 정답률을 앞세우는 것과 같은 순서로
  const accList = list.map((h) => h.summary.accuracy).filter((v) => v != null);
  const avgAcc = !allSubjects && accList.length ? pct(avg(accList)) : 0;
  const un = list.reduce((s, h) => s + unresolvedCount(h), 0);
  const groups = [['오늘', (d) => d <= 0], ['이번 주', (d) => d > 0 && d < 7], ['그 이전', (d) => d >= 7]]
    .map(([t, fn]) => [t, list.filter((h) => fn(daysAgo(h.date)))]).filter(([, a]) => a.length);
  const tab = S.prefs.histTab === 'analysis' ? 'analysis' : 'list';
  const chip = (k, label) => `<button type="button" data-action="hist-status" data-k="${k}" aria-pressed="${f.status === k}" class="h-10 px-4 rounded-full text-[13px] font-bold transition ${f.status === k ? 'bg-ink-900 text-ink-50' : 'bg-surface text-ink-600 shadow-card hover:bg-ink-50'}">${label}</button>`;
  const subjectChip = (k, label) => `<button type="button" data-action="hist-subject" data-k="${esc(k)}" aria-pressed="${f.subject === k}" class="shrink-0 h-10 px-4 rounded-full text-[13px] font-bold whitespace-nowrap transition ${f.subject === k ? 'bg-solid-brand text-white shadow-sm' : 'bg-surface text-ink-600 shadow-card hover:bg-ink-50'}">${label}</button>`;
  const stat = (key, label, value, unit, warn) => `
    <div class="card p-4 transition ${warn ? 'ring-1 ring-illusion-200' : ''}">
      <p class="text-xs font-bold ${warn ? 'text-illusion-600' : 'text-ink-500'}">${label}</p>
      <p class="mt-1 text-[24px] leading-none font-extrabold"><span data-roll="${value}" data-key="${key}">${RT.rollPrev[key] != null ? RT.rollPrev[key] : 0}</span><span class="text-sm font-bold text-ink-500">${unit}</span></p>
    </div>`;
  // ① 모든 과목: 서로 다른 과목의 점수를 평균 내지 않아요
  // [index5] 예전엔 '평균 정확도'라 적어 놓고 실제로는 메타인지 점수를 보여 줬어요 → '평균 메타인지'로 바꿨다가, 결과 화면 · 기록 카드와 맞추려고 지금은 '평균 정답률'
  const avgStat = allSubjects ? `
    <div class="card p-4">
      <p class="text-xs font-bold text-ink-500">평균 정답률</p>
      <p class="mt-1 text-[24px] leading-none font-extrabold text-ink-300" aria-hidden="true">–</p>
      <p class="mt-1.5 text-[11px] font-bold leading-tight text-ink-500 break-keep"><span class="sr-only">평균 정답률은 </span><span class="whitespace-nowrap">단일 과목</span> <span class="whitespace-nowrap">선택 필요</span></p>
    </div>` : stat('avg', '평균 정답률', avgAcc, '%', false);
  const scope = [allSubjects ? '모든 과목' : f.subject, { ALL: '', ILLUSION: '미해결 착각이 있는 진단', CLEAR: '착각 없는 진단' }[f.status]].filter(Boolean).join(' · ');
  const listHTML = groups.length ? groups.map(([t, arr]) => `
    <section><h2 class="px-1 text-sm font-extrabold text-ink-500">${t}</h2><div class="mt-2 space-y-2.5">${arr.map(historyCardHTML).join('')}</div></section>`).join('')
    : `<div class="card p-8 text-center">
        <p class="text-sm text-ink-600">조건에 맞는 기록이 없어요</p>
        ${f.status !== 'ALL' || f.subject !== defaultHistSubject() ? '<button type="button" class="mt-3 btn btn-sm btn-secondary" data-action="hist-reset">필터 초기화</button>' : ''}
      </div>`;
  // ② 모든 과목: 추이 · 컨디션 분석 대신 과목 선택 안내 (가장 최근 과목으로 바로 가는 버튼 포함)
  const analysisHTML = allSubjects
    ? `<div class="card px-6 py-12 flex flex-col items-center text-center">
        <span class="w-12 h-12 rounded-2xl bg-brand-50 text-brand-500 grid place-items-center text-lg" aria-hidden="true"><i class="fa-solid fa-filter"></i></span>
        <p class="mt-4 max-w-xs text-[15px] font-bold text-ink-800 leading-relaxed break-keep">특정 과목을 선택해야 메타인지 정확도 추이와 개념별 성장 리포트를 볼 수 있어요</p>
        <p class="mt-1.5 max-w-xs text-xs text-ink-500 break-keep">난이도가 다른 과목을 섞어 평균을 내면 추이가 왜곡되기 때문이에요.</p>
        ${subjects[0] ? `<button type="button" class="mt-5 btn btn-md btn-secondary" data-action="hist-subject" data-k="${esc(subjects[0])}">${esc(subjects[0])} 리포트 보기</button>` : ''}
      </div>`
    : (trendHTML(list) + conceptGrowthHTML(list)) || '<div class="card p-8 text-center text-sm text-ink-600">분석할 기록이 아직 없어요</div>';
  const demo = !realHistory().length;
  $('#view-history').innerHTML = `
  <div class="max-w-3xl mx-auto px-4 pt-3 pb-28 md:pb-12 space-y-4 ${opt.quiet ? '' : 'anim-in'}">
    <h1 class="px-1 text-[24px] font-extrabold tracking-tight">학습 기록</h1>
    ${demo ? '<p class="rounded-2xl bg-unstable-50 px-4 py-3 text-sm text-ink-700 break-keep"><b class="text-unstable-700">예시 기록이에요.</b> 아직 내 진단이 없어 예시를 보여 드려요. 첫 진단을 마치면 예시는 사라지고 내 기록만 남아요.</p>' : ''}
    <div class="space-y-2">
      <div class="-mx-4 px-4 -my-1 py-1 flex gap-1.5 overflow-x-auto no-scrollbar" role="group" aria-label="과목 필터">${subjectChip('ALL', '📚 모든 과목')}${subjects.map((s) => subjectChip(s, esc(s))).join('')}</div>
      <div class="flex flex-wrap gap-1.5" role="group" aria-label="상태 필터">${chip('ALL', '전체')}${chip('ILLUSION', '🚨 미해결 착각')}${chip('CLEAR', '✓ 착각 없음')}</div>
    </div>
    <p class="px-1 -mt-1 text-xs text-ink-500" aria-live="polite"><i class="fa-solid fa-filter mr-1" aria-hidden="true"></i>${esc(scope)} 기준 통계</p>
    <div class="grid grid-cols-3 gap-2.5" aria-label="요약 통계">${stat('count', '진단', count, '회', false)}${avgStat}${stat('un', '미해결 착각', un, '개', un > 0)}</div>
    <!-- 목록과 분석을 탭으로 나눠, 지난 진단을 찾으려고 긴 차트를 지나 스크롤하지 않게 -->
    <div class="grid grid-cols-2 gap-1 p-1 rounded-2xl bg-surface shadow-card" role="tablist" aria-label="기록 보기">
      ${[['list', `진단 목록 ${count}`], ['analysis', `분석 리포트${allSubjects ? ' <i class="fa-solid fa-lock text-[10px] opacity-70" aria-hidden="true"></i>' : ''}`]].map(([k, v]) => `<button type="button" role="tab" aria-selected="${tab === k}" class="h-11 rounded-xl text-sm font-bold transition ${tab === k ? 'bg-solid-brand text-white shadow-sm' : 'text-ink-500 hover:text-ink-800'}" data-action="hist-tab" data-k="${k}">${v}</button>`).join('')}
    </div>
    ${tab === 'list' ? listHTML : analysisHTML}
  </div>`;
  rollNumbers($('#view-history'));
}

/* ---------- 개념별 성장 (분석 리포트) ----------
 *  진단마다의 개념 판정을 시간순으로 이어 '착각 → 불안정 → 완벽' 흐름을 보여 줘요.
 *  북극성 지표 = 한 번이라도 '착각'이었던 개념 중 가장 최근 진단에서 '확실한 내 지식'이 된 비율 (재진단으로 증명된 전환)
 *  보조 지표 = 복습에서 검증(유사 문제 100% 확신 정답)으로 해소한 착각 문항 수
 */
function conceptGrowthHTML(list) {
  const real = list.filter((h) => !h.sample && Array.isArray(h.logs)).sort((a, b) => new Date(a.date) - new Date(b.date));
  if (!real.length) return '';
  const map = new Map();
  real.forEach((h) => evaluate(h).concepts.forEach((c) => {
    const k = `${h.bankId}|${c.id}`;
    if (!map.has(k)) map.set(k, { name: c.name, steps: [] });
    map.get(k).steps.push({ status: c.status, date: h.date });
  }));
  const rows = [...map.values()];
  const wasIll = rows.filter((r) => r.steps.some((s) => s.status === 'ILLUSION'));
  const converted = wasIll.filter((r) => r.steps[r.steps.length - 1].status === 'MASTERY');
  let illItems = 0, verified = 0;
  real.forEach((h) => reviewItems(h).filter((i) => i.status === 'ILLUSION').forEach((i) => { illItems += 1; if ((h.review[i.qid] || {}).done) verified += 1; }));
  const rate = wasIll.length ? converted.length / wasIll.length : null;
  const dot = (s) => `<span class="w-3 h-3 shrink-0 rounded-full ${TONE[STATUS[s.status].tone].fill}" title="${fmtShort(s.date)} · ${STATUS[s.status].label}"></span>`;
  return `
  <section class="card p-5 sm:p-6" aria-label="개념별 성장">
    <h2 class="section-title">개념별 성장</h2>
    <p class="mt-1 text-sm text-ink-500 break-keep">진단할 때마다 개념의 판정이 어떻게 바뀌었는지 이어서 보여 드려요.</p>
    <div class="mt-4 grid grid-cols-2 gap-2.5">
      <div class="rounded-2xl bg-mastery-50 p-4">
        <p class="text-xs font-bold text-mastery-700">착각 → 확실한 내 지식 전환율</p>
        <p class="mt-1 text-[26px] leading-none font-black tnum">${rate == null ? '–' : `${pct(rate)}<span class="text-sm font-bold">%</span>`}</p>
        <p class="mt-1.5 text-[11px] text-ink-600 break-keep">${rate == null ? '아직 착각이었던 개념이 없어요' : `착각이었던 개념 ${wasIll.length}개 중 ${converted.length}개 · 재진단 기준`}</p>
      </div>
      <div class="rounded-2xl bg-ink-50 p-4">
        <p class="text-xs font-bold text-ink-600">검증으로 해소한 착각</p>
        <p class="mt-1 text-[26px] leading-none font-black tnum">${verified}<span class="text-sm font-bold text-ink-500">/${illItems}문항</span></p>
        <p class="mt-1.5 text-[11px] text-ink-600 break-keep">유사 문제를 😎 100% 확신으로 맞혀 해소</p>
      </div>
    </div>
    <ul class="mt-4 divide-y divide-ink-100">${rows.map((r) => {
      const last = r.steps[r.steps.length - 1], m = STATUS[last.status];
      return `
      <li class="py-3 flex items-center gap-3">
        <div class="min-w-0 flex-1">
          <p class="text-sm font-bold truncate">${esc(r.name)}</p>
          <div class="mt-1.5 flex items-center gap-1" role="img" aria-label="${esc(r.steps.map((s) => `${fmtShort(s.date)} ${STATUS[s.status].short}`).join(' → '))}">${r.steps.slice(-8).map((s, k) => `${k ? '<i class="fa-solid fa-angle-right text-[9px] text-ink-300" aria-hidden="true"></i>' : ''}${dot(s)}`).join('')}${r.steps.length === 1 ? '<span class="ml-1 text-[11px] text-ink-500">재진단하면 변화가 보여요</span>' : ''}</div>
        </div>
        <span class="chip shrink-0 ${TONE[m.tone].chip}">${m.emoji} ${m.short}</span>
      </li>`;
    }).join('')}
    </ul>
  </section>`;
}

/** 숫자 롤링: 이전 값에서 새 값까지 0.65초 동안 부드럽게 */
function rollNumbers(root) {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('[data-roll]').forEach((el) => {
    const to = Number(el.dataset.roll), key = el.dataset.key;
    const from = Number(RT.rollPrev[key] != null ? RT.rollPrev[key] : 0);
    RT.rollPrev[key] = to;
    if (reduce || from === to || document.hidden) { el.textContent = to; return; }
    const t0 = performance.now(), dur = 650;
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    setTimeout(() => { if (el.isConnected) el.textContent = to; }, dur + 120); // 프레임이 멈춘 환경 대비
  });
}

const fmtShort = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}.${String(d.getDate()).padStart(2, '0')}`; };

/** 메타인지 정확도 추이: 진단 순서대로 꺾은선 + 지난 진단 대비 변화 */
function trendHTML(list) {
  const pts = list.slice().sort((a, b) => new Date(a.date) - new Date(b.date)).slice(-10);
  if (!pts.length) return '';
  if (pts.length < 2) {
    return `<section class="card p-5"><h2 class="section-title">메타인지 정확도 추이</h2><p class="mt-2 text-sm text-ink-500 break-keep">진단을 한 번 더 하면 점수가 어떻게 변하는지 그래프로 보여 드려요.</p></section>`;
  }
  const last = pts[pts.length - 1], prev = pts[pts.length - 2], first = pts[0];
  const d = last.summary.calibration - prev.summary.calibration;
  const total = last.summary.calibration - first.summary.calibration;
  // [index5] 정답률은 기록에 없을 수도 있어요(옛 기록) — 첫 · 최근 둘 다 있을 때만 '정답률 +N%p'를 덧붙여요
  const accTotal = first.summary.accuracy != null && last.summary.accuracy != null ? pct(last.summary.accuracy) - pct(first.summary.accuracy) : null;
  const since = daysAgo(prev.date) - daysAgo(last.date) === 1 ? '어제' : `지난 진단(${relDay(prev.date)})`;
  const deltaTxt = d > 0 ? `${since}보다 <b class="text-mastery-700">${d}점 올랐어요</b> 📈`
    : d < 0 ? `${since}보다 <b class="text-illusion-600">${-d}점 내려갔어요</b>` : `${since}과 같은 점수예요`;
  const x = (i) => 4 + (i * 92) / (pts.length - 1);   // 가로 위치(%) · 좌우 여백 4%
  const y = (v) => 100 - v;                            // 0~100점 → 세로 위치(%)
  const line = pts.map((p, i) => `${x(i)},${y(p.summary.calibration)}`).join(' ');
  const area = `${x(0)},100 ${line} ${x(pts.length - 1)},100`;
  const showX = (i) => pts.length <= 6 || i === 0 || i === pts.length - 1;
  return `
  <figure class="card p-5 sm:p-6 m-0" aria-label="메타인지 정확도 추이">
    <figcaption class="flex items-start justify-between gap-3">
      <div class="min-w-0"><h2 class="section-title">메타인지 정확도 추이</h2><p class="mt-1 text-sm text-ink-600 break-keep">${deltaTxt}</p></div>
      <div class="shrink-0 text-right"><p class="text-[28px] leading-none font-black">${last.summary.calibration}<span class="text-sm font-bold text-ink-500">점</span></p><p class="mt-1 text-[11px] text-ink-500">최근 진단</p></div>
    </figcaption>
    <div class="mt-5 flex gap-2">
      <div class="relative w-7 h-36 shrink-0 text-[11px] text-ink-500 tnum" aria-hidden="true"><span class="absolute right-0 -top-2">100</span><span class="absolute right-0 top-1/2 -translate-y-1/2">50</span><span class="absolute right-0 -bottom-2">0</span></div>
      <div class="relative flex-1 h-36" role="img" aria-label="${esc(pts.map((p) => `${fmtDate(p.date)} ${p.summary.calibration}점`).join(', '))}">
        <div class="absolute inset-x-0 top-0 h-px bg-ink-100" aria-hidden="true"></div>
        <div class="absolute inset-x-0 top-1/2 h-px bg-ink-100" aria-hidden="true"></div>
        <div class="absolute inset-x-0 bottom-0 h-px bg-ink-300" aria-hidden="true"></div>
        <svg class="absolute inset-0 w-full h-full overflow-visible" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <polygon points="${area}" style="fill:rgb(var(--brand-500) / .1)"/>
          <polyline points="${line}" fill="none" style="stroke:rgb(var(--brand-500))" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>
        ${pts.map((p, i) => {
          const isLast = i === pts.length - 1;
          return `<span class="mark absolute -translate-x-1/2 -translate-y-1/2 w-6 h-6 grid place-items-center rounded-full outline-none" style="left:${x(i)}%;top:${y(p.summary.calibration)}%" ${tipAttr([`${p.summary.calibration}점`, p.topic, `${fmtDate(p.date)}${p.sample ? ' · 예시 기록' : ''}`])}><span class="${isLast ? 'w-3.5 h-3.5' : 'w-2.5 h-2.5'} rounded-full bg-brand-500 ring-2 ring-surface"></span></span>`;
        }).join('')}
      </div>
    </div>
    <div class="mt-2 ml-9 relative h-4 text-[10px] text-ink-500 tnum" aria-hidden="true">${pts.map((p, i) => (showX(i) ? `<span class="absolute -translate-x-1/2 whitespace-nowrap" style="left:${x(i)}%">${fmtShort(p.date)}</span>` : '')).join('')}</div>
    <p class="mt-3 text-xs text-ink-500 break-keep">첫 진단 대비 <b class="${total >= 0 ? 'text-mastery-700' : 'text-illusion-600'}">${total >= 0 ? '+' : ''}${total}점</b>${accTotal != null ? ` · 정답률 <b class="${accTotal >= 0 ? 'text-mastery-700' : 'text-illusion-600'}">${accTotal >= 0 ? '+' : ''}${accTotal}%p</b>` : ''} · 최근 ${pts.length}회 진단</p>
  </figure>`;
}

/** 진단 기록 카드: 윗부분 전체를 누르면 결과로, 아래에는 꼭 필요한 버튼 두 개만 */
function historyCardHTML(h) {
  const c = h.summary.counts, un = unresolvedCount(h), d = daysAgo(h.date);
  const hint = d >= 1 && d <= 3 ? '<span class="chip bg-brand-50 text-brand-700">복습 적기</span>' : d > 3 && un ? '<span class="chip bg-illusion-50 text-illusion-700">복습 필요</span>' : '';
  const canReview = !h.sample && reviewItems(h).length > 0;
  const total = CHART_ORDER.reduce((s, k) => s + c[k], 0) || 1;
  const head = `
      <!-- [index5] 결과 화면은 '정답률 · 확실한 내 지식'을 앞세우는데 기록 카드는 '메타인지 점수'가 큰 숫자였어요 → 같은 순서로: 큰 숫자 = 정답률 · 아래 줄 = 확실한 지식 (메타인지 점수는 결과 화면의 접힌 줄에서 봐요) -->
      <div class="shrink-0 w-16 text-center">${h.summary.accuracy != null ? `<p class="text-[24px] leading-none font-black tnum">${pct(h.summary.accuracy)}<span class="text-sm font-extrabold">%</span></p><p class="mt-1 text-[11px] font-bold text-ink-500">정답률</p>` : `<p class="text-[24px] leading-none font-black">${h.summary.calibration}</p><p class="mt-1 text-[11px] font-bold text-ink-500">메타인지</p>`}</div>
      <div class="min-w-0 flex-1">
        <!-- [index5] 집중 연습은 복습 선택 시트 · 복습 덱과 같은 이름으로: 제목 = 연습한 개념(entryTitle) · 윗줄 = '집중 연습 · 🌱 기초 3문항'(practiceTag) -->
        <p class="flex items-center gap-1.5 text-xs"><span class="font-bold text-ink-500 truncate">${esc(h.subject)} · ${esc(h.kind === 'practice' ? practiceTag(h) : histModeLabel(h))}</span>${h.sample ? '<span class="chip bg-ink-900 text-ink-50 !py-0.5">예시</span>' : ''}</p>
        <p class="mt-0.5 text-[16px] font-bold truncate">${esc(entryTitle(h))}</p>
        <p class="mt-0.5 text-xs text-ink-500 flex flex-wrap items-center gap-1.5">${relDay(h.date)}${h.summary.accuracy != null ? ` · <span class="font-bold text-ink-700">확실한 지식 ${pct(c.MASTERY / total)}%</span>` : ''} ${hint}</p>
      </div>
      ${h.sample ? '' : '<i class="fa-solid fa-chevron-right text-xs text-ink-400 self-center" aria-hidden="true"></i>'}`;
  return `
  <article class="card p-4">
    ${h.sample
      ? `<div class="flex items-start gap-3">${head}</div>`
      : `<button type="button" class="w-full flex items-start gap-3 text-left rounded-xl -m-1 p-1 hover:bg-ink-50 transition" data-action="open-result" data-id="${h.id}" aria-label="${esc(entryTitle(h))} 결과 보기">${head}</button>`}
    <div class="mt-3 flex h-2.5 w-full gap-[2px] rounded-[3px] overflow-hidden" role="img" aria-label="${esc(CHART_ORDER.map((k) => `${STATUS[k].label} ${c[k]}`).join(', '))}">${CHART_ORDER.filter((k) => c[k]).map((k) => `<div class="mark ${TONE[STATUS[k].tone].fill}" style="flex:${c[k]} 1 0%" ${tipAttr([`${c[k]}문항 · ${pct(c[k] / total)}%`, `${STATUS[k].emoji} ${STATUS[k].label}`])}></div>`).join('')}</div>
    <div class="mt-2 flex flex-wrap gap-x-3 gap-y-1 text-xs text-ink-600">${CHART_ORDER.map((k) => `<span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full ${TONE[STATUS[k].tone].fill}" aria-hidden="true"></span>${STATUS[k].short} <b class="tnum">${c[k]}</b></span>`).join('')}</div>
    ${un ? `<p class="mt-2.5 text-sm font-semibold text-illusion-600 break-keep"><i class="fa-solid fa-triangle-exclamation mr-1"></i>미해결 착각 ${un}개${h.summary.keyIllusion ? ` · ${esc(h.summary.keyIllusion)}` : ''}</p>` : ''}
    <div class="mt-3 flex gap-2">
      ${canReview ? `<button type="button" class="btn btn-sm !h-10 flex-1 ${un ? 'bg-solid-danger text-white hover:bg-solid-danger-hover' : 'btn-secondary'}" data-action="open-review" data-id="${h.id}"><i class="fa-solid fa-layer-group text-xs" aria-hidden="true"></i>복습 덱</button>` : ''}
      <button type="button" class="btn btn-sm !h-10 btn-gray flex-1" data-action="redo" data-id="${h.id}"><i class="fa-solid fa-rotate-right text-xs" aria-hidden="true"></i>다시 진단</button>
    </div>
  </article>`;
}

/* ---------- 차트 툴팁 (hover · 키보드 포커스 공통, 텍스트는 textContent로만 삽입) ---------- */
function showTip(el) {
  const tip = $('#chart-tip');
  const lines = (el.dataset.tip || '').split('\n');
  tip.textContent = '';
  lines.forEach((t, i) => { const d = document.createElement('div'); d.textContent = t; if (i === 0) d.className = 'font-extrabold text-[13px]'; else d.className = 'opacity-80'; tip.appendChild(d); });
  tip.classList.remove('hidden');
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2, y = r.top - th - 8;
  x = Math.max(8, Math.min(window.innerWidth - tw - 8, x));
  if (y < 8) y = r.bottom + 8;
  tip.style.left = `${x}px`;
  tip.style.top = `${y}px`;
}
function hideTip() { const t = $('#chart-tip'); if (t) t.classList.add('hidden'); }

const RENDER = { landing: renderLanding, home: renderHome, library: renderLibrary, ready: renderReady, quiz: renderQuiz, result: renderResult, review: renderReview, history: renderHistory };

/* =====================================================================
 * 9) 사용자 흐름 (고르기 → 풀이 → 결과 → 복습)

function isDark() {
  const t = S.prefs.theme;
  return t === 'dark' || (t === 'system' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyPrefs() {
  const root = document.documentElement, t = S.prefs.theme;
  if (t === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  $('#meta-theme').setAttribute('content', isDark() ? '#121317' : '#F2F4F6');
  syncToggles();
}
/* ---------- 계정 · 설정 바텀 시트 (퀵 세팅 통합) ----------
 * 핵심 로직
 *  - 헤더에는 로고 · 메뉴(홈 · 기록 · 복습) · [👤 계정·설정] 버튼만 남기고, 테마 · 효과음 · 1분 가이드를 이 시트로 모음
 *  - 테마: 트랙은 라이트/다크와 무관하게 아주 어두운 색 + 인셋 섀도우로 고정, 활성 썸은 흰색으로 띄우고
 *          아이콘은 진한 색(해: 앰버 · 달: 남색), 비활성 아이콘은 흰색 30%로 트랙에 묻히게
 *  - 스위치를 눌러도 시트를 다시 그리지 않고 syncToggles()가 transform · aria만 바꿔서 썸이 미끄러지는 애니메이션이 유지됨
 */
function syncToggles() {
  const d = isDark(), sys = S.prefs.theme === 'system';
  const seg = $('#theme-seg');
  if (seg) {
    $('#theme-thumb').style.transform = d ? 'translateX(100%)' : 'translateX(0)';
    seg.querySelectorAll('[data-k]').forEach((b) => {
      const on = (b.dataset.k === 'dark') === d;
      b.setAttribute('aria-checked', String(on));
      b.classList.toggle('is-on', on);
    });
    $('#theme-sub').textContent = `${d ? '다크' : '라이트'} 모드${sys ? ' · 기기 설정을 따르는 중' : ''}`;
    $('#theme-sys').classList.toggle('hidden', sys);
  }
  const sw = $('#sound-switch');
  if (sw) {
    const on = !!S.prefs.sound;
    sw.setAttribute('aria-checked', String(on));
    $('#sound-sub').textContent = on ? '클릭 · 정답 · 오답 · 팡파르 켜짐' : '모든 효과음 꺼짐 (기본)';
    $('#sound-ic').className = `fa-solid ${on ? 'fa-volume-high' : 'fa-volume-xmark'}`;
  }
  const ps = $('#pace-switch');
  if (ps) {
    ps.setAttribute('aria-checked', String(!!S.prefs.showPace));
    $('#pace-sub').textContent = S.prefs.showPace ? '풀이 중 페이스 링을 보여 줘요' : '숨김 · 시간은 화면 뒤에서 조용히 기록 (기본)';
  }
}

/* ---------- 제품 검증 지표 (이 기기 기준 · 개발용) ----------
 *  ① 첫 진단 완료율 ② 착각 발견 후 복습 진입률 ③ 7일 안 재진단율 ④ 해소 후 정답 유지율 */
function metricsSummary() {
  const ev = S.metrics || [];
  const started = new Set(ev.filter((e) => e.name === 'diag_start').map((e) => e.sid));
  const completed = new Set(ev.filter((e) => e.name === 'diag_complete' && !e.early).map((e) => e.sid));
  const real = realHistory().filter((h) => (h.kind || 'main') === 'main');
  const withIll = real.filter((h) => h.summary.counts.ILLUSION > 0);
  const entered = withIll.filter((h) => h.reviewOpenedAt);
  const old = real.filter((h) => Date.now() - new Date(h.date) >= 7 * DAY_MS || real.some((x) => x !== h && x.bankId === h.bankId && new Date(x.date) > new Date(h.date)));
  const redo = old.filter((h) => real.some((x) => x !== h && x.bankId === h.bankId && new Date(x.date) > new Date(h.date) && new Date(x.date) - new Date(h.date) <= 7 * DAY_MS));
  const kept = ev.filter((e) => e.name === 'retry' && e.wasResolved);
  const ratio = (a, b) => (b ? `${pct(a / b)}% (${a}/${b})` : '데이터 없음');
  return [
    ['첫 진단 완료율', ratio([...started].filter((x) => completed.has(x)).length, started.size)],
    ['착각 발견 → 복습 진입률', ratio(entered.length, withIll.length)],
    ['7일 안 재진단율', ratio(redo.length, old.length)],
    ['해소 후 정답 유지율', ratio(kept.filter((e) => e.correct).length, kept.length)],
  ];
}

/** 문항 준비 로딩: 단계 연출은 진행하되, 마지막 단계는 API 응답이 올 때까지 스피너로 기다려요 */
function prepLoader(label) {
  const el = $('#loading');
  const steps = ['키워드 분석 · 과목 자동 분류', '핵심 개념 3개 추출', '난이도별 문항 구성'];
  let k = 0, subject = '';
  const paint = () => {
    el.innerHTML = `
    <div class="w-full max-w-xs text-center">
      <span class="w-14 h-14 mx-auto rounded-2xl bg-brand-500 text-white grid place-items-center text-2xl"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
      <p class="mt-5 text-lg font-extrabold">문항을 준비하고 있어요</p>
      <p class="mt-1 text-sm text-ink-500 truncate">${subject ? `${esc(subject)} · ` : ''}${esc(label)}</p>
      <ul class="mt-6 space-y-2.5 text-left">${steps.map((s, i) => `
        <li class="flex items-center gap-3 text-sm font-semibold ${i < k ? 'text-ink-900' : i === k ? 'text-ink-700' : 'text-ink-500'}">
          <span class="w-6 h-6 rounded-full grid place-items-center text-[11px] ${i < k ? 'bg-solid-mastery text-white' : i === k ? 'bg-brand-100 text-brand-600' : 'bg-ink-100'}">${i < k ? '<i class="fa-solid fa-check"></i>' : i === k ? '<i class="fa-solid fa-circle-notch fa-spin"></i>' : ''}</span>${s}</li>`).join('')}
      </ul>
    </div>`;
  };
  el.classList.remove('hidden');
  paint();
  const iv = setInterval(() => { if (k < steps.length - 1) { k += 1; paint(); } }, 420);
  return {
    /** 응답 도착: 남은 단계를 모두 체크하고 닫기 */
    async finish(subj) { clearInterval(iv); subject = subj || ''; k = steps.length; paint(); await wait(280); el.classList.add('hidden'); },
    /** 실패: 같은 자리에서 오류 안내 + 다시 시도 */
    fail(msg) {
      clearInterval(iv);
      el.innerHTML = `
      <div class="w-full max-w-xs text-center anim-in" role="alert">
        <span class="w-14 h-14 mx-auto rounded-2xl bg-illusion-50 text-illusion-500 grid place-items-center text-2xl"><i class="fa-solid fa-plug-circle-exclamation"></i></span>
        <p class="mt-5 text-lg font-extrabold">문항을 준비하지 못했어요</p>
        <p class="mt-1 text-sm text-ink-500 break-keep">${esc(msg)} 잠시 후 다시 시도해 주세요.</p>
        <div class="mt-6 grid grid-cols-2 gap-2">
          <button type="button" class="btn btn-lg btn-surface" data-action="prep-cancel">닫기</button>
          <button type="button" class="btn btn-lg btn-primary" data-action="prep-retry"><i class="fa-solid fa-rotate-right text-sm"></i>다시 시도</button>
        </div>
      </div>`;
      const b = $('[data-action="prep-retry"]', el); if (b) b.focus();
    },
    /** 매칭되는 문제은행이 없을 때: 엉뚱한 샘플로 몰래 바꾸지 않고, 준비된 과목을 보여 주고 고르게 해요 */
    noMatch(list) {
      clearInterval(iv);
      el.innerHTML = `
      <div class="w-full max-w-sm text-center anim-in" role="alert">
        <span class="w-14 h-14 mx-auto rounded-2xl bg-unstable-50 text-unstable-700 grid place-items-center text-2xl" aria-hidden="true"><i class="fa-solid fa-book-open"></i></span>
        <p class="mt-5 text-lg font-extrabold">아직 준비 중인 과목이에요</p>
        <p class="mt-1 text-sm text-ink-500 break-keep">‘${esc(label)}’ 문항은 AI 문항 생성 서버가 연결되면 제공돼요. 지금은 아래 과목으로 진단할 수 있어요.</p>
        <div class="mt-5 space-y-2 text-left">${(list || []).map((it) => `
          <button type="button" class="w-full p-3.5 rounded-2xl bg-ink-50 hover:bg-ink-100 transition text-left" data-action="try-query" data-s="${esc(it.subject)}" data-t="${esc(it.topic)}">
            <span class="block text-sm font-bold">${esc(it.subject)}</span><span class="block text-xs text-ink-500">${esc(it.topic)}</span></button>`).join('')}
        </div>
        <button type="button" class="mt-4 btn btn-lg btn-surface w-full" data-action="prep-cancel">다른 과목 입력하기</button>
      </div>`;
    },
    close() { clearInterval(iv); el.classList.add('hidden'); el.innerHTML = ''; },
  };
}

/** 진행 중인 진단이 있으면 덮어쓰기 전에 확인 */
function confirmReplaceThen(fn) {
  const s = S.session;
  if (s && s.kind !== 'retry' && s.status === 'active' && s.logs.length) {
    RT.pendingStart = fn;
    confirmSheet({
      title: '진행 중인 진단이 있어요',
      desc: `${esc(s.subject)} · ${s.logs.length}/${s.total}문항을 풀던 중이에요. 새로 시작하면 이전 진단은 사라져요.`,
      ok: '새로 시작', okAction: 'confirm-replace', cancel: '이어서 풀기', cancelAction: 'resume', danger: false,
    });
    return;
  }
  fn();
}

/**
 * [변경] 진단 시작: 과목(subjectName)과 단원(topicName)을 각각 받아요 — 과목 분류 · 개념 추출은 ① Api.extractConcepts
 *  - 키워드 탭: 입력창의 두 값이 모두 있어야 시작 (하나라도 비면 그 칸을 흔들고 포커스)
 *  - opt.subjectName · opt.topicName: 예시 칩 · '다시 진단'처럼 입력창 대신 값을 직접 넘길 때
 *  - opt.source === 'pdf': PDF 탭 — 교재 PDF(+ 선택 입력한 단원 · 챕터)로 시작
 */
function startDiagnosis(opt = {}) {
  const st = S.setup;
  if (opt.source === 'pdf') {
    if (!(st.pdfs || []).length) { Sound.play('wrong'); toast('교재 PDF를 먼저 올려 주세요'); return; }
    const pdfUnit = (st.pdfUnit || '').trim();
    // [index5] 교재 PDF 여러 개: 파일 이름을 모두 보내고, 단원 · 챕터가 비었으면 '첫 파일 이름 외 N개'로 불러요
    const pdfs = st.pdfs.map((x) => x.name);
    const first = pdfs[0].replace(/\.pdf$/i, '');
    const label = pdfUnit || (pdfs.length > 1 ? `${first} 외 ${pdfs.length - 1}개` : first);
    // [index5] PDF로 시작해도 결과까지 보면 자동 저장 → AI가 분류한 과목 + 단원 · 챕터(없으면 위 이름)로 저장
    confirmReplaceThen(() => prepareDiagnosis({ source: 'pdf', pdfs, pdfUnit, label, saveLib: true }));
    return;
  }
  const subjectName = String(opt.subjectName != null ? opt.subjectName : st.subjectName || '').trim();
  const topicName = String(opt.topicName != null ? opt.topicName : st.topicName || '').trim();
  if (!subjectName || !topicName) {
    Sound.play('wrong');
    toast(!subjectName ? '과목을 입력해 주세요' : '단원을 입력해 주세요');
    const input = $(!subjectName ? '#in-subject' : '#in-topic');
    if (input) { input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); input.focus(); }
    return;
  }
  // [index5] 'ㅈㅁㄱ'처럼 자음 · 모음만 있으면 진단 · 서재 저장 전에 막아요
  const jamoId = isJamoOnly(subjectName) ? '#in-subject' : isJamoOnly(topicName) ? '#in-topic' : null;
  if (jamoId) {
    Sound.play('wrong');
    toast('자음 · 모음만 입력됐어요. 과목 · 단원 이름을 완성해 주세요');
    const input = $(jamoId);
    if (input) { input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); input.focus(); }
    return;
  }
  // [index5] 입력창(키워드 탭 · 예시 칩)으로 시작하면 결과까지 봤을 때 자동 저장 (다시 진단 · 서재에서 시작은 제외 — 이미 서재에 있는 단원이에요)
  //          opt.fresh: 내 서재 ▶ 진단 — 이전에 푼 적 없는 문항부터 출제
  const saveLib = opt.subjectName == null;
  confirmReplaceThen(() => prepareDiagnosis({ source: 'keyword', subjectName, topicName, label: `${subjectName} · ${topicName}`, saveLib, fresh: !!opt.fresh, plan: opt.plan || null, libUid: opt.libUid || null }));
}
async function prepareDiagnosis(args) {
  if (RT.preparing) return;
  RT.preparing = true;
  closeSheet();
  const st = S.setup;
  const loader = prepLoader(args.label);
  // [index5] 맞춤 출제 힌트: 직업군 + 홈 '단원' 칸 아래 세부 요구사항 — 키워드 · PDF · 내 서재 어디서 시작해도 함께 보내요
  // [index5] 서재 단원 출제 방법(args.plan)으로 시작하면 그 요구사항 · 방식 · 단계 · 문항 수를, 아니면 홈 값을 써요
  const p = args.plan;
  const run = { mode: p ? p.mode : st.mode, fixedLevel: p ? p.level : st.fixedLevel, count: p ? p.count : st.count };
  const custom = {
    persona: (S.user && S.user.persona) || null,
    customPrompt: String((p ? p.prompt : st.customPrompt) || '').trim().slice(0, PROMPT_MAX),
  };
  try {
    // 로딩 단계가 너무 짧게 깜빡이지 않도록 최소 표시 시간(1.2초)과 함께 기다려요
    // [변경] 페이로드: query 한 줄 대신 subjectName · topicName을 따로 보내요 (PDF 탭이면 pdfNames · pdfUnit)
    const [plan] = await Promise.all([
      Api.extractConcepts({
        source: args.source, subjectName: args.subjectName || null, topicName: args.topicName || null,
        pdfNames: args.pdfs || null, pdfUnit: args.pdfs ? args.pdfUnit || null : null, // [index5] 교재 PDF 여러 개
        mode: run.mode, fixedLevel: run.fixedLevel, count: run.count,
        ...custom,
        fresh: !!args.fresh, // [index5] 내 서재 ▶: 이 사용자가 푼 적 없는 문항을 우선해 달라는 요청
      }),
      wait(1200),
    ]);
    if (!plan || !BANKS[plan.bankId]) throw new ApiError('진단 계획을 받지 못했어요.', { code: 'BAD_RESPONSE' });
    const sess = createSession({
      bankId: plan.bankId, subject: plan.subject, topic: plan.topic, domain: plan.domain,
      exact: plan.exact, userTopic: args.label, subjectName: args.subjectName, topicName: args.topicName,
      mode: run.mode, fixedLevel: run.fixedLevel, total: run.count,
      customPrompt: custom.customPrompt, fresh: !!args.fresh,
    });
    if (args.fresh) markSeenFromHistory(sess); // [index5] 예전에 푼 문항을 '오래된 순'으로 표시 → 안 푼 문항부터
    // [index5] 내 서재 자동 저장은 '결과까지 본 진단'만 — 여기서는 저장할 과목 · 단원 · 출제 방법만 세션에 적어 두고(libPending)
    //          finishSession()에서 결과를 만들 때 libAdd()해요. 준비만 하고 나가거나 [진단 삭제]한 단원 · 오타 단원은 서재에 쌓이지 않아요
    //          키워드 = 입력한 과목 · 단원 / PDF = AI가 분류한 과목 + 단원 · 챕터(없으면 파일 이름) · 서재에 이미 있는 단원이면 사용 기록만 갱신
    const libSub = args.source === 'pdf' ? plan.subject : args.subjectName;
    const libUnit = args.source === 'pdf' ? args.label : args.topicName; // PDF = 단원 · 챕터, 비었으면 '첫 파일 이름 (외 N개)'
    sess.libPending = args.saveLib ? { sub: libSub, unit: libUnit, plan: { prompt: custom.customPrompt, mode: run.mode, level: run.fixedLevel, count: run.count } } : null;
    const touched = libTouch(libSub, libUnit);
    sess.libUid = args.libUid || (touched && touched.id) || null; // 결과의 [다시 진단하기]가 이 단원 출제 방법으로 다시 시작할 수 있게
    await loader.finish(plan.subject);
    RT.preparing = false;
    S.session = sess;
    S.parked = null;
    save();
    go('ready');
  } catch (e) {
    RT.preparing = false;
    RT.prepRetry = () => prepareDiagnosis(args);
    RT.prepLoader = loader;
    Sound.play('alert');
    if (e && e.code === 'NO_MATCH') loader.noMatch(e.data && e.data.available);
    else loader.fail(apiErrorMessage(e));
  }
}

function beginQuiz() {
  const s = S.session;
  if (!s) return go('home');
  // 첫 진단 전에 한 번: 확신도 100 · 70 · 30%의 기준(앵커)을 알려 줘야 확신도 데이터가 정확해져요
  if (!S.seenAnchors) return openAnchorSheet();
  if (s.kind === 'main' && s.status === 'ready') track('diag_start', { sid: s.id });
  s.status = 'active';
  if (!s.current) advance(s);
  save();
  go('quiz');
}

function resumeSession() {
  const s = S.session;
  if (!s) return;
  if (s.status === 'ready') return go('ready');
  if (!s.current && !advance(s)) return finishSession(false);
  if (s.current.phase === 'answering') { resetTiming(s.current); resetAnswer(s.current); }
  save();
  go('quiz');
  if (s.current.phase === 'speedcheck') openSpeedSheet(s.logs[s.current.logIndex]);
}

function selectOption(i) {
  const cur = S.session && S.session.current;
  if (!cur || cur.phase !== 'answering' || i < 0 || i > 3 || RT.submitting) return; // 채점 중에는 보기 변경 잠금
  if (cur.firstClickMs === null) cur.firstClickMs = Math.round(activeMs(cur));
  if (cur.selected !== null && cur.selected !== i) cur.hesitation += 1; // 번복은 조용히 기록만
  cur.selected = i;
  Sound.play('select');
  saveSoon();
  renderQuiz(i);
}

function branchMsg(s, cur, log, branch) {
  if (s.kind === 'retry') {
    if (!log.correct) return '아직 헷갈려요. 해설을 읽고 내 답과 정답의 차이를 정리해 보세요.';
    if (log.conf === 'LOW') return '맞혔지만 아직 찍은 수준이에요. 확신이 생길 때까지 한 번 더 복습해 보세요.';
    // [변경] 착각 문항은 100% 확신으로 맞혀야 해소 (70%로 맞힌 건 아직 '안다는 느낌'을 확인하지 못한 상태)
    if (retryNeedsHigh(s) && log.conf !== 'HIGH') return '맞혔어요! 다만 착각 문항은 😎 100% 확신으로 맞혀야 해소돼요. 확신이 설 때 다시 도전해 보세요.';
    return '재도전 성공! 복습 카드가 해소 처리돼요.';
  }
  const parts = [];
  if (cur.isVerify) parts.push(log.correct ? '확인 문항 통과 — 앞 문제도 실력으로 인정했어요.' : '확인 문항 실패 — 앞 문제의 정답은 요행으로 기록돼요.');
  if (log.correct && log.conf === 'LOW') parts.push('🍀 운이 좋았네요! 복습 덱에서 유사 문제로 진짜 실력인지 다시 확인해 봐요.');
  const last = s.logs.length >= s.total && !s.pendingVerify;
  if (last) {
    parts.push('모든 문항을 풀었어요. 결과를 확인해 보세요.');
  } else if (s.mode === 'ADAPTIVE' && branch) {
    const name = conceptOf(s.bankId, cur.cid).name;
    if (branch.to > branch.from) parts.push(`'${name}'의 다음 문제는 ${LEVELS[branch.to].icon} ${branch.to}단계(${LEVELS[branch.to].short})로 올라가요.`);
    else if (branch.to < branch.from) parts.push(`'${name}'의 다음 문제는 ${LEVELS[branch.to].icon} ${branch.to}단계(${LEVELS[branch.to].short})로 내려가 기초를 확인해요.`);
    else parts.push(branch.to === 3 ? `'${name}'은(는) 최고 단계(심화)를 유지해요.` : `'${name}'은(는) 같은 단계로 한 번 더 확인해요.`);
  }
  return parts.join(' ');
}

/** 확신도 버튼 = 제출 — ② Api.submitAnswer로 채점을 받고, 응답이 오면 분기 · 피드백을 적용해요 */
async function submitAnswer(conf) {
  const s = S.session, cur = s && s.current;
  if (!cur || cur.phase !== 'answering' || cur.selected === null || !CONF[conf] || RT.submitting) return;
  const q = getQ(cur.qid);
  // 풀이 시간은 누른 순간 고정 → 네트워크 대기 시간이 '성급 · 지연' 판정에 섞이지 않아요
  const ms = Math.round(activeMs(cur));
  const chosen = cur.order[cur.selected];
  RT.submitting = conf;
  stopTicker();
  pauseTimer();
  setDockBusy(conf);
  let res;
  try {
    res = await Api.submitAnswer(s.id, {
      qid: q.id, chosen, conf, elapsedMs: ms, hesitation: cur.hesitation, firstClickMs: cur.firstClickMs,
      tabOut: cur.tabOut, isVerify: cur.isVerify, mode: s.mode, level: q.lv,
    });
  } catch (e) {
    RT.submitting = null;
    if (S.session !== s || s.current !== cur || S.view !== 'quiz') return;
    resumeTimer();              // 기다린 시간은 풀이 시간에서 빼고 다시 시작
    renderQuiz();               // 확신도 버튼 복구 (고른 보기는 그대로)
    startTicker();
    Sound.play('alert');
    toast(`${apiErrorMessage(e)} 확신도를 다시 눌러 주세요`, { ms: 3200, tone: 'warn' });
    return;
  }
  RT.submitting = null;
  // 응답을 기다리는 사이 화면을 떠났거나 다른 문제가 됐다면 결과를 버려요
  if (S.session !== s || s.current !== cur || cur.phase !== 'answering') return;
  applyGrading(s, cur, q, { chosen, conf, ms, res });
}
/** 누른 확신도 버튼만 '채점 중' 스피너, 나머지는 잠금 */
function setDockBusy(conf) {
  document.querySelectorAll('#dock [data-action="conf"]').forEach((b) => {
    b.disabled = true;
    if (b.dataset.conf !== conf) return;
    b.setAttribute('aria-busy', 'true');
    b.style.opacity = '1';
    b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-[20px]" aria-hidden="true"></i><span class="text-[13px] font-extrabold leading-none">채점 중</span>';
  });
}
/** 서버 채점 결과를 세션에 반영 (Speed Limit · 확인 문항 · 적응형 분기 · 효과음) */
function applyGrading(s, cur, q, { chosen, conf, ms, res }) {
  RT.pausedAt = null;
  RT.hiddenAt = null;
  const correct = !!res.correct;
  const std = res.stdSec || standardSec(q);
  const ratio = ms / 1000 / std;
  const log = {
    qid: q.id, cid: q.c, lv: q.lv, chosen, correct, conf, ms, stdSec: std,
    ratio: Math.round(ratio * 100) / 100, hesitation: cur.hesitation, firstClickMs: cur.firstClickMs,
    tabOut: cur.tabOut, speedFlag: ratio < SPEED_LIMIT, isVerify: cur.isVerify, repeat: cur.repeat,
    verifyResult: null, at: Date.now(),
  };
  s.logs.push(log);
  cur.logIndex = s.logs.length - 1;

  // Speed Limit 방어: 성급하게 맞혔다면 정답 공개 없이 같은 개념 · 단계의 유사 문항으로 재검증
  if (log.speedFlag && correct && !cur.isVerify && s.kind !== 'retry' && pickQuestion(s, q.c, q.lv, { unusedOnly: true })) {
    log.verifyPending = true;
    s.pendingVerify = { cid: q.c, lv: q.lv, logIndex: cur.logIndex, served: false };
    cur.phase = 'speedcheck';
    save();
    renderQuiz();
    Sound.play('alert');
    openSpeedSheet(log);
    return;
  }
  if (cur.isVerify && s.pendingVerify) {
    const src = s.logs[s.pendingVerify.logIndex];
    if (src) { src.verifyResult = correct; src.verifyPending = false; }
    s.pendingVerify = null;
  }
  // 적응형 분기: 서버가 돌려준 다음 난이도(nextLevel)를 적용
  const to = s.mode === 'ADAPTIVE' && res.nextLevel ? res.nextLevel : q.lv;
  if (s.mode === 'ADAPTIVE') s.levels[q.c] = to;
  const branch = { from: q.lv, to };
  cur.phase = 'feedback';
  cur.msg = branchMsg(s, cur, log, branch);
  save();
  renderQuiz();
  // [변경] 문항마다 터지던 폭죽은 없앴어요 (몰입 방해 + 100% 확신에 정서적 보상이 붙으면 확신도를 부풀리게 돼요)
  const judged = classifyItem(log).status;
  if (!correct) Sound.play('wrong');
  else if (judged === 'MASTERY') Sound.play('mastery');
  else Sound.play('correct');
}
/** 재도전 중인 문항이 원래 '착각'이었는지 — 착각은 100% 확신 정답이어야 해소 */
function retryNeedsHigh(s) {
  const h = s && s.retryOf && findEntry(s.retryOf.entryId);
  const it = h && reviewItems(h).find((i) => i.qid === s.retryOf.qid);
  return !!(it && it.status === 'ILLUSION');
}

function nextStep() {
  const s = S.session;
  if (!s || !s.current || s.current.phase !== 'feedback') return;
  if (s.kind === 'retry') return finishRetry();
  if (!advance(s)) return finishSession(false);
  save();
  renderQuiz();
  window.scrollTo(0, 0);
}

function speedContinue() {
  const s = S.session;
  closeSheet();
  if (!s || !s.current || s.current.phase !== 'speedcheck') return;
  if (!advance(s)) return finishSession(false);
  save();
  renderQuiz();
  window.scrollTo(0, 0);
}

function finishSession(early) {
  const s = S.session;
  stopTicker();
  if (!s) return go('home');
  if (s.pendingVerify) {
    const src = s.logs[s.pendingVerify.logIndex];
    if (src) src.verifyPending = false;
    s.pendingVerify = null;
  }
  if (!s.logs.length) { S.session = null; save(); return go('home'); }
  const entry = {
    id: uid('h'), date: new Date().toISOString(), bankId: s.bankId, subject: s.subject, topic: s.topic, domain: s.domain,
    subjectName: s.subjectName || '', topicName: s.topicName || '',
    libUid: s.libUid || null, // [index5] 내 서재 단원으로 푼 진단
    kind: s.kind, mode: s.mode, fixedLevel: s.fixedLevel, total: s.total, modeLabel: modeLabel(s),
    early: !!early || s.logs.length < s.total,
    logs: s.logs.map(({ verifyPending, ...rest }) => rest),
    review: {},
  };
  // [index5] 내 서재 자동 저장: 결과를 만드는 이 시점에만 (prepareDiagnosis가 적어 둔 libPending) — 새 단원이면 이번 출제 방법도 함께 기억
  let libSaved = null;
  if (s.libPending) {
    const r = libAdd(s.libPending.sub, s.libPending.unit, s.libPending.plan);
    if (r.ok) { if (!entry.libUid) entry.libUid = r.unit.id; if (r.added) libSaved = r; }
  }
  const ev = refreshSummary(entry);
  if (s.kind === 'main') track('diag_complete', { sid: s.id, hid: entry.id, early: entry.early });
  S.history.unshift(entry);
  S.history = S.history.slice(0, HISTORY_MAX);
  S.session = null;
  S.resultId = entry.id;
  S.reviewId = entry.id;
  RT.logOpen = false;
  RT.resultTab = 'summary';
  RT.reviewIndex = 0;
  RT.reviewFilter = 'ALL';
  save();
  go('result');
  // [index5] 팡파르 + 폭죽은 결과가 좋을 때만(착각 0 · 정답률 80% 이상) — 예전엔 끝까지 풀기만 하면 0점이어도 터져 어색했어요 (그 밖엔 아래 알림만)
  if (!entry.early && ev.counts.ILLUSION === 0 && ev.accuracy >= 0.8) celebrate(true);
  toast(entry.early ? '지금까지 푼 문항으로 결과를 만들었어요' : '진단 완료! 결과를 확인해 보세요');
  if (libSaved) toast(`내 서재에 저장했어요 · ${libSaved.sub.name} › ${libSaved.unit.name}`);
}

function startPractice(id, cid, lv) {
  const h = findEntry(id);
  if (!h || !BANKS[h.bankId]) return;
  confirmReplaceThen(() => {
    closeSheet();
    const s = createSession({ bankId: h.bankId, subject: h.subject, topic: h.topic, domain: h.domain, exact: true, mode: 'FIXED', fixedLevel: lv, total: 3, kind: 'practice', conceptIds: [cid] });
    s.status = 'active';
    advance(s);
    S.session = s;
    save();
    go('quiz');
    toast(`'${conceptOf(h.bankId, cid).name}' ${LEVELS[lv].short} 단계 3문항을 풀어요`);
  });
}

/** 복습 카드의 "유사 문제": 같은 개념 · 같은 단계의 다른 문항 1개 */
function startRetry(id, qid) {
  const h = findEntry(id), orig = getQ(qid);
  if (!h || !orig) return;
  const s = createSession({ bankId: h.bankId, subject: h.subject, topic: h.topic, domain: h.domain, exact: true, mode: 'FIXED', fixedLevel: orig.lv, total: 1, kind: 'retry', conceptIds: [orig.c], retryOf: { entryId: id, qid } });
  h.logs.forEach((l) => { s.used[l.qid] = 0; });
  let p = pickQuestion(s, orig.c, orig.lv, { excludeId: qid });
  if (!p) {
    for (const lv of [1, 2, 3].filter((l) => l !== orig.lv).sort((a, b) => Math.abs(a - orig.lv) - Math.abs(b - orig.lv))) {
      p = pickQuestion(s, orig.c, lv, { excludeId: qid });
      if (p) break;
    }
  }
  if (!p) p = { q: orig, repeat: true };
  s.status = 'active';
  setCurrent(s, p.q, { repeat: p.repeat });
  if (S.session && S.session.kind !== 'retry') S.parked = S.session; // 진행 중이던 진단은 잠시 보관
  S.session = s;
  save();
  go('quiz');
}

/** [index5] 유사 문제 다시 생성: 지금 문항을 버리고 같은 개념 · 같은 단계의 다른 문항으로 바꿔요
 *  후보 = 문제은행(BANKS)에서 같은 개념 · 단계 − 지금 문항 − 원래 틀린 문항
 *  우선순위: 이번 재도전에서 아직 안 본 문항(원 진단에도 없던 문항 → 원 진단에 나왔던 문항) → 가장 오래전에 본 문항
 *  (startRetry가 원 진단 문항을 used = 0으로 표시해 둬서, used 값으로 세 그룹을 가를 수 있어요) */
function regenRetry() {
  const s = S.session, cur = s && s.current;
  if (!s || s.kind !== 'retry' || !cur || cur.phase !== 'answering' || RT.submitting) return;
  const pool = BANKS[s.bankId].questions.filter((q) => q.c === cur.cid && q.lv === cur.lv && q.id !== cur.qid && q.id !== s.retryOf.qid);
  if (!pool.length) { toast('같은 개념 · 단계의 다른 문제가 더 없어요', { tone: 'warn' }); return; }
  const tier = (q) => (!(q.id in s.used) ? 0 : s.used[q.id] === 0 ? 1 : 2);
  const best = Math.min(...pool.map(tier));
  const cands = pool.filter((q) => tier(q) === best);
  const q = best < 2 ? cands[Math.floor(Math.random() * cands.length)] : cands.sort((a, b) => s.used[a.id] - s.used[b.id])[0];
  cancelLongPress();
  setCurrent(s, q, { repeat: best === 2 }); // 풀이 시간 · 번복 · 보기 순서도 새 문항 기준으로 처음부터
  save();
  renderQuiz();
  Sound.play('flip');
  toast('새로운 유사 문제를 불러왔어요');
}

/** [변경] 재도전 해소 조건: 착각 문항은 100% 확신 정답, 그 밖의 문항은 70% 이상 확신 정답 */
function finishRetry() {
  const s = S.session, log = s.logs[0], h = findEntry(s.retryOf.entryId);
  const needHigh = retryNeedsHigh(s);
  const solved = !!(log && log.correct && (needHigh ? log.conf === 'HIGH' : log.conf !== 'LOW'));
  if (h && log) {
    const r = h.review[s.retryOf.qid] || (h.review[s.retryOf.qid] = {});
    const wasResolved = !!r.done; // 이미 해소한 문항을 다시 풀었다면 → '해소 후 정답 유지율' 지표
    r.retry = { correct: log.correct, conf: log.conf, qid: log.qid };
    if (solved) { r.done = true; r.pinned = false; r.via = 'retry'; }
    markReviewed(h);
    track('retry', { hid: h.id, qid: s.retryOf.qid, correct: log.correct, conf: log.conf, wasResolved });
  }
  S.session = S.parked || null;
  S.parked = null;
  S.reviewId = s.retryOf.entryId;
  RT.flipped = false;
  save();
  go('review');
  toast(solved ? '재도전 성공! 해소 처리했어요'
    : log && log.correct && needHigh ? '맞혔지만 착각 문항은 100% 확신으로 맞혀야 해소돼요'
    : '재도전 결과를 기록했어요', { ms: 3000 });
  celebrateIfDone(h);
}

function celebrateIfDone(h) {
  if (!h) return;
  const items = reviewItems(h);
  if (items.length && items.every((i) => (h.review[i.qid] || {}).done) && !S.celebrated[h.id]) {
    S.celebrated[h.id] = true;
    save();
    celebrate(true); // 복습 전부 해소: 팡파르 + 폭죽
  }
}

function toggleDone(id, qid) {
  const h = findEntry(id);
  if (!h) return;
  const r = h.review[qid] || (h.review[qid] = {});
  if (!r.done && resolveGuard(h, qid)) return; // 착각 · 찍어서 맞힘은 자기 신고로 해소 불가
  r.done = !r.done;
  if (r.done) { r.pinned = false; r.via = r.via || 'self'; markReviewed(h); }
  else r.via = null;
  save();
  Sound.play(r.done ? 'correct' : 'tap');
  // 카드 보기에서는 해소하면 다음 미해소 카드로 자동 이동
  if (r.done && S.prefs.reviewMode === 'card') {
    const items = reviewFiltered();
    const pos = items.findIndex((i) => i.h.id === id && i.qid === qid);
    const next = items.findIndex((i, n) => n > pos && !(i.h.review[i.qid] || {}).done);
    if (next > -1) { RT.reviewIndex = next; RT.flipped = false; }
  }
  renderReview();
  chrome();
  toast(r.done ? '해소했어요! 다음 카드로 넘어갈게요' : '다시 복습 대상으로 돌렸어요');
  celebrateIfDone(h);
}

function moveCard(d) {
  const n = reviewFiltered().length;
  if (!n) return;
  const to = Math.min(n - 1, Math.max(0, RT.reviewIndex + d));
  if (to === RT.reviewIndex) return;
  RT.reviewIndex = to;
  RT.flipped = false;
  renderReview();
}

function flipCard() {
  if (!S.prefs.reviewIntroSeen) { S.prefs.reviewIntroSeen = true; saveSoon(); } // [index5] 뒤집는 법을 알았으니 다음 방문부터 안내를 숨겨요

  });

}

function handlePdfs(fileList) {
  const files = [...(fileList || [])];
  if (!files.length) return;
  const cur = S.setup.pdfs || [];
  const next = cur.slice();
  const skip = { type: 0, size: 0, dup: 0, full: 0 };
  files.forEach((file) => {
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { skip.type++; return; }
    if (file.size > PDF_MAX_MB * 1048576) { skip.size++; return; }
    if (next.some((x) => x.name === file.name && x.bytes === file.size)) { skip.dup++; return; } // 같은 파일을 두 번 올린 경우
    if (next.length >= PDF_MAX_FILES) { skip.full++; return; }
    next.push({ id: uid('pf'), name: file.name, bytes: file.size });
  });
  const added = next.length - cur.length;
  const why = [
    skip.type && `PDF가 아닌 파일 ${skip.type}개`, skip.size && `${PDF_MAX_MB}MB가 넘는 파일 ${skip.size}개`,
    skip.dup && `이미 올린 파일 ${skip.dup}개`, skip.full && `${PDF_MAX_FILES}개를 넘는 파일 ${skip.full}개`,
  ].filter(Boolean).join(', ');
  if (!added) { toast(why ? `${why}는 올릴 수 없어요` : '올릴 PDF가 없어요', { tone: 'warn' }); return; }
  S.setup.pdfs = next; // 새 배열로 바꿔요 (기본값 배열과 공유하지 않게)
  if (!S.setup.pdfUnit && !cur.length) S.setup.pdfUnit = next[0].name.replace(/\.pdf$/i, ''); // 처음 올릴 때만 첫 파일 이름으로 채워요
  save();
  if (S.view === 'home') { RT.homeTab = 'pdf'; if (!RT.sheet) renderHome({ quiet: true }); } // 키워드 탭에 떨어뜨려도 PDF 탭으로 전환
  Sound.play('select');
  toast(why ? `PDF ${added}개를 올렸어요 · ${why}는 뺐어요` : next.length > 1 ? `PDF ${added}개를 올렸어요 · 모두 ${next.length}개를 합쳐서 진단해요` : 'PDF를 올렸어요. 단원 · 챕터를 적으면 더 정확해요', why ? { tone: 'warn' } : undefined);
}

const personaChipCls = (on) => `min-h-[48px] px-2 py-2 rounded-xl text-[13px] font-bold leading-snug text-center flex items-center justify-center gap-1.5 break-keep transition ${on ? 'bg-brand-50 text-brand-700 ring-2 ring-brand-500' : 'bg-ink-50 text-ink-700 ring-1 ring-ink-200 hover:ring-brand-300'}`;

function handleAuth(form) {
  const fd = new FormData(form);
  const reg = form.dataset.tab === 'register';
  const email = String(fd.get('email') || '').trim();
  const name = String(fd.get('name') || '').trim();
  const err = $('#auth-error');
  // [index5] 오류 문구만 띄우면 어느 칸 때문인지 찾아야 해서 → 잘못된 칸을 빨갛게(aria-invalid) 표시 · 문구와 연결(aria-describedby) · 흔들고 포커스
  //          (먼저 걸린 칸 하나만 · 그 칸을 고치기 시작하면 표시와 문구가 사라져요: 아래 input 핸들러)
  const fail = (m, fieldId) => {
    form.querySelectorAll('.field[aria-invalid]').forEach((f) => { f.removeAttribute('aria-invalid'); f.removeAttribute('aria-describedby'); });
    err.textContent = m; err.classList.remove('hidden');
    const f = fieldId && $('#' + fieldId, form);
    if (f) { f.setAttribute('aria-invalid', 'true'); f.setAttribute('aria-describedby', 'auth-error'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); f.focus(); }
  };
  if (reg && !name) return fail('이름 또는 닉네임을 입력해 주세요.', 'f-name');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('올바른 이메일 형식을 입력해 주세요.', 'f-email');
  const persona = String(fd.get('persona') || '');
  S.user = { nickname: reg ? name : email.split('@')[0], email, guest: false };
  if (reg && PERSONAS[persona]) S.user.persona = persona; // [index5] 직업군 (고르지 않으면 저장하지 않음)
  closeSheet();
  save();
  go('home');
  toast(`${S.user.nickname}님, 환영해요`);
}

/** [index5] 기록 이름 (복습 선택 시트 · 복습 덱 '지금 보는 복습')
 *  집중 연습은 단원 이름(h.topic)만으로는 본 진단 · 다른 연습과 똑같이 보여서 → 연습한 개념 이름으로 ('은행원 알고리즘과 회피')
 *  단계 · 문항 수는 practiceTag()로 설명 줄에 ('집중 연습 · 🌱 기초 3문항') */
function entryTitle(h) {
  if ((h.kind || 'main') !== 'practice') return h.topic;
  const l = h.logs && h.logs[0];
  const cid = l && (l.cid || (getQ(l.qid) || {}).c);
  const c = cid && BANKS[h.bankId] && BANKS[h.bankId].concepts.find((x) => x.id === cid);
  return c ? c.name : h.topic;
}
const practiceTag = (h) => `집중 연습 · ${LEVELS[h.fixedLevel] ? `${LEVELS[h.fixedLevel].icon} ${LEVELS[h.fixedLevel].short} ` : ''}${h.total || 3}문항`;

/** [index5] 복습 선택 시트 — 과목별로 묶어서 보여 줘요 (과목 칩과 같은 기준 · 같은 선택 상태)
 *  맨 위 '모든 과목 모아보기'(과목이 2개 이상일 때만 — 하나뿐이면 아래 '이 과목 전체 모아보기'와 같은 덱이에요)
 *  → 과목마다 [이 과목 전체 모아보기](진단 2개 이상일 때) + 그 과목의 진단들(최근 순)
 *  진단 줄: 메타인지 점수 · 단원 · 회차 · 날짜 시각 · 정답률 · 남은 착각 — 같은 단원을 여러 번 풀어도 구분돼요
 *  글씨를 키우고(제목 16px · 설명 13px) 배경과 대비가 큰 흰 카드 + 테두리로 바꿨어요 */
function openSessionPicker() {
  const list = realHistory().filter((h) => reviewItems(h).length);
  if (!list.length) return toast('복습할 수 있는 진단이 없어요');
  const cur = RT.reviewScope === 'all' ? null : reviewEntry();
  const allOn = RT.reviewScope === 'all' && RT.reviewSubject === 'ALL';
  const total = totalUnresolved();
  const groups = reviewSubjects().map((g) => ({ ...g, entries: list.filter((h) => h.subject === g.subject).sort((a, b) => new Date(b.date) - new Date(a.date)) }));
  const unTag = (n) => `<span class="shrink-0 chip !text-[13px] ${n ? 'bg-illusion-50 text-illusion-700' : 'bg-mastery-50 text-mastery-700'}">${n ? `착각 ${n}` : '✓ 해소'}</span>`;
  const rowCls = (on) => `w-full p-3.5 rounded-2xl flex items-center gap-3 text-left transition ${on ? 'bg-brand-50 ring-2 ring-brand-500' : 'bg-surface ring-1 ring-ink-200 hover:ring-brand-300'}`;
  const when = (iso) => { const d = new Date(iso); return `${relDay(iso)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  openSheet(`
    <h3 class="text-[20px] font-extrabold">어떤 복습을 볼까요?</h3>
    <p class="mt-1 text-sm text-ink-600 break-keep">과목을 고르면 그 과목의 모든 진단을 한 덱으로 모아 봐요. 진단 하나만 골라 볼 수도 있어요.</p>
    <div class="mt-4 space-y-2">
      ${groups.length > 1 ? `<button type="button" class="${rowCls(allOn)}" data-action="select-review" data-id="all">
        <span class="w-11 shrink-0 grid place-items-center text-2xl" aria-hidden="true">📚</span>
        <span class="min-w-0 flex-1"><span class="block text-[16px] font-extrabold text-ink-900">모든 과목 모아보기</span><span class="block mt-0.5 text-[13px] font-medium text-ink-600">과목 ${groups.length}개 · 진단 ${list.length}개를 한 덱에서</span></span>
        ${unTag(total)}
      </button>` : ''}
      ${groups.map((g) => {
        const on = RT.reviewScope === 'all' && (RT.reviewSubject === g.subject || (RT.reviewSubject === 'ALL' && groups.length === 1)); // 과목이 하나면 '모두 모아보기' = 이 과목
        const un = g.entries.reduce((n, h) => n + unresolvedCount(h), 0);
        return `
      <section class="pt-3" aria-label="${esc(g.subject)}">
        <h4 class="px-1 flex items-center gap-2 text-[15px] font-extrabold text-ink-900"><span aria-hidden="true">${BANK_EMOJI[g.bankId] || '📘'}</span>${esc(g.subject)}<span class="text-[13px] font-bold text-ink-500">진단 ${g.entries.length}개</span></h4>
        <div class="mt-2 space-y-2">
          ${g.entries.length > 1 ? `<button type="button" class="${rowCls(on)}" data-action="select-review" data-id="subject" data-k="${esc(g.subject)}">
            <span class="w-11 shrink-0 grid place-items-center text-xl" aria-hidden="true">🗂️</span>
            <span class="min-w-0 flex-1"><span class="block text-[16px] font-extrabold text-ink-900">이 과목 전체 모아보기</span><span class="block mt-0.5 text-[13px] font-medium text-ink-600">진단 ${g.entries.length}개의 복습을 한 덱에서</span></span>
            ${unTag(un)}
          </button>` : ''}
          ${g.entries.map((h) => `<button type="button" class="${rowCls(cur && cur.id === h.id)}" data-action="select-review" data-id="${h.id}">
            <span class="w-12 shrink-0 text-center"><span class="block text-[20px] font-black leading-none text-ink-900 tnum">${h.summary.calibration}</span><span class="block mt-1 text-[11px] font-bold text-ink-500">메타인지</span></span>
            <span class="min-w-0 flex-1"><span class="block text-[16px] font-bold text-ink-900 truncate">${esc(entryTitle(h))}</span><span class="block mt-0.5 text-[13px] font-medium text-ink-600">${(h.kind || 'main') === 'main' ? `${roundsOf(h).length}회차` : practiceTag(h)} · ${when(h.date)} · 정답률 ${pct(h.summary.accuracy)}%</span></span>
            ${unTag(unresolvedCount(h))}
          </button>`).join('')}
        </div>
      </section>`;
      }).join('')}
    </div>`, { name: 'picker' });
}

function tapFlip(e) {
  if (S.view !== 'review' || !e.target.closest || !e.target.closest('[data-tapflip] .flip-face')) return;
  if (e.target.closest('a, button, input, textarea, select, label, summary, [data-tip]')) return;
  if (Date.now() - RT.swipedAt < 400) return;
  if (window.getSelection && String(window.getSelection()).length) return;
  flipCard();
}
// 효과음: 동작마다 고유 효과음이 있으면 기본 클릭음은 건너뛰어요
const QUIET_ACTIONS = new Set(['conf', 'option', 'flip', 'toggle-done', 'toggle-sound', 'set-sound']);
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) { tapFlip(e); return; }
  if (el.disabled) return;
  if (RT.lpSuppress && el.dataset.action === 'option') { RT.lpSuppress = false; return; } // [index5] 롱프레스로 이미 제출한 뒤 따라오는 click
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  if (!QUIET_ACTIONS.has(el.dataset.action)) Sound.play('tap');
  fn(el, e);
});

$('#sheet-root').addEventListener('click', (e) => {

document.addEventListener('input', (e) => {

    e.target.removeAttribute('aria-invalid'); e.target.removeAttribute('aria-describedby');

  const key = e.target.dataset && e.target.dataset.bind;

  if (key === 'customPrompt') syncQuickChips(); // [index5] 직접 지우거나 고쳐 쓰면 빠른 입력 칩 켜짐 표시도 따라가요
  if (e.target.id === 'lp-prompt' && RT.libDraft) { RT.libDraft.prompt = e.target.value; syncLpChips(); } // [index5] 출제 방법 시트
  if (e.target.id === 'lp-name' && RT.libDraft) RT.libDraft.name = e.target.value;                         // [index5] 단원 수정 시트 · 이름

document.addEventListener('pointerdown', (e) => {
  const grip = e.target.closest && e.target.closest('.sheet-grip');
  if (!grip || !RT.sheet || !RT.sheet.dismissible) return;
  const panel = grip.closest('.sheet-panel');

/* [index5] 롱프레스 100% 제출 — 보기를 LONG_PRESS_MS 동안 누르고 있으면 😎 100% 확신으로 바로 제출
 *  마우스 · 터치 · 펜을 한 번에 다루는 Pointer Events를 써요 (mousedown/touchstart를 따로 달면 터치에서 두 번 불려요)
 *   시작: pointerdown → 타이머 + .is-pressing(CSS로 테두리 프로그레스 링이 한 바퀴 돎)
 *   취소: pointerup(짧게 누름 → 이어지는 click이 기존처럼 보기만 선택) · pointercancel(스크롤 시작) · 버튼 밖으로 나감 · 10px 넘게 움직임
 *   발동: selectOption(i) → submitAnswer('HIGH'). 손을 뗄 때 따라오는 click은 RT.lpSuppress로 한 번 무시 */
/** [index5] 짧은 햅틱(진동) — 지원하는 기기(주로 Android)에서만. iOS Safari 등은 navigator.vibrate가 없어 아무 일도 없어요
 *  사용자가 화면을 한 번이라도 만진 뒤에만 부르고(브라우저 개입 경고 방지), 혹시 던져도 앱이 멈추지 않게 try로 감싸요 */
function haptic(ms) {
  try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(ms); } catch (e) { /* 무시 */ }
}
// @property(CSS.registerProperty)를 모르는 브라우저는 각도 전환이 안 되므로, 링이 서서히 진해지는 대체 CSS(.no-prop)를 써요
if (!(window.CSS && CSS.registerProperty)) document.documentElement.classList.add('no-prop');
function cancelLongPress() {
  const lp = RT.lp;
  if (!lp) return;
  clearTimeout(lp.t);
  lp.el.classList.remove('is-pressing');
  RT.lp = null;
}
function fireLongPress() {
  const lp = RT.lp;
  RT.lp = null;
  if (!lp) return;
  lp.el.classList.remove('is-pressing');
  const cur = S.session && S.session.current;
  if (!cur || cur.phase !== 'answering' || RT.submitting || S.view !== 'quiz') return;
  RT.lpSuppress = true;
  haptic(15); // [index5] 링이 다 찬 순간 = 제출 확정 → 가벼운 진동 한 번
  track('longpress_submit', { qid: cur.qid });
  selectOption(lp.i);   // 번복 · 첫 클릭 시간 기록은 짧게 누를 때와 똑같이
  submitAnswer('HIGH');
}
document.addEventListener('pointerdown', (e) => {
  RT.lpSuppress = false;
  const el = e.target.closest && e.target.closest('#view-quiz [data-action="option"]');
  if (!el || el.disabled || e.button !== 0) return;
  const cur = S.session && S.session.current;
  if (!cur || cur.phase !== 'answering' || RT.submitting) return;
  cancelLongPress();
  el.classList.add('is-pressing');
  RT.lp = { el, i: Number(el.dataset.i), x: e.clientX, y: e.clientY, t: setTimeout(fireLongPress, LONG_PRESS_MS) };
});
document.addEventListener('pointermove', (e) => { if (RT.lp && Math.hypot(e.clientX - RT.lp.x, e.clientY - RT.lp.y) > 10) cancelLongPress(); });
document.addEventListener('pointerup', cancelLongPress);
document.addEventListener('pointercancel', cancelLongPress);
document.addEventListener('pointerout', (e) => { if (RT.lp && e.target === RT.lp.el && !RT.lp.el.contains(e.relatedTarget)) cancelLongPress(); });
document.addEventListener('contextmenu', (e) => { if (e.target.closest && e.target.closest('#view-quiz [data-action="option"]')) e.preventDefault(); });

// 플래시카드 좌우 스와이프
document.addEventListener('pointerdown', (e) => { if (e.target.closest && e.target.closest('[data-swipe]') && !e.target.closest('textarea, input, button')) RT.swipeX = e.clientX; });
document.addEventListener('pointerup', (e) => {
  if (RT.swipeX == null) return;
  const dx = e.clientX - RT.swipeX;
  RT.swipeX = null;
  if (S.view === 'review' && Math.abs(dx) > 60) { RT.swipedAt = Date.now(); moveCard(dx < 0 ? 1 : -1); }
});

document.addEventListener('keydown', (e) => {
  const t = e.target;
  // 키워드 탭: 과목 칸 Enter → 단원 칸으로 이동, 단원 칸 Enter → 진단 시작 (빈 칸이 있으면 그 칸을 흔들어 알려 줘요)
  // [진단 시작]이 비활성이면 브라우저가 Enter 제출을 막으므로 직접 처리 · 한글 조합 중 Enter(229)는 무시
  if (t.id === 'lib-edit-input' && e.key === 'Escape') { e.preventDefault(); libCancelEdit(); return; } // [index5] 내 서재 이름 고치기 취소
  if ((t.id === 'in-subject' || t.id === 'in-topic') && e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    const st = S.setup;
    if (t.id === 'in-subject' && st.subjectName.trim() && !st.topicName.trim()) { $('#in-topic').focus(); return; }
    Sound.play('tap');
    startDiagnosis();
    return;
  }
  if (e.key === 'Escape') { hideTip(); if (RT.sheet && RT.sheet.dismissible) { dismissSheet(); return; } }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role="button"][data-action]')) { e.preventDefault(); t.click(); return; }
  if (t.closest && t.closest('#theme-seg') && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
    e.preventDefault();
    const k = /Left|Up/.test(e.key) ? 'light' : 'dark';
    const b = document.querySelector(`#theme-seg [data-k="${k}"]`);
    b.click(); b.focus();
    return;
  }
  if (RT.sheet || /INPUT|TEXTAREA|SELECT/.test(t.tagName)) return;
  if (S.view === 'review' && S.prefs.reviewMode === 'card') {
    if (e.key === 'ArrowRight') moveCard(1);
    else if (e.key === 'ArrowLeft') moveCard(-1);
    return;
  }
  if (S.view !== 'quiz') return;
  const cur = S.session && S.session.current;
  if (!cur) return;
  if (cur.phase === 'answering') {
    const n = { 1: 0, 2: 1, 3: 2, 4: 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()];
    if (n !== undefined) { e.preventDefault(); selectOption(n); }
  } else if (cur.phase === 'feedback' && e.key === 'Enter' && t.tagName !== 'BUTTON') {
    e.preventDefault(); nextStep();
  }
});

// 탭 이탈 감지: 이탈 시간은 풀이 시간에서 빼고, 이탈 여부만 기록
document.addEventListener('visibilitychange', () => {
  const cur = S.session && S.session.current;
  if (S.view !== 'quiz' || !cur || cur.phase !== 'answering') return;
  if (document.hidden) {
    if (!RT.pausedAt) { RT.hiddenAt = Date.now(); cur.tabOut = true; }
    save();
  } else if (RT.hiddenAt) {
    cur.tabOutMs += Date.now() - RT.hiddenAt;
    RT.hiddenAt = null;
    save();
    renderQuiz();
  }
});

window.addEventListener('resize', () => { if (S.view === 'quiz') fitDock(); hideTip(); });
if (window.matchMedia) {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', applyPrefs);
}

// 안드로이드 뒤로 가기 · 브라우저 뒤로 가기 대응
window.addEventListener('popstate', (e) => {
  const keep = () => { try { history.pushState({ view: S.view }, '', '#' + S.view); } catch (err) { /* 무시 */ } };
  if (RT.sheet) { if (RT.sheet.dismissible) dismissSheet(); keep(); return; }
  if (S.view === 'quiz') { keep(); openExitSheet(); return; }
  go((e.state && e.state.view) || 'home', { push: false });
});

/* ---------- 모바일 가상 키보드 가림 방지 ----------
 * 1) 입력창(input · textarea)에 포커스가 오면, 키보드가 다 올라온 뒤(≈320ms) 입력창을 화면 가운데로 부드럽게 스크롤
 * 2) visualViewport 크기로 키보드 열림을 감지해 한 번 더 가운데로 맞추고,
 *    - 레이아웃이 줄지 않는 브라우저(iOS Safari)에서는 키보드 높이(--kb)만큼 바텀 시트를 위로 올리고
 *    - 키보드가 열려 있는 동안은 하단 탭 바를 숨겨(.kb-open) 입력창 바로 위를 가리지 않게 해요
 * 터치 기기(pointer: coarse)에서만 동작해 데스크톱의 클릭 · 포커스 흐름에는 영향이 없어요
 */
const Keyboard = (() => {
  const root = document.documentElement;
  const isTouch = () => !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  const reduce = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const isTyping = (el) => !!el && (el.tagName === 'TEXTAREA' || el.isContentEditable
    || (el.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|reset|file|range|color|hidden|image)$/i.test(el.type)));
  let t = null, maxH = 0, open = false;

  function reveal(el, delay) {
    clearTimeout(t);
    t = setTimeout(() => {
      if (document.activeElement !== el || !el.isConnected) return;
      el.scrollIntoView({ behavior: reduce() ? 'auto' : 'smooth', block: 'center', inline: 'nearest' });
    }, delay);
  }
  function measure() {
    const vv = window.visualViewport;
    if (!vv) return;
    maxH = Math.max(maxH, vv.height);
    const inset = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)); // 레이아웃을 덮는 키보드 높이
    const nowOpen = isTouch() && (maxH - vv.height > 150 || inset > 150);
    root.style.setProperty('--kb', `${nowOpen ? inset : 0}px`);
    root.classList.toggle('kb-open', nowOpen);
    if (nowOpen && !open && isTyping(document.activeElement)) reveal(document.activeElement, 60);
    open = nowOpen;
  }

  document.addEventListener('focusin', (e) => { if (isTouch() && isTyping(e.target)) reveal(e.target, 320); });
  document.addEventListener('focusout', () => clearTimeout(t));
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', measure);
    visualViewport.addEventListener('scroll', measure);
  }
  window.addEventListener('orientationchange', () => { maxH = 0; setTimeout(measure, 400); });
  return { reveal, measure, isOpen: () => open };
})();

/* ---------- [index5] 세부 요구사항 textarea 자동 확장 (Auto-resize) ----------
 * 대상: <textarea data-autosize> — 홈 #in-prompt · 출제 방법 시트(SH-10) #lp-prompt (rows="2"가 최소 높이)
 * 원리: 높이를 '글자가 실제로 차지하는 줄 수'에 맞춰 px로 정해요. 비어 있으면 rows(2줄) · 길어지면 그만큼 늘고 · 지우면 다시 줄어요
 *   ① 재는 곳: 화면 밖의 숨은 복제 textarea(같은 class · 같은 너비)에 값을 넣고 height:0으로 두면 scrollHeight = 내용에 필요한 높이
 *      → 진짜 입력칸의 height를 auto ↔ 0으로 오가지 않아서 깜빡임 · 스크롤 튐이 없고, 줄어들 때도 똑같이 정확해요
 *        (입력칸에서 직접 scrollHeight만 읽으면 '늘기만 하고 줄지 않는' 고전적인 문제가 생겨요)
 *   ② 높이는 인라인 height !important로 넣어요 — 클래스 !h-auto(!important)를 이기려는 것 (인라인 !important > 스타일시트 !important)
 *   ③ 부드럽게: CSS(textarea[data-autosize])가 height transition을 맡아요 · 안쪽 스크롤은 overflow-y: hidden으로 없애요
 * 다시 재는 때: input 이벤트(타이핑 · 붙여넣기 · 지우기) · 빠른 입력 칩이 값을 바꿀 때(fit 직접 호출) · 화면이 그려질 때(MutationObserver)
 *              · 화면 너비가 바뀔 때(줄바꿈 위치가 달라져요) · 웹폰트가 로드된 뒤
 *   같은 값 · 같은 너비면 다시 재지 않아요(__as 캐시) → 홈이 타이머로 자주 갱신돼도 부담이 없어요
 * 키보드: 터치 기기에서 입력 중 줄이 늘면 Keyboard.reveal()로 입력칸이 키보드에 가리지 않게 다시 맞춰요 */
const Autosize = (() => {
  let mirror = null, raf = 0;
  const coarse = () => !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  function measurer() {
    if (!mirror) {
      mirror = document.createElement('textarea');
      mirror.setAttribute('aria-hidden', 'true'); mirror.tabIndex = -1; mirror.readOnly = true;
      mirror.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;pointer-events:none;overflow:hidden;';
      document.body.appendChild(mirror);
    }
    return mirror;
  }
  function fit(el) {
    if (!el || !el.isConnected || !el.offsetWidth) return; // 숨겨진 화면은 너비가 0이라 잴 수 없어요 (보이게 되면 다시 그려지며 불려요)
    const key = `${el.offsetWidth}|${el.value}`;
    if (el.__as === key) return;
    const m = measurer();
    m.className = el.className; m.rows = el.rows;
    m.style.width = `${el.offsetWidth}px`;
    m.style.setProperty('height', 'auto', 'important'); m.value = '';
    const minH = m.offsetHeight;                          // 내용이 없을 때 = rows줄 높이(패딩 · 테두리 포함)
    m.style.setProperty('height', '0', 'important'); m.value = el.value;
    const border = el.offsetHeight - el.clientHeight;     // 위 · 아래 테두리 — box-sizing: border-box라 scrollHeight에는 빠져 있어요
    const next = Math.max(minH, m.scrollHeight + border);
    // 비교 기준은 '지금 보이는 높이'가 아니라 '마지막으로 정해 준 높이'(__ah) — 전환 도중의 높이와 우연히 같아서 갱신을 건너뛰면 엉뚱한 높이에 멈춰요
    const prev = el.__ah != null ? el.__ah : el.offsetHeight;
    el.__as = key;
    if (Math.abs(next - prev) < 1) return;
    el.__ah = next;
    el.style.setProperty('height', `${next}px`, 'important');
    if (next > prev && document.activeElement === el && coarse()) Keyboard.reveal(el, 200);
  }
  const all = () => document.querySelectorAll('textarea[data-autosize]').forEach(fit);
  const later = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; all(); }); }; // 한 프레임에 한 번만 (첫 그리기 전에 끝나서 깜빡이지 않아요)
  ['view-home', 'sheet-root'].forEach((id) => { const n = document.getElementById(id); if (n) new MutationObserver(later).observe(n, { childList: true, subtree: true }); });
  window.addEventListener('resize', later);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { document.querySelectorAll('textarea[data-autosize]').forEach((el) => { el.__as = ''; }); later(); });
  return { fit, all };
})();

/* =====================================================================
 * 11) 시작: 저장된 상태 복원
 * ===================================================================== */
function sanitize() {
  ['session', 'parked'].forEach((key) => {
    const s = S[key];
    if (s && (!BANKS[s.bankId] || !Array.isArray(s.logs) || (s.current && !getQ(s.current.qid)))) S[key] = null;
  });
  delete S.streak; // 이전 버전이 저장한 복습 잔디 기록은 다음 저장 때 localStorage에서 함께 정리
  delete S.setup.query; // 단일 검색창 입력값 → 과목(subjectName) · 단원(topicName)으로 대체
  if (!Array.isArray(S.metrics)) S.metrics = [];
  // 이전 버전(index3 초기)에서 저장한, 이제는 쓰지 않는 값 정리: 정답 공개 방식 · 시험일 · 알림 · 학습 유형
  delete S.setup.feedback; delete S.examDate; delete S.prefs.notify;
  // [index5] 직업군(persona)을 다시 써요 — 예전 버전의 '학습 유형' 값처럼 지금 목록에 없는 값만 정리
  if (S.user && S.user.persona && !PERSONAS[S.user.persona]) delete S.user.persona;
  delete S.setup.learningState; // [index5] 학습 목적 칩은 없앴어요 (세부 요구사항과 겹침)
  S.setup.customPrompt = String(S.setup.customPrompt || '').slice(0, PROMPT_MAX);
  // [index5] 내 서재: 모양이 깨진 항목은 버리고 이름 · 개수 한도만 맞춰요
  S.library = (Array.isArray(S.library) ? S.library : [])
    .filter((x) => x && x.id && normName(x.name) && Array.isArray(x.units))
    .slice(0, LIB_MAX_SUBJECTS)
    .map((x) => ({ ...x, name: normName(x.name).slice(0, 40), units: x.units.filter((u) => u && u.id && normName(u.name)).slice(0, LIB_MAX_UNITS) }));
  S.history = (S.history || []).filter((h) => BANKS[h.bankId] && h.summary && (h.sample || (Array.isArray(h.logs) && h.logs.every((l) => getQ(l.qid)))));
}

function init() {
  applyPrefs();
  sanitize();
  const s = S.session;
  if (s && s.current && s.current.phase === 'answering') { resetTiming(s.current); resetAnswer(s.current); }
  go(S.view || 'landing', { push: false });
  if (S.view === 'quiz' && s && s.current) {
    if (s.current.phase === 'speedcheck') openSpeedSheet(s.logs[s.current.logIndex]);
    toast('이전 진단을 이어서 불러왔어요');
  }
}

init();
</script>
</body>
