      </div>
    </div>
    ${answerRowsHTML(cur, q, log)}
    <div class="mt-3 flex flex-wrap items-center gap-1.5"><span class="chip bg-ink-100 text-ink-700">${CONF[log.conf].emoji} ${CONF[log.conf].pct} ${CONF[log.conf].word}</span>${retry ? `<span class="chip ${retry.solved ? 'bg-solid-mastery text-white' : 'bg-ink-100 text-ink-700'}">${retry.solved ? '<i class="fa-solid fa-check"></i>해소' : '아직 해소 안 됨'}</span>` : statusChip(it.status)}</div>
    ${!retry && it.status === 'INSTABILITY' ? `<p class="mt-1.5 text-xs text-ink-500">${it.reasons.map(esc).join(' · ')}</p>` : ''}
    <div class="mt-3 rounded-2xl bg-ink-50 p-4 text-[15px] leading-relaxed text-ink-800 break-keep"><p class="text-xs font-bold text-ink-500 mb-1"><i class="fa-regular fa-lightbulb mr-1"></i>해설</p>${esc(q.x)}</div>
    ${cur.msg ? `<p class="mt-3 text-sm font-semibold text-ink-700 flex gap-2 break-keep"><i class="fa-solid fa-route mt-1 text-ink-400"></i><span>${esc(cur.msg)}</span></p>` : ''}
   </div>
   <div class="px-4 pt-2 dock-pad">
    <button type="button" class="btn btn-lg btn-primary w-full" data-action="next">${label} <i class="fa-solid fa-arrow-right text-sm"></i></button>
   </div>
  </div>`;
}

/* =====================================================================
 * 결과 리포트 — 요약 / 차트 분석 / 문항 기록 탭
 * ===================================================================== */
function statsOf(ev) {
  const its = ev.items;
  const bucket = (arr) => ({ n: arr.length, correct: arr.filter((i) => i.correct).length, acc: arr.length ? arr.filter((i) => i.correct).length / arr.length : null });
  return {
    n: its.length,
    correct: its.filter((i) => i.correct).length,
    avgSec: avg(its.map((i) => i.ms / 1000)),
    avgRatio: avg(its.map((i) => i.ratio)),
    hes: its.reduce((s, i) => s + i.hesitation, 0),
    hesItems: its.filter((i) => i.hesitation > 0).length,
    fast: its.filter((i) => i.speedFlag).length,
    slow: its.filter((i) => i.ratio > SLOW_LIMIT).length,
    tab: its.filter((i) => i.tabOut).length,
    byConf: ['LOW', 'MEDIUM', 'HIGH'].map((k) => ({ k, ...bucket(its.filter((i) => i.conf === k)) })),
    byLevel: [1, 2, 3].map((lv) => ({ lv, ...bucket(its.filter((i) => i.lv === lv)) })),
  };
}

/** 메타인지 정확도 점수를 말로 풀어 주는 등급 */
function calBand(score) {
  if (score >= 80) return { label: '매우 정확', chip: 'bg-mastery-50 text-mastery-700' };
  if (score >= 65) return { label: '정확한 편', chip: 'bg-brand-50 text-brand-700' };
  if (score >= 50) return { label: '보통', chip: 'bg-unstable-50 text-unstable-700' };
  return { label: '점검 필요', chip: 'bg-illusion-50 text-illusion-700' };
}
/** 결과 핵심 수치: 정답률 vs 확실한 내 지식 비율 */
function realSkill(ev) {
  const n = ev.items.length || 1;
  const correct = ev.items.filter((i) => i.correct).length;
  const mastery = ev.counts.MASTERY;
  return { n: ev.items.length, correct, mastery, shaky: correct - mastery, acc: correct / n, real: mastery / n };
}

/* [변경] 결과 리포트 상단
 *  - 대표 지표: 추상적인 '메타인지 정확도 N점' 대신 "정답률 X%, 그런데 확실한 내 지식은 Y%" 격차를 크게 (누구에게나 통하는 아하 모먼트)
 *  - 메타인지 정확도(Brier)는 보조 지표로 한 줄
 *  [변경] MVP 다이어트: 시작 전 예상 점수 비교 · '찍어서 맞힌 문제' 이유 쓰기 · 리포트 카드 공유를 뺐어요
 *         → 결과 화면의 행동은 '착각부터 복습하기' 하나로 모아요
 *  [index5] 교수님 피드백 — '진단 결과'에서 끝나지 않고 '학습 가이드 → 재진단' 루프로
 *         ① 두 지표 옆에 뜻을 붙여요: 정답률 = 실제 문제 해결 능력 · 메타인지 정확도 = 자기 판단의 정확성
 *         ② 요약 탭: 사분면 아래 '🎯 지금 해야 할 것'(todoHTML)
 *         ③ '🎯 다음 진단 목표'(goalBlockHTML) — 강조 문구 + 목표 지도(정답률 × 메타인지) + 지난 진단 대비 변화
 *            (첫 화면 정리로 요약 카드 밖 · 요약 탭 맨 아래의 접이식으로 옮겼어요. 요약 카드는 숫자 → [복습하기] → 접힌 메타인지 한 줄)
 *            맨 아래 [홈으로] · [다시 진단하기]는 index4 자리 그대로
 */
function renderResult() {
  const h = findEntry(S.resultId);
  if (!h) return;
  const ev = evaluate(h);
  const sk = realSkill(ev);
  const gap = ev.gap;
  const g = gap >= 0.15 ? { t: `실제보다 ${pct(gap)}%p 더 안다고 느끼고 있어요`, c: 'text-illusion-600', ic: 'fa-arrow-trend-up' }
    : gap <= -0.15 ? { t: `생각보다 ${pct(-gap)}%p 더 잘 알고 있어요`, c: 'text-brand-600', ic: 'fa-arrow-trend-down' }
    : { t: '평균 확신도와 정답률은 비슷해요', c: 'text-mastery-700', ic: 'fa-equals' };
  // 평균은 맞아도 '틀린 문제에 확신한' 문항이 있으면 점수가 깎인 이유를 함께 알려 줘요
  const confidentWrong = ev.items.filter((i) => !i.correct && i.conf !== 'LOW').length;
  const band = calBand(ev.calibration);
  const why = confidentWrong
    ? `틀린 문제 ${confidentWrong}개에 70% 이상 확신해서 점수가 깎였어요.`
    : ev.calibration >= 80 ? '아는 것과 모르는 것을 정확히 구분하고 있어요.' : '맞힌 문제에도 확신이 부족했어요. 아는 건 자신 있게 골라 보세요.';
  const un = unresolvedCount(h);
  const reviewN = reviewItems(h, ev).length;
  const tabs = [['summary', '요약'], ['charts', '차트 분석'], ['log', '문항 기록'], ['practice', '집중 연습'], ['guide', '가이드라인']]; // [index5] 가이드라인 탭
  const headline = sk.shaky > 0
    ? `맞힌 ${sk.correct}문항 중 ${sk.shaky}문항은 찍었거나 흔들린 ‘불안한 정답’이에요. 시험장에서는 틀릴 수 있어요.`
    : sk.correct ? '맞힌 문항이 모두 흔들림 없는 확실한 지식이에요.' : '아직 확실한 지식이 없어요. 기초 정의부터 다져요.';
  $('#view-result').innerHTML = `
  <div class="max-w-4xl mx-auto px-4 pt-3 pb-28 md:pb-12 space-y-4 anim-in">
    <section class="card p-5 sm:p-7" aria-label="요약">
      <div class="flex flex-wrap items-center gap-1.5 text-xs">
        <span class="chip bg-ink-100 text-ink-700">${esc(h.subject)}</span>
        <span class="chip bg-ink-100 text-ink-700">${esc(h.kind === 'practice' ? practiceTag(h) : histModeLabel(h))}</span>
        ${h.early ? '<span class="chip bg-unstable-50 text-unstable-700">중간 결과</span>' : ''}
        <span class="font-semibold text-ink-500 ml-1">${fmtDate(h.date)}</span>
      </div>
      <!-- [index5] 집중 연습은 학습 기록 · 복습 선택 시트와 같은 이름으로: 제목 = 연습한 개념(entryTitle) · 칩 = '집중 연습 · 🌱 기초 3문항'(practiceTag) -->
      <h1 class="mt-2 text-[22px] sm:text-2xl font-extrabold tracking-tight break-keep">${esc(entryTitle(h))}</h1>
      <div class="mt-5">
        <p class="text-sm font-bold text-ink-500">진짜 실력</p>
        <p class="mt-1 text-[21px] sm:text-[26px] font-extrabold leading-snug tracking-tight break-keep">정답률 <span class="text-brand-600 tnum">${pct(sk.acc)}%</span>${sk.real < sk.acc ? ', 그런데 확실한 내 지식은 ' : ', 확실한 내 지식도 '}<span class="text-mastery-700 tnum">${pct(sk.real)}%</span></p>
        <p class="mt-2 text-sm text-ink-600 break-keep">${headline}</p>
      </div>
      <!-- [index5] 결과 첫 화면 정리
           ① 같은 숫자(정답률 · 확실한 내 지식)를 문장 + 막대로 두 번 보여 주던 것 → 문장 하나로
           ② 다음 행동([착각 N개부터 복습하기])을 숫자 바로 아래로 — 예전엔 1,300px 아래(화면 1.6개)에 있었어요
           ③ 세 번째 지표 '메타인지 정확도' + 설명 + 각주 → 접힌 한 줄(details). 누르면 뜻 · 이유 · 계산 방법
           ④ '🎯 다음 진단 목표'는 카드 밖 요약 탭 맨 아래로(접힘) — 행동을 가로막지 않게 -->
      ${reviewN

/** 탭 4개. 개념별 집중 연습(conceptsHTML)은 'practice' 탭에서만

/* =====================================================================
 * [index5] 학습 나침반 — 교수님 피드백 "진단 결과를 넘어 맞춤 학습 가이드와 재검증 루프를"
 * ===================================================================== */
// 두 지표를 헷갈리지 않게: 정답률 = 실제로 풀어 내는 힘 · 메타인지 정확도 = '안다/모른다'는 내 판단이 결과와 맞는 정도
const METRIC_MEANING = { acc: '실제 문제 해결 능력', cal: '자기 판단의 정확성' };

/** 🎯 지금 해야 할 것: 이번 결과에 있는 상태만, 우선순위 순서대로

 *  - 🟡 불안한 정답은 확신도로 한 번 더 나눠요: 🎲 30%로 맞힘 = '찍어서 맞힌 문제' · 그 밖(70%, 또는 100%인데 번복 · 지연 · 성급 · 이탈) = '불안한 정답'
 *  - 버튼은 이미 있는 흐름으로만 이어요: 복습 덱(open-review) · 기초 3문항 집중 연습(practice) */
const TODO_GROUPS = [
  { key: 'ILLUSION', rank: 1, emoji: '🚨', label: '위험한 착각', tone: 'illusion', axis: '오답 · 확신 높음', match: (i) => i.status === 'ILLUSION',
    desc: '알고 있다고 생각했지만 실제 문제에서는 틀린 개념이에요.', steps: ['정답 확인', '내 답과 차이 비교', '유사 문제 풀이', '😎 100% 확신으로 정답 검증'], cta: 'review' },
  { key: 'DEFICIT', rank: 2, emoji: '🟣', label: '기초 학습 필요', tone: 'deficit', axis: '오답 · 확신 낮음', match: (i) => i.status === 'DEFICIT',
    desc: '아직 개념의 기본 원리가 충분히 잡히지 않았어요.', steps: ['핵심 원리 파악', '간단한 예시로 이해', '기초 문제 풀이'], cta: 'basic' },
  { key: 'SHAKY', rank: 3, emoji: '🟡', label: '불안한 정답', tone: 'unstable', axis: '정답 · 확신 70% 또는 흔들림', match: (i) => i.status === 'INSTABILITY' && i.conf !== 'LOW',
    desc: '정답은 맞혔지만 아직 확실하게 안다고 보기 어려워요.', steps: ['헷갈린 개념끼리 차이 비교', '한 줄로 요약', '예제로 확인'], cta: 'review' },
  { key: 'LUCKY', rank: 3, emoji: '🎲', label: '찍어서 맞힌 문제', tone: 'unstable', axis: '정답 · 확신 30%', match: (i) => i.status === 'INSTABILITY' && i.conf === 'LOW',
    desc: '정답을 맞혔지만 확신도가 낮아 찍어서 맞힌 것으로 볼 수 있어요.', steps: ['해당 개념 다시 확인', '핵심 한 줄 정리', '유사 문제를 😎 100% 확신으로 맞혀 검증'], cta: 'review' },
  { key: 'MASTERY', rank: 4, emoji: '🟢', label: '확실한 내 지식', tone: 'mastery', axis: '정답 · 확신 100%', match: (i) => i.status === 'MASTERY',
    desc: '정확하게 알고 있는 개념이에요.', steps: [], cta: null },

function todoHTML(h, ev) {
  const groups = TODO_GROUPS.map((g) => ({ ...g, its: ev.items.filter(g.match) })).filter((g) => g.its.length);
  if (!groups.length) return '';
  // [index5] 순위 숫자는 '이번에 보이는 할 일' 순서대로 1 · 2 · 3… (착각이 없을 때 2순위부터 시작하던 것 정리) · 🟢는 할 일이 아니라 '유지'
  groups.filter((g) => g.key !== 'MASTERY').forEach((g, i) => { g.order = i + 1; });
  const hasWeak = groups.some((g) => g.key !== 'MASTERY');
  // [index5] 결과 상단 · 이 카드 · 가이드라인 탭의 '착각 복습' 버튼은 문구(🚨 착각 N문항 복습하기) · 목적지(복습 덱) · 단위(문항)를 같게 — 예전엔 셋이 제각각이라 '6개'(문항)와 '3개'(개념)가 섞여 보였어요
  const un = unresolvedCount(h);
  const arrow = '<i class="fa-solid fa-arrow-right text-[10px]" aria-hidden="true"></i>';

    const cta = g.cta === 'review'
      ? `<button type="button" class="btn btn-sm ${g.key === 'ILLUSION' ? 'bg-solid-danger hover:bg-solid-danger-hover text-white' : 'btn-surface'}" data-action="open-review" data-id="${h.id}">${g.key === 'ILLUSION' && un ? `🚨 착각 ${un}문항 복습하기` : '복습 덱에서 하기'} ${arrow}</button>`
      : g.cta === 'basic'
        ? `<button type="button" class="btn btn-sm btn-surface" data-action="practice" data-id="${h.id}" data-cid="${g.its[0].cid}" data-lv="1">${LEVELS[1].icon} 기초 3문항 풀기 ${arrow}</button>`

      : `<ol class="mt-3 flex flex-wrap gap-1.5" aria-label="학습 순서">${g.steps.map((s, j) => `<li class="inline-flex items-center gap-1.5 rounded-xl bg-surface px-2.5 py-1.5 text-[13px] font-semibold text-ink-800 break-keep"><span class="w-5 h-5 shrink-0 rounded-full ${t.solid} ${g.tone === 'unstable' ? 'on-amber' : 'text-white'} text-[11px] font-bold grid place-items-center" aria-hidden="true">${j + 1}</span>${s}</li>`).join('')}</ol>`;
    return `
      <li class="rounded-2xl ${t.soft} p-4 ${g.key === 'LUCKY' ? 'border-2 border-dashed border-unstable-200' : ''} ${g.key === 'ILLUSION' ? 'ring-2 ring-illusion-500' : ''}">
        <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
          ${g.key === 'MASTERY' ? `<span class="chip bg-surface ${t.text}">✓ 유지</span>` : `<span class="chip bg-surface ${t.text}">${g.order}순위</span>`}
          <h3 class="font-extrabold text-[15px]">${g.emoji} ${g.label}</h3>

/* ---------- [index5] 가이드라인 탭 — 여러 회차에 쌓인 기록으로 '지금 상태 → 다음 스텝'을 알려 줘요 ----------
 *  렌더링 순서: roundsOf(h)로 회차를 모음 → 회차마다 evaluate() → 모든 회차의 '아직 해소 안 한 착각'을 개념별로 묶음
 *  → ① 지금 상태 한 줄 + 👉 지금 당장 할 일(하나) + 남은 착각 개념(모든 회차) + 숫자 4칸 + [이번 결과의 할 일 전체 보기 → 요약 탭]
 *     지금 당장 할 일의 순서는 요약 탭 '지금 해야 할 것'(TODO_GROUPS)과 같아요 — 두 탭이 서로 다른 일을 먼저 하라고 하지 않게
 *     [index5] 요약 탭과 같은 내용이던 '🧭 다음 스텝' 4단계 목록은 뺐어요 → 이 탭은 회차별 변화 · 개념별 흐름 위주
 *  → ② 회차별 변화 표 → ③ 개념별 누적 흐름(회차마다 판정 이모지)
 *  버튼은 이미 있는 흐름만 써요: 유사 문제(retry) · 복습 덱(open-review) · 기초 3문항(practice) · 다시 진단(redo) */
/** 회차 = 같은 과목(문제은행)의 본 진단을 날짜순으로 (집중 연습 · 예시 제외). 지금 보는 결과까지만 세요 */
function roundsOf(h) {
  const t = new Date(h.date).getTime();
  return realHistory()
    .filter((x) => x.bankId === h.bankId && (x.kind || 'main') === 'main' && Array.isArray(x.logs) && new Date(x.date).getTime() <= t)
    .sort((a, b) => new Date(a.date) - new Date(b.date));
}
function guideHTML(h) {
  const rounds = roundsOf(h);
  if (!rounds.length) return '<section class="card p-5 sm:p-7"><h2 class="section-title">가이드라인</h2><p class="mt-2 text-sm text-ink-500 break-keep">집중 연습 결과는 회차에 넣지 않아요. 이 과목을 진단하면 회차별 가이드라인을 만들어 드려요.</p></section>';
  const N = rounds.length, cur = rounds[N - 1];
  const evs = rounds.map((e) => evaluate(e)), evCur = evs[N - 1], evPrev = evs[N - 2] || null;
  // 모든 회차에서 아직 해소하지 않은 착각 → 개념별로
  const openIll = [];
  rounds.forEach((e, ri) => reviewItems(e, evs[ri]).forEach((i) => { if (i.status === 'ILLUSION' && !(e.review[i.qid] || {}).done) openIll.push({ e, ri, i }); }));
  const byCid = {};
  openIll.forEach((x) => { (byCid[x.i.cid] = byCid[x.i.cid] || []).push(x); });
  const cids = Object.keys(byCid), K = cids.length, openN = openIll.length; // K = 착각이 남은 개념 수 · openN = 착각 문항 수 (버튼 · 숫자는 문항으로 통일, 개념 수는 보조로만)
  const carried = openIll.some((x) => x.ri < N - 1); // 지난 회차에서 넘어온 착각이 있는지
  // 최근 회차에 남은 불안한 정답 · 기초 학습 필요
  const left = reviewItems(cur, evCur).filter((i) => !(cur.review[i.qid] || {}).done);
  const shakyN = left.filter((i) => i.status === 'INSTABILITY').length;
  const deficit = left.filter((i) => i.status === 'DEFICIT');
  const accNow = pct(evCur.accuracy), calNow = evCur.calibration, acc0 = evPrev ? pct(evPrev.accuracy) : null;

  // ① 지금 상태 한 줄 (예: "현재 2회차 풀이 결과, 정답률이 60% → 90%로 올랐어요. 하지만 여전히 …")
  const lead = !evPrev ? `1회차 풀이 결과, 정답률 ${accNow}% · 메타인지 정확도 ${calNow}점으로 시작했어요.`
    : accNow > acc0 ? `현재 ${N}회차 풀이 결과, 정답률이 ${acc0}% → ${accNow}%로 올랐어요.`
    : accNow < acc0 ? `현재 ${N}회차 풀이 결과, 정답률이 ${acc0}% → ${accNow}%로 내려갔어요.`
    : `현재 ${N}회차 풀이 결과, 정답률은 ${accNow}%로 지난 회차와 같아요.`;
  const next = K
    ? `${evPrev && accNow > acc0 ? '하지만 ' : ''}${carried ? '여전히 ' : ''}<b class="text-illusion-600">‘위험한 착각’ ${openN}문항</b>(개념 ${K}개)이 남아 있어요. 복습 덱에서 <b>[유사 문제]</b>로 먼저 해소하세요.`
    : deficit.length ? `남은 착각은 없어요. 먼저 <b>🟣 기초 학습이 필요한 개념</b>을 기초 3문항으로 다져 보세요.${shakyN ? ` 그다음 <b>🟡 불안한 정답 ${shakyN}문항</b>을 굳혀요.` : ''}`
    : shakyN ? `남은 착각은 없어요. 이제 <b>🟡 불안한 정답 ${shakyN}문항</b>을 확실한 지식으로 굳혀 보세요.`
    : '남은 착각도, 불안한 정답도 없어요. 며칠 뒤 다시 진단해 이 상태가 유지되는지 확인하세요.';
  const delta = (d, unit) => (d == null ? '' : `<span class="ml-1 text-[11px] font-bold ${d > 0 ? 'text-mastery-700' : d < 0 ? 'text-illusion-600' : 'text-ink-500'}">${d > 0 ? '▲' : d < 0 ? '▼' : '='}${d ? Math.abs(d) + unit : ''}</span>`);
  const stat = (label, val) => `<div class="rounded-2xl bg-ink-50 px-3 py-2.5"><p class="text-[11px] font-bold text-ink-500">${label}</p><p class="mt-0.5 text-[17px] font-extrabold tnum">${val}</p></div>`;

  const arrow = '<i class="fa-solid fa-arrow-right text-[10px]" aria-hidden="true"></i>';
  // 남은 착각 개념(모든 회차) — '지금 당장 할 일' 바로 아래에 개념마다 [유사 문제]로 (지난 회차에서 넘어온 착각은 요약 탭에 없는 정보예요)
  const illRows = cids.map((cid) => {
    const xs = byCid[cid], last = xs[xs.length - 1];
    const roundTags = [...new Set(xs.map((x) => x.ri + 1))].map((r) => `<span class="chip bg-surface text-ink-600">${r}회차</span>`).join('');
    return `
      <div class="flex flex-wrap items-center gap-x-2 gap-y-1.5 rounded-xl bg-illusion-50 px-3 py-2.5">
        <span class="min-w-0 flex-1 text-sm font-bold break-keep">🚨 ${esc(conceptOf(cur.bankId, cid).name)} <span class="text-xs font-semibold text-illusion-600">${xs.length}문항</span></span>
        <span class="flex gap-1">${roundTags}</span>
        <button type="button" class="btn btn-sm bg-solid-danger hover:bg-solid-danger-hover text-white" data-action="retry" data-id="${last.e.id}" data-qid="${last.i.qid}">유사 문제 ${arrow}</button>
      </div>`;
  }).join('');

  // ③ 개념별 누적 흐름
  const conceptRows = BANKS[cur.bankId].concepts.map((c) => {
    const trail = evs.map((e, ri) => { const cc = e.concepts.find((x) => x.id === c.id); return `<span class="inline-flex flex-col items-center min-w-[34px]"><span class="text-base leading-none" aria-hidden="true">${cc ? STATUS[cc.status].emoji : '·'}</span><span class="mt-1 text-[10px] font-bold text-ink-500">${ri + 1}회</span></span>`; }).join('<i class="fa-solid fa-angle-right text-[9px] text-ink-300 mt-1" aria-hidden="true"></i>');
    const now = evCur.concepts.find((x) => x.id === c.id);
    const label = evs.map((e, ri) => { const cc = e.concepts.find((x) => x.id === c.id); return `${ri + 1}회차 ${cc ? STATUS[cc.status].label : '출제 없음'}`; }).join(', ');
    return `
      <li class="flex flex-wrap items-center gap-x-3 gap-y-2 py-3 border-b border-ink-100 last:border-0">
        <div class="min-w-0 flex-1"><p class="text-sm font-bold break-keep">${esc(c.name)}</p>${byCid[c.id] ? '<p class="text-[11px] font-bold text-illusion-600 mt-0.5">남은 착각 있음</p>' : ''}</div>
        <div class="flex items-start gap-1 overflow-x-auto no-scrollbar max-w-full" role="img" aria-label="${esc(c.name)}: ${label}">${trail}</div>
        ${now ? statusChip(now.status) : '<span class="chip bg-ink-100 text-ink-500">이번 회차 출제 없음</span>'}
      </li>`;
  }).join('');

  // 👉 지금 당장 할 일: 다음 스텝 중 가장 앞의 할 일 하나만 크게 (남은 착각 → 기초 → 불안한 정답 → 다시 진단 · 요약 탭과 같은 순서)
  // [index5] 지난 회차에서 넘어온 착각이 있으면 그 과목의 모든 진단을 한 덱으로('open-review-subject'), 아니면 이 진단의 덱('open-review') — 덱의 숫자와 버튼의 숫자가 같게
  const revAttrs = carried ? `data-action="open-review-subject" data-subject="${esc(cur.subject)}"` : `data-action="open-review" data-id="${cur.id}"`;
  const now = K
    ? { t: `남은 착각 ${openN}문항을 유사 문제로 해소하기`, s: `개념 ${K}개 · 먼저 ‘${esc(conceptOf(cur.bankId, cids[0]).name)}’부터 — 😎 100% 확신으로 맞히면 해소돼요.`, btn: `<button type="button" class="btn btn-md btn-on-color on-illusion" ${revAttrs}>🚨 착각 ${openN}문항 복습하기 ${arrow}</button>`, cls: 'bg-solid-danger' }
    : deficit.length ? { t: '🟣 기초 학습이 필요한 개념을 기초 3문항으로 다지기', s: `${esc(conceptOf(cur.bankId, deficit[0].cid).name)} — 핵심 원리부터 확인하세요.`, btn: `<button type="button" class="btn btn-md btn-on-color on-brand" data-action="practice" data-id="${cur.id}" data-cid="${deficit[0].cid}" data-lv="1">${LEVELS[1].icon} 기초 3문항 풀기 ${arrow}</button>`, cls: 'bg-solid-deficit' }
    : shakyN ? { t: `🟡 불안한 정답 ${shakyN}문항을 복습 덱에서 굳히기`, s: '맞혔지만 확신이 부족했던 문항이에요.', btn: `<button type="button" class="btn btn-md btn-on-color on-brand" data-action="open-review" data-id="${cur.id}">복습 덱 열기 ${arrow}</button>`, cls: 'bg-solid-brand' }
    : { t: `${N + 1}회차 다시 진단으로 유지되는지 확인하기`, s: '며칠 간격을 두고 풀면 기억에 남았는지 더 정확히 알 수 있어요.', btn: `<button type="button" class="btn btn-md btn-on-color on-mastery" data-action="redo" data-id="${cur.id}"><i class="fa-solid fa-rotate-right text-xs" aria-hidden="true"></i>다시 진단하기</button>`, cls: 'bg-solid-mastery' };
  return `
  <section class="card p-5 sm:p-7" aria-labelledby="guide-title">
    <div class="flex flex-wrap items-center justify-between gap-2"><h2 id="guide-title" class="section-title">📍 지금 상태</h2><span class="chip bg-brand-50 text-brand-700">${N}회차 · ${fmtDate(cur.date)}</span></div>
    <p class="mt-2 text-[15px] leading-relaxed text-ink-800 break-keep">${lead} ${next}</p>
    <div class="mt-4 rounded-2xl ${now.cls} text-white p-4">
      <p class="text-xs font-bold">👉 지금 당장 할 일</p>
      <p class="mt-1 text-[17px] font-extrabold leading-snug break-keep">${now.t}</p>
      <p class="mt-1 text-[13px] break-keep">${now.s}</p>
      <div class="mt-3">${now.btn}</div>
    </div>
    ${K ? `<div class="mt-3"><p class="text-xs font-bold text-illusion-600">남은 착각 개념 · 모든 회차</p><div class="mt-1.5 space-y-1.5">${illRows}</div></div>` : ''}
    <div class="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-2">
      ${stat('풀이 회차', `${N}회차`)}
      ${stat('정답률', `${accNow}%${delta(evPrev ? accNow - acc0 : null, '%p')}`)}
      ${stat('메타인지 정확도', `${calNow}점${delta(evPrev ? calNow - evPrev.calibration : null, '점')}`)}
      ${stat('남은 착각', `${openN}문항`)}
    </div>
    <!-- [index5] '🧭 다음 스텝' 4단계 목록은 요약 탭 '🎯 지금 해야 할 것'과 같은 내용이라 뺐어요 → 이 탭은 회차별 변화 · 개념별 흐름 위주
         상세한 할 일은 요약 탭으로 바로 가는 링크로 이어 줘요 -->
    <p class="mt-3 text-right"><button type="button" class="inline-flex items-center gap-1.5 px-1 py-2 text-sm font-bold text-brand-700 hover:underline" data-action="show-todo">이번 결과의 할 일 전체 보기 (요약 탭) ${arrow}</button></p>
  </section>
${N === 1 ? `  <!-- [index5] 첫 진단(1회차)에는 비교할 회차가 없어서 '회차별 변화' 표가 한 줄, '개념별 누적 흐름'이 점 하나뿐이라 비어 보였어요 → 두 섹션 대신 한 줄 안내 (2회차부터 원래대로) -->
  <section class="card p-5 sm:p-7" aria-label="회차별 변화 안내">
    <h2 class="section-title">📈 2회차부터 변화를 보여 드려요</h2>
    <p class="mt-1 text-sm text-ink-500 break-keep">같은 과목을 다시 진단하면 회차별 정답률 · 확실한 지식 변화와, 개념별 🚨 → 🟡 → 🟢 흐름이 여기에 쌓여요.</p>
  </section>` : `  <section class="card p-5 sm:p-7" aria-labelledby="rounds-title">
    <h2 id="rounds-title" class="section-title">📈 회차별 변화</h2>
    <p class="mt-1 text-sm text-ink-500 break-keep">같은 과목의 본 진단을 날짜순으로 센 회차예요. 집중 연습은 넣지 않아요.</p>
    <div class="mt-4 overflow-x-auto rounded-2xl border border-ink-200">
      <table class="w-full min-w-[520px] text-sm">
        <thead class="bg-ink-50 text-xs text-ink-500"><tr>${['회차', '날짜', '정답률', '메타인지', '착각 남음/발견', '확실한 지식'].map((t) => `<th scope="col" class="px-3 py-2.5 text-left font-bold whitespace-nowrap">${t}</th>`).join('')}</tr></thead>
        <tbody>${rounds.map((e, ri) => {
          const v = evs[ri], pv = evs[ri - 1];
          const openN = openIll.filter((x) => x.ri === ri).length;
          return `<tr class="border-t border-ink-100 ${ri === N - 1 ? 'bg-brand-50/60 font-bold' : ''}">
            <td class="px-3 py-2.5 whitespace-nowrap">${ri + 1}회차${ri === N - 1 ? ' <span class="chip !py-0 bg-solid-brand text-white">지금</span>' : ''}</td>
            <td class="px-3 py-2.5 whitespace-nowrap text-ink-600">${fmtDate(e.date)}</td>
            <td class="px-3 py-2.5 whitespace-nowrap tnum">${pct(v.accuracy)}%${delta(pv ? pct(v.accuracy) - pct(pv.accuracy) : null, '%p')}</td>
            <td class="px-3 py-2.5 whitespace-nowrap tnum">${v.calibration}점${delta(pv ? v.calibration - pv.calibration : null, '점')}</td>
            <td class="px-3 py-2.5 whitespace-nowrap tnum"><span class="${openN ? 'text-illusion-600' : 'text-ink-500'}">${openN}</span> / ${v.counts.ILLUSION}</td>
            <td class="px-3 py-2.5 whitespace-nowrap tnum">${pct(realSkill(v).real)}%</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>
    ${N === 1 ? '<p class="mt-2 text-xs text-ink-500">다시 진단하면 2회차부터 변화를 나란히 비교해 드려요.</p>' : ''}
  </section>
  <section class="card p-5 sm:p-7" aria-labelledby="concepts-flow-title">
    <h2 id="concepts-flow-title" class="section-title">🧩 개념별 누적 흐름</h2>
    <p class="mt-1 text-sm text-ink-500 break-keep">회차마다 개념 판정이 어떻게 바뀌었는지예요. 🚨 → 🟡 → 🟢로 가는 게 목표예요.</p>
    <ul class="mt-2">${conceptRows}</ul>
  </section>`}`;
}

/** 같은 과목의 바로 전 '본 진단' (집중 연습 · 예시 기록 제외) — 다시 진단했을 때 점수 변화를 보여 주려고 */
function prevEntryOf(h) {
  const t = new Date(h.date).getTime();
  return realHistory()
    .filter((x) => x.id !== h.id && x.bankId === h.bankId && (x.kind || 'main') === 'main' && x.summary && new Date(x.date).getTime() < t)
    .sort((a, b) => new Date(b.date) - new Date(a.date))[0] || null;
}
/** 목표 안내 문구 — 정답률이 낮은데 메타인지 정확도만 높으면(틀린 문제를 🎲 30%로 푼 경우) '학습 완료'로 읽히지 않게 따로 짚어요 */
function goalMsg(ev) {
  const acc = ev.accuracy, cal = ev.calibration;
  if (acc < 0.6 && cal >= 80) return { cls: 'bg-deficit-50 text-ink-800', t: `<b class="text-deficit-700">메타인지 정확도가 높은 건 틀린 문제를 ‘모른다’고 정확히 판단했기 때문이에요.</b> 모르는 걸 아는 좋은 출발이지만 <b>학습 완료는 아니에요.</b> 이번 목표는 정답률을 올리는 거예요.` };
  if (acc >= 0.9 && cal >= 90) return { cls: 'bg-mastery-50 text-ink-800', t: '<b class="text-mastery-700">두 점수 모두 목표에 가까워요.</b> 며칠 뒤 다시 진단해 이 상태가 유지되는지 확인해 보세요.' };
  if (ev.counts.ILLUSION) return { cls: 'bg-illusion-50 text-ink-800', t: `<b class="text-illusion-700">확신했는데 틀린 문항이 ${ev.counts.ILLUSION}개 있어요.</b> 착각부터 해소하면 두 점수가 함께 올라가요.` };
  if (acc >= 0.8 && cal < 80) return { cls: 'bg-unstable-50 text-ink-800', t: '<b class="text-unstable-700">정답률은 높은데 확신이 부족해 메타인지 정확도가 낮아요.</b> 아는 문제는 자신 있게 고르는 연습을 해 보세요.' };
  return { cls: 'bg-brand-50 text-ink-800', t: '<b class="text-brand-700">두 점수를 함께 올리는 게 목표예요.</b> ‘지금 해야 할 것’ 순서대로 학습한 뒤 다시 진단해 보세요.' };
}
/** [index5] 목표 지도: 가로 = 정답률, 세로 = 메타인지 정확도. 오른쪽 위(둘 다 100)만 ‘안다’ —
 *  한쪽만 높으면 왼쪽 위(모르는 걸 앎) · 오른쪽 아래(맞히기만 함)에 머문다는 걸 한눈에 보여 줘요. 지난 진단이 있으면 화살표로 이동 표시 */
function goalPlotSVG(acc, cal, prev) {
  const X = (v) => 34 + v * 1.96, Y = (v) => 172 - v * 1.64;
  const cx = X(acc), cy = Y(cal);
  const t = (x, y, s, anchor, fill = '--ink-500') => `<text x="${x}" y="${y}" text-anchor="${anchor}" style="fill:rgb(var(${fill}));font-size:9.5px;font-weight:700">${s}</text>`;
  let move = '';
  if (prev) {
    const px = X(prev.acc), py = Y(prev.cal), dx = cx - px, dy = cy - py, d = Math.hypot(dx, dy);
    move = `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4.5" style="fill:rgb(var(--surface));stroke:rgb(var(--ink-400));stroke-width:2"/>`
      + (d > 14 ? `<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${(cx - (dx / d) * 9).toFixed(1)}" y2="${(cy - (dy / d) * 9).toFixed(1)}" style="stroke:rgb(var(--ink-400));stroke-width:1.6" marker-end="url(#goal-arrow)"/>` : '');
  }
  return `
    <svg viewBox="0 0 240 200" class="w-full max-w-[260px] h-auto mx-auto" role="img" aria-label="목표 지도: 정답률 ${acc}%, 메타인지 정확도 ${cal}점${prev ? ` (지난번 ${prev.acc}% · ${prev.cal}점)` : ''}. 두 점수가 모두 100인 오른쪽 위가 목표예요.">
      <defs>
        <clipPath id="goal-clip"><rect x="34" y="8" width="196" height="164" rx="10"/></clipPath>
        <marker id="goal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:rgb(var(--ink-400))"/></marker>
      </defs>
      <rect x="34" y="8" width="196" height="164" rx="10" style="fill:rgb(var(--surface));stroke:rgb(var(--ink-200))"/>
      <g clip-path="url(#goal-clip)"><circle cx="230" cy="8" r="74" style="fill:rgb(var(--mastery-500) / .10)"/><circle cx="230" cy="8" r="40" style="fill:rgb(var(--mastery-500) / .16)"/></g>
      <line x1="132" y1="8" x2="132" y2="172" style="stroke:rgb(var(--ink-200))" stroke-dasharray="3 4"/>
      <line x1="34" y1="90" x2="230" y2="90" style="stroke:rgb(var(--ink-200))" stroke-dasharray="3 4"/>
      ${t(224, 23, '🎯 안다', 'end', '--mastery-700')}${t(40, 23, '모르는 걸 앎', 'start')}${t(224, 164, '맞히기만 함', 'end')}${t(40, 164, '착각 위험', 'start')}
      <line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="226" y2="12" style="stroke:rgb(var(--mastery-500))" stroke-width="1.4" stroke-dasharray="3 3"/>
      ${move}
      <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6.5" style="fill:rgb(var(--brand-500));stroke:rgb(var(--surface));stroke-width:2.5"/>
      ${t(cx > 190 ? cx - 10 : cx + 10, cy > 30 ? cy - 9 : cy + 17, '이번', cx > 190 ? 'end' : 'start', '--brand-700')}
      ${t(34, 185, '0', 'start', '--ink-500')}${t(230, 185, '100', 'end', '--ink-500')}${t(132, 196, '정답률 →', 'middle')}
      ${t(30, 16, '100', 'end', '--ink-500')}<text x="14" y="90" text-anchor="middle" transform="rotate(-90 14 90)" style="fill:rgb(var(--ink-500));font-size:9.5px;font-weight:700">메타인지 정확도 →</text>
    </svg>`;
}
/** 🎯 다음 진단 목표 — 결과 요약 카드 안, 두 점수 바로 아래
 *  강조 문구 + 목표 지도(goalPlotSVG) + 두 점수의 현재 → 100 막대 · 지난 진단 대비 변화 + 상황별 안내(goalMsg) + [다시 진단하기] */
function goalBlockHTML(h, ev) {
  const prev = prevEntryOf(h);
  const accNow = pct(ev.accuracy), calNow = ev.calibration;
  const delta = (d, unit) => `<span class="chip ${d > 0 ? 'bg-mastery-50 text-mastery-700' : d < 0 ? 'bg-illusion-50 text-illusion-700' : 'bg-ink-100 text-ink-600'}">${d === 0 ? '지난번과 같음' : `지난번보다 ${d > 0 ? '+' : ''}${d}${unit}`}</span>`;
  const row = (label, meaning, v, unit, fill, d, dUnit) => `
        <div>
          <div class="flex items-baseline justify-between gap-2">
            <p class="min-w-0 text-sm font-bold text-ink-800">${label} <span class="text-[11px] font-semibold text-ink-500">${meaning}</span></p>
            <p class="shrink-0 text-sm font-extrabold tnum">${v}${unit} <span class="font-bold text-ink-500">→ 100</span></p>
          </div>
          <div class="mt-1 h-2.5 rounded-full bg-surface ring-1 ring-ink-200 overflow-hidden" aria-hidden="true"><div class="h-full rounded-full ${fill}" style="width:${v}%"></div></div>
          ${d == null ? '' : `<p class="mt-1">${delta(d, dUnit)}</p>`}
        </div>`;
  const m = goalMsg(ev);
  return `
      <details class="group rounded-2xl border-2 border-brand-200 bg-brand-50/60" aria-labelledby="goal-title">
       <summary class="flex items-center gap-3 p-4 sm:px-5 cursor-pointer select-none">
        <span class="min-w-0 flex-1">
          <h2 id="goal-title" class="text-sm font-extrabold text-brand-700">🎯 다음 진단 목표</h2>
          <span class="block mt-0.5 text-xs font-semibold text-ink-600 tnum">정답률 ${accNow}% · 메타인지 ${calNow}점 → 둘 다 100</span>
        </span>
        <i class="fa-solid fa-chevron-down text-xs text-ink-400 transition group-open:rotate-180" aria-hidden="true"></i>
       </summary>
       <div class="px-4 pb-4 sm:px-5 sm:pb-5">
        <p class="text-[17px] sm:text-[19px] font-extrabold leading-snug tracking-tight text-ink-900 break-keep">두 점수가 <span class="text-brand-600 underline decoration-brand-300 decoration-4 underline-offset-4">함께</span> 100%에 가까워질 때 <span class="whitespace-nowrap">‘안다’고</span> 말할 수 있어요</p>
        <p class="mt-1 text-xs text-ink-600 break-keep">많이 맞히는 것만으로는 부족해요. ‘안다’고 느낀 것과 실제 결과가 일치해야 진짜 내 지식이에요.${prev ? ` 지난 진단(${fmtDate(prev.date)})과 비교했어요.` : ''}</p>
        <div class="mt-4 grid gap-4 sm:grid-cols-[minmax(0,240px)_1fr] items-center">
          <div>
            ${goalPlotSVG(accNow, calNow, prev ? { acc: pct(prev.summary.accuracy), cal: prev.summary.calibration } : null)}
            <p class="mt-1 text-center text-[11px] font-semibold text-ink-500"><span class="text-brand-600">●</span> 이번${prev ? ' · ○ 지난번' : ''} · <span class="text-mastery-700">- -</span> 목표까지</p>
          </div>
          <div class="space-y-3">
            ${row('정답률', METRIC_MEANING.acc, accNow, '%', 'bg-brand-500', prev ? accNow - pct(prev.summary.accuracy) : null, '%p')}
            ${row('메타인지 정확도', METRIC_MEANING.cal, calNow, '점', 'bg-ink-800', prev ? calNow - prev.summary.calibration : null, '점')}
            <p class="rounded-xl ${m.cls} px-3 py-2.5 text-[13px] leading-relaxed break-keep">${m.t}</p>
            <div class="flex flex-wrap items-center justify-between gap-2">
              <p class="text-xs text-ink-500 break-keep">학습한 뒤 다시 진단해 두 점수가 함께 오르는지 확인하세요.</p>
              <button type="button" class="btn btn-sm btn-secondary" data-action="redo" data-id="${h.id}"><i class="fa-solid fa-rotate-right text-xs" aria-hidden="true"></i>다시 진단하기</button>
            </div>
          </div>
        </div>
       </div>
      </details>`;
}

/* ---------- 한국어 핵심어 추출 (오개념 짚기에서 사용) ----------
 *  [변경] '찍어서 맞힌 문제' AI 서술 검증(이유 쓰기 · 채점 · 승격)은 MVP에서 뺐어요. 조사 · 서술어를 떼는 형태소 처리만 남겨 오개념 짚기에 써요
 */
const KO_TAIL = ['으로써', '으로서', '에서는', '에게서', '이라는', '이라서', '이므로', '하므로', '으로는', '에서', '에게', '까지', '부터', '보다', '처럼', '이나', '이며', '이고', '라는', '하는', '하고', '해서', '하면', '되는', '된다', '한다', '이다', '으로', '들', '한', '된', '할', '될', '인', '일', '은', '는', '이', '가', '을', '를', '의', '에', '로', '와', '과', '도', '만'];
const KO_STOP = new Set(('것 수 때 등 및 각 위 그 이 저 모든 어떤 다른 같은 경우 때문 있다 없다 있는 없는 위해 대한 통해 따라 가장 다음 또는 그리고 하지만 '
  + '이미 바로 반드시 항상 모두 정답 해설 문제 보기 아니다 아닌 만약 먼저 전체 일부 여러 계속 이후 이전 뿐 더 즉 곧 하나 두 세 가지 이런 그런 '
  + '실제 자체 동안 한꺼번 미리 방금 일부러 처음 자기 없이 남은 필요 뒤 더 아직 다시 오래 사람 아무것 이상 이하 필요 가능 합니다 입니다 됩니다 있습니다 없습니다 않습니다 때문입니다 수도 아니라 그래서 따라서 오히려 가지 경우에 '
  + 'the a an of to is and or in on for by with').split(' '));
const KO_KEEP = /(평가|증가|추가|참가|국가|대가|부가|스스로|경로|통로|차이|기아|지지|의지|유지|방지|최고|재고|사고|광고|참고|배려|고려|우려|참여|부여|언어|단어|용어|제어)$/; // 조사처럼 보이지만 명사의 일부인 끝말
// 서술어 · 부사형 끝말(기다린다, 개입해, 성립할, 바꾸지 …)은 키워드에서 제외
const KO_PRED = /(다|요|며|면|게|니|록|거나|려고|마다|조차|처럼|수록|해|했|하지|되지|않|없|있|므|듯|어서|아서|겠|죠|던|린|른|운|고|지|나|까|려|여|워|해도|이라|해야|어야|아야|되기|되어|으니|으면|으|어|냈|근|글|함|야)$/;
function stripTail(w) {
  for (let n = 0; n < 2; n++) {
    if (KO_KEEP.test(w)) break;
    const t = KO_TAIL.find((p) => w.endsWith(p) && w.length - p.length >= 2);
    if (!t) break;
    w = w.slice(0, -t.length);
  }
  return w;
}
/** 한 문장에서 핵심어 후보를 뽑아요 (조사 · 서술어 · 불용어 제거) */
function termsOf(text) {
  const out = [];
  (String(text).match(/[A-Za-z][A-Za-z0-9+#]*|[가-힣]{2,}/g) || []).forEach((raw) => {
    const ko = /[가-힣]/.test(raw);
    if (ko && KO_PRED.test(raw) && !KO_KEEP.test(raw)) return;
    if (ko && raw.length === 2 && /[은는을를의에이가로]$/.test(raw) && !KO_KEEP.test(raw)) return; // 번은 · 값을 · 원이 같은 '한 글자 + 조사'
    const k = ko ? stripTail(raw) : raw;
    if (k.length < 2 || KO_STOP.has(k) || KO_STOP.has(k.toLowerCase()) || /^(것|그렇|이렇|저렇)/.test(k)) return;
    if (ko && KO_PRED.test(k) && !KO_KEEP.test(k)) return;
    out.push(k);
  });
  return out;
}
/* ---------- 오개념 짚기 (모의 AI) ----------
 *  내가 고른 오답과 정답의 핵심어 차이 + 같은 과목의 다른 개념과 겹치면 '개념 혼동'으로 짚어요.
 *  실서버에서는 LLM이 보기마다 오개념 라벨을 붙여 돌려줘요 */
function misconceptionOf(bankId, q, chosen) {
  if (!q || chosen == null || chosen === q.a || q.o[chosen] == null) return null;
  const mine = [...new Set(termsOf(q.o[chosen]))], ans = [...new Set(termsOf(q.o[q.a]))];
  const onlyMine = mine.filter((k) => !ans.includes(k)).slice(0, 2);
  const onlyAns = ans.filter((k) => !mine.includes(k)).slice(0, 2);
  const other = BANKS[bankId].concepts.filter((c) => c.id !== q.c)
    .map((c) => ({ c, n: termsOf(`${c.name} ${c.desc}`).filter((k) => mine.includes(k)).length }))
    .sort((a, b) => b.n - a.n)[0];
  if (!onlyMine.length && !onlyAns.length) return null;
  return { onlyMine, onlyAns, confused: other && other.n >= 1 ? other.c.name : null };
}
/** [index5] 지금은 개발용 화면(?dev=1)에서만 보여요 — 모의 분석은 보기 글에서 단어만 뽑아
 *  '내 답의 초점: 상대가 / 비켜'처럼 뜻이 통하지 않는 조각을 보여 줘 오히려 헷갈렸어요.
 *  실서버의 AI 오개념 라벨이 연결되면 아래 DEV_UI 조건을 빼고 그 결과를 그리면 돼요 (복습 카드 앞면 · 문항 기록 상세 공통) */
function misconceptionHTML(bankId, q, chosen) {
  if (!DEV_UI) return '';
  const m = misconceptionOf(bankId, q, chosen);
  if (!m) return '';
  const chips = (arr, cls) => arr.map((k) => `<span class="chip ${cls}">${esc(k)}</span>`).join('');
  return `
    <div class="mt-2.5 rounded-2xl bg-surface ring-1 ring-ink-200 p-3.5 text-sm">
      <p class="text-xs font-bold text-ink-600"><i class="fa-solid fa-magnifying-glass mr-1" aria-hidden="true"></i>오개념 짚기</p>
      <div class="mt-2 grid grid-cols-[auto_1fr] items-center gap-x-2 gap-y-1.5 text-xs">
        ${m.onlyMine.length ? `<span class="font-bold text-illusion-600">내 답의 초점</span><span class="flex flex-wrap gap-1">${chips(m.onlyMine, 'bg-illusion-50 text-illusion-700')}</span>` : ''}
        ${m.onlyAns.length ? `<span class="font-bold text-mastery-700">정답의 핵심</span><span class="flex flex-wrap gap-1">${chips(m.onlyAns, 'bg-mastery-50 text-mastery-700')}</span>` : ''}
      </div>
      ${m.confused ? `<p class="mt-2 text-xs text-ink-700 break-keep">‘${esc(m.confused)}’ 개념과 혼동했을 수 있어요.</p>` : ''}
      <p class="mt-1.5 text-[11px] text-ink-500">모의 분석(데모)</p>
    </div>`;
}
/** 착각 문항은 '이해 완료'(자기 신고)로 해소할 수 없어요 — 착각에 빠진 사람에게 "이해했나요?"를 묻는 건 제품이 싸우려는 편향 그대로.
 *  유사 문제를 😎 100% 확신으로 맞혀야만 해소돼요 (그 밖의 문항은 이해 완료로 해소) */
function resolveGuard(h, qid) {
  const it = reviewItems(h).find((i) => i.qid === qid);
  const r = h.review[qid] || {};
  if (!it || resolveKind(it) !== 'illusion' || r.done) return false;
  Sound.play('alert');
  toast('착각 문항은 유사 문제를 😎 100% 확신으로 맞혀야 해소돼요', { ms: 3200 });
  return true;
}

// [index5] 터치 영역: 글자 높이 16px만 눌렸어요 → py-[14px] + -my-[14px]로 눌리는 영역만 44px로 (화면 배치는 그대로)
const tableLink = () => '<button type="button" class="mt-3 py-[14px] -my-[14px] text-xs font-bold text-ink-500 underline underline-offset-4" data-action="result-tab" data-k="log">문항별 기록으로 보기</button>';
/** [index5] 차트 카드는 접이식(details) — 차트 분석 탭이 5블록 · 약 2,900px로 길었어요
 *  · 처음엔 opt.open인 카드(확신도별 실제 정답률)만 펼치고, 나머지는 제목 + 한 줄 결론(opt.peek)만 보여요 → 누르면 펼침
 *  · 펼침 상태는 RT.chartOpen[제목]에 기억(아래 toggle 리스너) — 탭을 옮겼다 와도 그대로예요
 *  · 접힌 줄의 결론은 각 차트가 이미 만든 insight 문장을 태그만 벗겨 재사용해요 (없으면 부제) */
const chartCard = (title, sub, body, opt = {}) => {
  const isOpen = title in RT.chartOpen ? RT.chartOpen[title] : !!opt.open;
  const peek = String(opt.peek || sub || '').replace(/<[^>]+>/g, '').trim();
  return `
  <details class="group card m-0" data-chart="${esc(title)}" ${isOpen ? 'open' : ''}>
    <summary class="flex items-start gap-3 p-5 sm:p-7 cursor-pointer select-none rounded-[inherit]">
      <span class="min-w-0 flex-1">
        <h2 class="section-title">${title}</h2>
        ${peek ? `<span class="mt-1 block text-sm text-ink-500 break-keep line-clamp-2 group-open:hidden">${esc(peek)}</span>` : ''}
        ${sub ? `<span class="mt-1 hidden text-sm text-ink-500 break-keep group-open:block">${sub}</span>` : ''}
      </span>
      <i class="fa-solid fa-chevron-down mt-1.5 shrink-0 text-xs text-ink-400 transition group-open:rotate-180" aria-hidden="true"></i>
    </summary>
    <div class="px-5 pb-5 sm:px-7 sm:pb-7 -mt-3">${body}</div>
  </details>`;
};
const insight = (emoji, html) => `<p class="mt-3 rounded-2xl bg-ink-50 px-4 py-3 text-sm text-ink-700 leading-relaxed break-keep"><span aria-hidden="true">${emoji}</span> ${html}</p>`;

/* ---------- 핵심 지표 타일(차트 분석 탭 맨 위) · 2×2 사분면(요약 탭) ---------- */
function kpiHTML(ev, st) {
  const tile = (label, value, sub, icon) => `
    <div class="card p-4 sm:p-5">
      <p class="text-xs font-bold text-ink-500 flex items-center gap-1.5"><i class="fa-solid ${icon} text-ink-400"></i>${label}</p>
      <p class="mt-1.5 text-[26px] leading-none font-extrabold tracking-tight">${value}</p>
      <p class="mt-1.5 text-xs text-ink-500 break-keep">${sub}</p>
    </div>`;
  const signals = st.fast + st.slow + st.tab;
  return `
  <section class="grid grid-cols-2 lg:grid-cols-4 gap-3" aria-label="핵심 지표">
    ${tile('맞힌 문항', `${st.correct}<span class="text-base font-bold text-ink-500">/${st.n}</span>`, `정답률 ${pct(ev.accuracy)}%`, 'fa-circle-check')}
    ${tile('평균 풀이 시간', `${st.avgSec.toFixed(1)}<span class="text-base font-bold text-ink-500">초</span>`, `권장 시간의 ${pct(st.avgRatio)}%`, 'fa-stopwatch')}
    ${tile('보기 번복', `${st.hes}<span class="text-base font-bold text-ink-500">회</span>`, st.hes ? `${st.hesItems}문항에서 답을 바꿨어요` : '한 번도 바꾸지 않았어요', 'fa-arrow-rotate-left')}
    ${tile('주의 신호', `${signals}<span class="text-base font-bold text-ink-500">건</span>`, `성급 ${st.fast} · 지연 ${st.slow} · 이탈 ${st.tab}`, 'fa-flag')}
  </section>`;
}

/** 2×2 사분면 — [index5] 숫자만 있는 작은 격자로 줄였어요
 *  예전엔 칸마다 개념 이름 칩 · 처방까지 있어서 바로 아래 '🎯 지금 해야 할 것'과 같은 내용을 두 번 보여 줬어요
 *  → 개념 이름 · 처방(할 일)은 '지금 해야 할 것'에만 두고, 여기서는 한눈에 보는 분포만 (휴대폰에서도 2×2 그대로)
 *  배치: 왼쪽 = 오답 · 오른쪽 = 정답 / 위 = 확신 높음 · 아래 = 확신 낮음 */
function matrixHTML(ev) {
  const quad = (k) => {
    const m = STATUS[k], t = TONE[m.tone];
    const n = ev.items.filter((i) => i.status === k).length;
    return `
    <div role="listitem" class="rounded-2xl ${n ? t.soft : 'bg-ink-50'} p-3 sm:p-4 ${k === 'ILLUSION' && n ? 'ring-2 ring-illusion-500' : ''}">
      <div class="flex items-start justify-between gap-2"><p class="min-w-0 text-[11px] font-bold ${n ? t.text : 'text-ink-500'} break-keep">${m.axis}</p><p class="shrink-0 text-[26px] leading-none font-black tnum ${n ? t.text : 'text-ink-400'}">${n}<span class="sr-only">문항</span></p></div>
      <p class="mt-1 font-extrabold text-[14px] sm:text-[15px] leading-snug whitespace-nowrap">${m.emoji} ${m.label}</p>
    </div>`;
  };
  // [index5] 같은 문제를 한 진단에서 두 번 풀면(샘플 문제가 모자랄 때 보기 순서를 바꿔 다시 출제) 사분면은 두 번 세고,
  //          복습 카드는 한 장으로 합쳐요 → '착각 7' vs '착각 6문항 복습하기'처럼 숫자가 달라 보이던 이유를 한 줄로 알려 줘요
  //          복습 카드는 🟢 확실한 내 지식을 뺀 문항만(reviewItems)이라, 그중에 겹친 문제가 있을 때만 셉니다 (모두 맞혀 카드가 없으면 안내도 없음)
  const weak = ev.items.filter((i) => i.status !== 'MASTERY');
  const dup = weak.length - new Set(weak.map((i) => i.qid)).size;
  return `
  <section class="card p-5 sm:p-7" aria-label="2×2 메타인지 사분면">
    <h2 class="section-title">2×2 메타인지 사분면</h2>
    <p class="mt-1 text-sm text-ink-500 break-keep">내 확신도 × 실제 결과로 ${ev.items.length}문항을 나눴어요.${ev.items.some((i) => i.isVerify) ? ` <span class="text-ink-600">(너무 빨리 맞힌 문제를 확인하려고 더 낸 <b>요행 방지 확인 문항 ${ev.items.filter((i) => i.isVerify).length}개</b> 포함)</span>` : ''}${dup ? ` <span class="text-ink-600">같은 문제를 다시 푼 <b>${dup}문항</b>도 따로 셌어요 — 복습 카드는 같은 문제를 한 장으로 합쳐서 숫자가 조금 적을 수 있어요.</span>` : ''} 개념별로 무엇을 할지는 아래 <b class="text-ink-700">🎯 지금 해야 할 것</b>에 있어요.</p>
    <div class="mt-4 grid grid-cols-2 gap-2 text-center text-xs font-bold text-ink-500" aria-hidden="true"><span>오답 ✗</span><span>정답 ✓</span></div>
    <div class="mt-2 grid grid-cols-2 gap-2" role="list">${['ILLUSION', 'MASTERY', 'DEFICIT', 'INSTABILITY'].map(quad).join('')}</div>
    <p class="mt-3 text-xs text-ink-500 leading-relaxed break-keep">* 오답은 70% 이상 확신했을 때 ‘${STATUS.ILLUSION.label}’, 정답은 100% 확신에 번복 · 지연 · 성급함이 없을 때만 ‘${STATUS.MASTERY.label}’으로 판정해요.</p>
  </section>`;
}

/* ---------- 차트 분석 탭 ---------- */
/** 확신도별 실제 정답률: 막대 = 실제 정답률, 가로선 = 내가 말한 확신 */
function calibrationChartHTML(st) {
  const used = st.byConf.filter((b) => b.n);
  const over = used.map((b) => ({ ...b, d: CONF[b.k].v - b.acc })).sort((a, b) => b.d - a.d);
  let note;
  if (over.length && over[0].d >= 0.2) {
    const b = over[0];
    note = insight(CONF[b.k].emoji, `<b>${CONF[b.k].pct} ${CONF[b.k].word}</b>이라고 답한 ${b.n}문항 중 <b>${b.correct}문항</b>만 맞혔어요(${pct(b.acc)}%). 확신이 실력보다 앞서가고 있어요.`);
  } else if (over.length && over[over.length - 1].d <= -0.2) {
    const b = over[over.length - 1];
    note = insight(CONF[b.k].emoji, `<b>${CONF[b.k].pct} ${CONF[b.k].word}</b>이라고 답한 문항도 ${pct(b.acc)}%나 맞혔어요. 생각보다 더 알고 있어요.`);
  } else {
    note = insight('👍', '확신 수준과 실제 정답률이 대체로 맞아요.');
  }
  const col = (b) => {
    const c = CONF[b.k];
    if (!b.n) return `<div class="relative h-full flex items-center justify-center"><span class="text-xs text-ink-500">문항 없음</span></div>`;
    const tip = tipAttr([`실제 정답률 ${pct(b.acc)}%`, `${c.emoji} ${c.pct} ${c.word}로 답한 ${b.n}문항 중 ${b.correct}문항 정답`, `내가 말한 확신: ${c.pct}`]);
    return `
      <div class="relative h-full flex items-end justify-center">
        <div class="absolute left-1/2 -translate-x-1/2 w-14 h-[2px] rounded-full bg-ink-800 z-10" style="bottom:calc(${c.v * 100}% - 1px)" aria-hidden="true"></div>
        <div class="mark relative w-6 rounded-t-[4px] bg-brand-500 outline-none" style="height:${Math.max(pct(b.acc), 1)}%" ${tip}>
          <span class="absolute -top-5 left-1/2 -translate-x-1/2 text-xs font-extrabold tnum whitespace-nowrap">${pct(b.acc)}%</span>
        </div>
      </div>`;
  };
  return chartCard('확신도별 실제 정답률', '파란 막대(실제 정답률)가 검은 가로선(내가 말한 확신)보다 낮으면 과신, 높으면 과소평가예요.', `
    ${note}
    <div class="mt-6 flex gap-2">
      <div class="relative w-9 h-44 shrink-0 text-[11px] text-ink-500 tnum" aria-hidden="true">

}

/** 개념별 확신 vs 정답률: 덤벨 차트 (두 점 사이 거리 = 착각의 크기) */
function conceptGapChartHTML(ev) {
  const row = (c) => {
    const lo = Math.min(c.conf, c.acc), hi = Math.max(c.conf, c.acc), d = c.conf - c.acc;
    const tone = d >= 0.15 ? 'bg-illusion-500' : d <= -0.15 ? 'bg-brand-300' : 'bg-ink-300';
    const tag = d >= 0.15 ? `+${pct(d)}%p 과신` : d <= -0.15 ? `${pct(d)}%p 과소평가` : '거의 일치';
    const dot = (v, cls, lines) => `<span class="mark absolute top-1/2 -translate-x-1/2 -translate-y-1/2 w-6 h-6 grid place-items-center rounded-full outline-none z-10" style="left:${pct(v)}%" ${tipAttr(lines)}><span class="w-4 h-4 rounded-full ${cls} ring-2 ring-surface"></span></span>`;
    return `
      <li>
        <div class="flex items-center justify-between gap-2"><span class="text-sm font-bold truncate">${esc(c.name)}</span><span class="shrink-0 text-xs font-bold text-ink-600">${tag}</span></div>
        <div class="relative h-8 mt-1">
          <div class="absolute inset-x-0 top-1/2 h-px bg-ink-200" aria-hidden="true"></div>
          <div class="absolute top-1/2 -translate-y-1/2 h-[3px] rounded-full ${tone}" style="left:${pct(lo)}%;width:${Math.max(0, pct(hi) - pct(lo))}%" aria-hidden="true"></div>
          ${dot(c.conf, 'bg-ink-800', [`확신 ${pct(c.conf)}%`, c.name])}
          ${dot(c.acc, 'bg-brand-500', [`정답률 ${pct(c.acc)}%`, `${c.name} · ${c.n}문항`])}
        </div>
      </li>`;
  };
  const worst = ev.concepts.slice().sort((a, b) => b.gap - a.gap)[0];
  const note = worst && worst.gap >= 0.15
    ? insight('🎯', `<b>${esc(worst.name)}</b>에서 확신이 정답률보다 ${pct(worst.gap)}%p 높아요. 여기부터 복습하면 효과가 가장 커요.`)
    : insight('👍', '개념마다 확신과 실제 실력이 크게 어긋나지 않아요.');
  return chartCard('개념별 확신 vs 실제 정답률', '두 점 사이가 멀수록 착각(또는 과소평가)이 커요.', `
    ${note}
    <ul class="mt-5 space-y-4" role="list">${ev.concepts.map(row).join('')}</ul>
    <div class="mt-1 flex justify-between text-[11px] text-ink-500 tnum" aria-hidden="true"><span>0%</span><span>50%</span><span>100%</span></div>
    <div class="mt-4 flex flex-wrap gap-4 text-xs text-ink-600">
      <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-ink-800" aria-hidden="true"></span>평균 확신도</span>
      <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-brand-500" aria-hidden="true"></span>실제 정답률</span>
      <span class="flex items-center gap-1.5"><span class="w-4 h-[3px] rounded-full bg-illusion-500" aria-hidden="true"></span>과신 구간</span>
    </div>`, { peek: note });
}

/** 단계별 정답률: 기초 · 실전 · 심화 가로 막대 */
function levelChartHTML(st) {
  const [l1, l2, l3] = st.byLevel;
  const appGap = l1.n && l1.acc >= 0.7 && ((l2.n && l2.acc < 0.5) || (l3.n && l3.acc < 0.5));
  const note = appGap
    ? insight('🧩', '기초 정의는 탄탄한데 <b>실전 · 심화에서 막혀요</b>. 전형적인 “정의는 알지만 적용은 못 하는” 패턴이에요.')
    : st.byLevel.filter((b) => b.n).length < 2
      ? insight('ℹ️', '한 단계만 출제되어 단계 간 비교는 어려워요. 🔀 셔플로 풀면 단계별 차이를 볼 수 있어요.')
      : insight('📈', '단계가 올라갈수록 정답률이 어떻게 변하는지 확인해 보세요.');
  return chartCard('단계별 정답률', '🔀 셔플에서는 맞힐수록 높은 단계, 틀릴수록 낮은 단계 문항이 나와요.', `
    ${note}
    <ul class="mt-5 space-y-3.5">${st.byLevel.map((b) => `
      <li class="grid grid-cols-[64px_1fr_auto] items-center gap-2.5">
        <span class="text-sm font-bold">${LEVELS[b.lv].icon} ${LEVELS[b.lv].short}</span>
        ${b.n
          ? `<div class="h-5 rounded-[4px] bg-ink-100 overflow-hidden"><div class="mark h-full rounded-r-[4px] bg-brand-500 outline-none" style="width:${Math.max(pct(b.acc), 1)}%" ${tipAttr([`정답률 ${pct(b.acc)}%`, `${LEVELS[b.lv].name} ${b.n}문항 중 ${b.correct}문항 정답`])}></div></div>`
          : '<div class="h-5 rounded-[4px] bg-ink-50 border border-dashed border-ink-200"></div>'}
        <span class="w-[74px] text-right text-sm tnum whitespace-nowrap">${b.n ? `<b>${pct(b.acc)}%</b> <span class="text-xs text-ink-500">${b.correct}/${b.n}</span>` : '<span class="text-xs text-ink-500">출제 없음</span>'}</span>
      </li>`).join('')}
    </ul>
    ${tableLink()}`, { peek: note });
}

/** 문항별 흐름: (위) 출제 단계 × 판정 점 그래프, (아래) 권장 시간 대비 풀이 시간 막대 — 같은 x축을 쓰는 두 개의 작은 차트 */
function flowChartHTML(h, ev) {
  const its = ev.items, n = its.length;
  const cols = `grid-template-columns:repeat(${n}, minmax(0,1fr))`;
  const showLabel = (i) => n <= 12 || i === 0 || (i + 1) % 5 === 0 || i === n - 1;
  const tipOf = (i) => [
    `Q${i.idx + 1} · ${STATUS[i.status].emoji} ${STATUS[i.status].label}`,
    `${conceptOf(h.bankId, i.cid).name} · ${LEVELS[i.lv].name}`,
    `${i.correct ? '정답' : '오답'} · ${CONF[i.conf].emoji} ${CONF[i.conf].pct} · 번복 ${i.hesitation}회`,
    `${(i.ms / 1000).toFixed(1)}초 / 권장 ${i.stdSec}초 (${pct(i.ratio)}%)`,
  ];
  const levelTop = { 3: '16.7%', 2: '50%', 1: '83.3%' };
  const flagged = (i) => i.speedFlag || i.ratio > SLOW_LIMIT;
  return chartCard('문항별 흐름', '문항마다 어떤 단계가 나왔고 어떻게 판정됐는지, 권장 시간 대비 얼마나 걸렸는지 보여 줘요.', `
    <p class="mt-5 text-xs font-bold text-ink-600">출제 단계와 판정</p>
    <div class="mt-2 flex gap-2">
      <div class="relative w-10 h-28 shrink-0 text-[11px] text-ink-500" aria-hidden="true">${[3, 2, 1].map((l) => `<span class="absolute right-0 -translate-y-1/2" style="top:${levelTop[l]}">${LEVELS[l].short}</span>`).join('')}</div>
      <div class="relative flex-1 h-28">
        ${[3, 2, 1].map((l) => `<div class="absolute inset-x-0 h-px bg-ink-100" style="top:${levelTop[l]}" aria-hidden="true"></div>`).join('')}
        <div class="relative h-full grid" style="${cols}">${its.map((i) => `
          <div class="relative h-full">
            <span class="mark absolute left-1/2 -translate-x-1/2 -translate-y-1/2 w-6 h-6 grid place-items-center rounded-full outline-none" style="top:${levelTop[i.lv]}" ${tipAttr(tipOf(i))}>
              <span class="w-3.5 h-3.5 rounded-full ${TONE[STATUS[i.status].tone].fill} ring-2 ring-surface"></span>
            </span>
          </div>`).join('')}
        </div>
      </div>
    </div>
    <p class="mt-5 text-xs font-bold text-ink-600">풀이 시간 (권장 시간 대비)</p>
    <div class="mt-2 flex gap-2">
      <div class="relative w-10 h-24 shrink-0 text-[11px] text-ink-500 tnum" aria-hidden="true"><span class="absolute right-0 -top-2">200%</span><span class="absolute right-0 top-1/2 -translate-y-1/2">100%</span><span class="absolute right-0 -bottom-2">0%</span></div>
      <div class="relative flex-1 h-24 border-b border-ink-300">
        <div class="absolute inset-x-0 top-1/2 h-px bg-ink-400 z-10" aria-hidden="true"></div>
        <div class="absolute inset-x-0 h-px bg-unstable-500 z-10" style="bottom:10%" aria-hidden="true"></div>
        <div class="relative h-full grid" style="${cols}">${its.map((i) => `
          <div class="relative h-full flex items-end justify-center">
            <div class="mark w-[60%] max-w-[24px] rounded-t-[4px] ${flagged(i) ? 'bg-unstable-500' : 'bg-brand-500'} outline-none" style="height:${Math.max(2, Math.min(100, i.ratio * 50))}%" ${tipAttr(tipOf(i))}></div>
            ${i.ratio > 2 ? '<span class="absolute -top-3.5 text-[10px] text-ink-500" aria-hidden="true">▲</span>' : ''}
          </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="mt-1.5 ml-12 grid" style="${cols}" aria-hidden="true">${its.map((i, k) => `<span class="text-center text-[10px] text-ink-500 tnum">${showLabel(k) ? `Q${i.idx + 1}` : ''}</span>`).join('')}</div>
    <div class="mt-4 flex flex-wrap gap-x-4 gap-y-2 text-xs text-ink-600">
      ${CHART_ORDER.map((k) => `<span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full ${TONE[STATUS[k].tone].fill}" aria-hidden="true"></span>${STATUS[k].short}</span>`).join('')}
      <span class="w-px h-4 bg-ink-200" aria-hidden="true"></span>
      <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-[3px] bg-brand-500" aria-hidden="true"></span>적정 시간</span>
      <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-[3px] bg-unstable-500" aria-hidden="true"></span>성급 · 지연</span>
      <span class="flex items-center gap-1.5"><span class="w-4 h-px bg-ink-400" aria-hidden="true"></span>권장 시간</span>
      <span class="flex items-center gap-1.5"><span class="w-4 h-px bg-unstable-500" aria-hidden="true"></span>최소 읽기(20%)</span>
    </div>
    ${tableLink()}`);
}

function conceptsHTML(h, ev) {
  return `
  <section class="card p-5 sm:p-7" aria-label="개념별 집중 연습">

    <div class="mt-4 grid gap-3 md:grid-cols-3">${ev.concepts.map((c, i) => `
      <article class="rounded-2xl border border-ink-200 p-4 flex flex-col">

        <h3 class="mt-2 font-bold text-[16px] leading-snug">${esc(c.name)}</h3>

        <div class="mt-auto pt-4">
          <p class="text-[11px] font-bold text-ink-500 mb-1.5">집중 연습 3문항</p>

/* ---------- 문항 기록 탭: 문항별 아코디언 카드 ----------
 * [변경] 표(Table)를 폐기하고 <details> 아코디언으로 바꿨어요.
 *  - 접힌 상태: 번호 · 개념 · 정오답 · 확신도 · 풀이 시간 · 판정 칩 (한눈에 훑기)
 *  - 펼친 상태: ① 실제 지문 ② 내가 고른 답(보기 텍스트) ③ 실제 정답(보기 텍스트) + 기존 행동 로그(단계 · 확신 · 시간 · 번복 · 판정 근거)
 *  - 펼침 상태는 data-row 키로 RT.openRows에 기억 → '전체 보기'로 다시 그려도 열린 카드가 유지돼요
 */
function logHTML(h, ev) {
  const rows = RT.logOpen ? ev.items : ev.items.slice(0, 10);
  const optText = (q, k) => (q && k != null && q.o[k] != null ? q.o[k] : null);
  const item = (i) => {
    const q = getQ(i.qid), m = STATUS[i.status], key = `log|${h.id}|${i.idx}`;
    const mine = optText(q, i.chosen), answer = optText(q, q && q.a);
    const tags = [i.isVerify ? '확인 문항' : '', i.repeat ? '반복 출제' : '', i.tabOut ? '화면 이탈' : ''].filter(Boolean);
    const fact = (label, value) => `<div class="rounded-xl bg-ink-50 px-3 py-2"><dt class="text-[11px] font-bold text-ink-500">${label}</dt><dd class="mt-0.5 text-sm font-bold tnum">${value}</dd></div>`;
    return `
    <details class="group rounded-2xl ring-1 ring-ink-100 open:ring-ink-200 open:shadow-card transition" data-row="${key}" ${RT.openRows.has(key) ? 'open' : ''}>
      <summary class="flex items-center gap-3 p-3.5 cursor-pointer select-none rounded-2xl hover:bg-ink-50">
        <span class="w-8 shrink-0 text-xs font-extrabold text-ink-500 tnum">Q${i.idx + 1}</span>
        <!-- [index5] 행 제목: 개념 이름만 있으면 10문항 중 3~4줄이 똑같아 보여서 '문제 첫머리'를 제목으로, 개념 이름은 작은 글씨로 · 초 + ⚡는 한 덩어리(줄바꿈 때 ⚡만 혼자 떨어지지 않게) -->
        <span class="min-w-0 flex-1">
          <span class="block text-sm font-bold truncate">${q ? esc(q.q) : esc(conceptOf(h.bankId, i.cid).name)}</span>
          <span class="block mt-0.5 text-[11px] font-semibold text-ink-500 truncate">${esc(conceptOf(h.bankId, i.cid).name)}</span>
          <span class="block mt-0.5 text-xs text-ink-500 tnum">${i.correct ? '<b class="text-mastery-700">정답</b>' : '<b class="text-illusion-600">오답</b>'} · ${CONF[i.conf].emoji} ${CONF[i.conf].pct} · <span class="whitespace-nowrap">${(i.ms / 1000).toFixed(1)}초${i.speedFlag ? ' <i class="fa-solid fa-bolt text-unstable-500" title="최소 읽기 시간 미달"></i>' : ''}</span></span>
        </span>
        <span class="chip shrink-0 ${TONE[m.tone].chip}">${m.emoji} ${m.short}</span>
        <i class="fa-solid fa-chevron-down shrink-0 text-xs text-ink-400 transition group-open:rotate-180" aria-hidden="true"></i>
      </summary>
      <div class="px-3.5 pb-4 space-y-3">
        <div>
          <p class="text-[11px] font-bold text-ink-500">지문</p>
          <p class="mt-1 text-sm text-ink-800 leading-relaxed break-keep">${q ? esc(q.q) : '문항 정보를 찾을 수 없어요'}</p>
        </div>
        <div class="grid sm:grid-cols-2 gap-2">
          <div class="rounded-xl p-3 ${i.correct ? 'bg-mastery-50' : 'bg-illusion-50'}">
            <p class="text-[11px] font-bold ${i.correct ? 'text-mastery-700' : 'text-illusion-700'}"><i class="fa-solid ${i.correct ? 'fa-check' : 'fa-xmark'} mr-1" aria-hidden="true"></i>내가 고른 답</p>
            <p class="mt-1 text-sm font-semibold text-ink-900 break-keep">${mine != null ? esc(mine) : '기록 없음'}</p>
          </div>
          <div class="rounded-xl p-3 bg-mastery-50">
            <p class="text-[11px] font-bold text-mastery-700"><i class="fa-solid fa-circle-check mr-1" aria-hidden="true"></i>실제 정답</p>
            <p class="mt-1 text-sm font-semibold text-ink-900 break-keep">${answer != null ? esc(answer) : '기록 없음'}</p>
          </div>
        </div>
        ${i.correct ? '' : misconceptionHTML(h.bankId, q, i.chosen)}
        <dl class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          ${fact('단계', `${LEVELS[i.lv].icon} ${i.lv}단계 · ${LEVELS[i.lv].short}`)}
          ${fact('확신도', `${CONF[i.conf].emoji} ${CONF[i.conf].pct} ${CONF[i.conf].word}`)}
          ${fact('풀이 / 권장', `${(i.ms / 1000).toFixed(1)}초 / ${i.stdSec}초`)}
          ${fact('보기 번복', `${i.hesitation}회`)}
        </dl>
        <p class="text-xs text-ink-600 break-keep"><b class="${TONE[m.tone].text}">${m.emoji} ${m.label}</b> — ${i.reasons.map(esc).join(' · ')}${tags.length ? ` <span class="text-ink-500">(${tags.join(' · ')})</span>` : ''}</p>
      </div>
    </details>`;
  };
  return `
  <section class="card p-5 sm:p-7" aria-label="문항별 행동 로그">
    <h2 class="section-title">문항별 행동 로그</h2>
    <p class="mt-1 text-sm text-ink-500 break-keep">풀이 중에는 보여 주지 않았던 기록이에요. 문항을 누르면 지문과 내 답 · 실제 정답을 함께 볼 수 있어요.</p>
    <div class="mt-4 space-y-2">${rows.map(item).join('')}</div>
    ${ev.items.length > 10 ? `<button type="button" class="mt-3 w-full btn btn-md btn-gray" data-action="toggle-log">${RT.logOpen ? '접기' : `전체 ${ev.items.length}문항 보기`}</button>` : ''}
  </section>`;
}

function formulaHTML() {
  return `
  <details id="formula" class="card p-5 sm:p-7 group">
    <summary class="flex items-center justify-between cursor-pointer select-none py-3 -my-3"><span class="section-title">판정 기준은 이렇게 계산해요</span><i class="fa-solid fa-chevron-down text-ink-400 transition group-open:rotate-180"></i></summary>
    <div class="mt-4 space-y-3 text-sm text-ink-700 leading-relaxed break-keep">
      <div class="rounded-2xl bg-ink-50 p-4"><p class="font-bold text-ink-900">① 권장 풀이 시간 T</p>
        <p class="mt-1">T = (지문 + 보기 글자 수) ÷ 10 + 난이도 가산 (기초 5초 · 실전 10초 · 심화 15초)</p>
        <p class="mt-1 text-ink-500">T의 20% 미만에 정답 → 정답 공개 없이 같은 개념 · 같은 단계의 확인 문항 출제 (Speed Limit). T의 150% 초과 → 지연.</p></div>
      <div class="rounded-2xl bg-ink-50 p-4"><p class="font-bold text-ink-900">② 문항 판정</p>
        <ul class="mt-1 space-y-1">
          <li>🚨 <b>${STATUS.ILLUSION.label}</b> — 오답 + 확신 100% 또는 70%</li>
          <li>🟣 <b>${STATUS.DEFICIT.label}</b> — 오답 + 확신 30%</li>
          <li>🟢 <b>${STATUS.MASTERY.label}</b> — 정답 + 확신 100% + 번복 2회 미만 + 시간 T의 20~150% + 화면 이탈 없음</li>
          <li>🟡 <b>${STATUS.INSTABILITY.label}</b> — 그 밖의 정답 (70% · 30% 확신, 번복 · 지연 · 성급함 · 이탈)</li>
        </ul></div>
      <div class="rounded-2xl bg-ink-50 p-4"><p class="font-bold text-ink-900">③ 개념 판정 (복습 우선순위)</p>
        <ul class="mt-1 space-y-1">
          <li>🚨 100% 확신 오답이 있거나, 기초는 맞혔는데 실전 · 심화를 70% 이상 확신으로 틀렸거나, 확신이 정답률보다 20%p 이상 높으면 <b>${STATUS.ILLUSION.label}</b></li>
          <li>🟣 정답률 50% 미만이면 <b>${STATUS.DEFICIT.label}</b> · 🟢 정답률 80% 이상이고 ‘${STATUS.MASTERY.short}’ 문항이 60% 이상이면 <b>${STATUS.MASTERY.label}</b> · 나머지는 🟡 <b>${STATUS.INSTABILITY.label}</b></li>
        </ul></div>
      <div class="rounded-2xl bg-ink-50 p-4"><p class="font-bold text-ink-900">④ 메타인지 정확도</p>
        <p class="mt-1">100 × (1 − 평균[(확신도 − 정답)²]) · 확신도 100%=1.0, 70%=0.7, 30%=0.3 · 정답=1, 오답=0 (Brier 점수 기반)</p>
        <p class="mt-1 text-ink-500">예) 100% 확신 선택 + 오답은 0점, 30% 확신 선택 + 오답은 91점이에요. “모른다는 걸 아는 것”도 좋은 메타인지예요.</p></div>
    </div>
  </details>`;
}

/* =====================================================================
 * 복습 덱 — 카드(뒤집기 · 스와이프) / 목록 보기
 *  [변경] 범위: 진단 하나 · 모든 진단 모아보기(RT.reviewScope === 'all')
 *         카드마다 자기 진단(i.h)을 들고 다녀서, 여러 진단의 착각을 한 덱에서 복습할 수 있어요
 *  [index5] 과목별 분류: 복습할 과목이 둘 이상이면 제목 아래 과목 칩(reviewSubjects) — 누르면 'review-subject'가
 *           RT.reviewScope = 'all' + RT.reviewSubject = 과목 → deckEntries()가 그 과목 진단만 모아요 (칩 숫자 = 그 과목 복습 카드 수)
 *  [index5] 보기 전환: 제목 오른쪽에 '아이콘 + 글자' 큰 버튼 두 개(카드 · 목록), 켜진 쪽은 메인 색으로 채워 한눈에 보여요
 *  [변경] 해소 경로: 착각 → 유사 문제를 😎 100% 확신으로 맞혀야만 / 그 밖 → 이해 완료 또는 유사 문제
 *         (AI 서술 검증은 MVP에서 뺐어요 — 착각 문항은 [유사 문제로 해소] 버튼 하나로 바로 재도전)
 * ===================================================================== */
/** [index5] 복습 덱 과목 필터: 복습할 문항이 있는 과목 목록 (최근에 진단한 과목 먼저) + 과목별 복습 카드 수 (덱의 '전체 N'과 같은 기준) */
function reviewSubjects() {
  const map = new Map();
  realHistory().slice().sort((a, b) => new Date(b.date) - new Date(a.date)).forEach((h) => {
    const n = reviewItems(h).length;
    if (!n) return;
    const m = map.get(h.subject) || { subject: h.subject, n: 0, bankId: h.bankId };
    m.n += n;
    map.set(h.subject, m);
  });
  return [...map.values()];
}
/** 덱에 들어갈 진단들
 *  [index5] 모아보기(RT.reviewScope === 'all')는 과목 필터(RT.reviewSubject)로 한 과목만 모을 수 있어요 ('ALL' = 모든 과목) */
function deckEntries() {
  if (RT.reviewScope === 'all') {
    if (RT.reviewSubject !== 'ALL' && !reviewSubjects().some((x) => x.subject === RT.reviewSubject)) RT.reviewSubject = 'ALL'; // 그 과목 기록이 사라졌으면 전체로
    return realHistory().filter((h) => reviewItems(h).length && (RT.reviewSubject === 'ALL' || h.subject === RT.reviewSubject));
  }
  const h = reviewEntry();
  return h ? [h] : [];
}
/** 덱 카드: 1순위 고정 → 판정 순위 → (모아보기면) 최근 진단 순 */
function deckItems() {
  const list = deckEntries().flatMap((h) => reviewItems(h).map((i) => ({ ...i, h })));
  if (RT.reviewScope === 'all') list.sort((a, b) => a.score - b.score || new Date(b.h.date) - new Date(a.h.date) || a.idx - b.idx);
  return list;
}
function reviewFiltered() {
  const all = deckItems();
  return RT.reviewFilter === 'ALL' ? all : all.filter((i) => i.status === RT.reviewFilter);
}
/** 재도전 버튼: 미해소 착각이면 '유사 문제로 해소 · 😎 100%'로 강조 (착각의 유일한 해소 경로) */
function retryBtnHTML(i, r, cls = '') {
  const ill = resolveKind(i) === 'illusion' && !r.done;
  return `<button type="button" class="btn btn-md ${cls} ${ill ? 'bg-solid-danger hover:bg-solid-danger-hover text-white' : 'btn-dark'}" data-action="retry" data-id="${i.h.id}" data-qid="${i.qid}"><i class="fa-solid fa-rotate-right text-xs"></i>${ill ? '유사 문제로 해소 · 😎 100%' : '유사 문제'}</button>`;
}
/** 해소 버튼: 착각(미해소)은 자기 신고 버튼 없음 · 그 밖은 '이해 완료' */
function resolveBtnHTML(i, r, cls = '') {
  const attrs = `data-id="${i.h.id}" data-qid="${i.qid}"`;
  if (r.done) return `<button type="button" class="btn btn-md ${cls} bg-solid-mastery text-white hover:bg-solid-mastery-hover" data-action="toggle-done" ${attrs} aria-pressed="true"><i class="fa-solid fa-check text-xs"></i>해소됨</button>`;
  if (resolveKind(i) === 'illusion') return '';
  return `<button type="button" class="btn btn-md ${cls} btn-secondary" data-action="toggle-done" ${attrs} aria-pressed="false"><i class="fa-solid fa-check text-xs"></i>이해 완료</button>`;
}

function renderReview() {
  const isAll = RT.reviewScope === 'all';
  const entries = deckEntries();
  if (!entries.length) {
    $('#view-review').innerHTML = `
    <div class="max-w-md mx-auto px-6 pt-20 pb-28 text-center anim-in">
      <span class="w-14 h-14 mx-auto rounded-2xl bg-surface shadow-card grid place-items-center text-2xl text-ink-500"><i class="fa-regular fa-folder-open"></i></span>
      <h1 class="mt-4 text-lg font-extrabold">${isAll ? '모아 볼 복습이 없어요' : '복습할 기록이 아직 없어요'}</h1>
      <p class="mt-1 text-sm text-ink-500 break-keep">진단을 한 번 마치면 착각한 문항부터 복습 카드가 만들어져요.</p>
      <button type="button" class="mt-6 btn btn-lg btn-primary w-full" data-action="go" data-view="home">진단하러 가기</button>
    </div>`;
    return;
  }
  const all = deckItems();
  const done = all.filter((i) => (i.h.review[i.qid] || {}).done).length;
  const allDone = all.length > 0 && done === all.length;
  let items = reviewFiltered();
  if (RT.reviewIndex >= items.length) RT.reviewIndex = Math.max(0, items.length - 1);
  const counts = { ALL: all.length };
  ['ILLUSION', 'INSTABILITY', 'DEFICIT'].forEach((k) => { counts[k] = all.filter((i) => i.status === k).length; });
  const filters = [['ALL', '전체'], ['ILLUSION', '🚨 착각'], ['INSTABILITY', `${STATUS.INSTABILITY.emoji} ${STATUS.INSTABILITY.short}`], ['DEFICIT', `${STATUS.DEFICIT.emoji} ${STATUS.DEFICIT.short}`]].filter(([k]) => k === 'ALL' || counts[k]);
  // [index5] 유형 필터는 '전체' 말고 유형이 2개 이상일 때만 보여요 — 착각만 있으면 '전체 9'와 '착각 9'가 같은 숫자를 두 번 보여 줬어요.
  //          줄을 숨기면 필터를 되돌릴 칩도 없어지므로, 그 경우엔 필터를 '전체'로 되돌려 남은 카드가 빈 화면으로 가려지지 않게 해요
  const showFilters = filters.length > 2;
  if (!showFilters && RT.reviewFilter !== 'ALL') { RT.reviewFilter = 'ALL'; items = reviewFiltered(); RT.reviewIndex = Math.min(RT.reviewIndex, Math.max(0, items.length - 1)); }
  const mode = S.prefs.reviewMode;
  const h = entries[0];
  const due = isAll ? Math.min(...entries.map(nextDueAt)) : nextDueAt(h);
  const stage = isAll ? 0 : reviewStage(h);
  const multi = realHistory().filter((x) => reviewItems(x).length).length > 1;
  const subjects = reviewSubjects();
  const subjectOn = (k) => isAll && RT.reviewSubject === k;
  const subjectSoft = (k) => !isAll && h && h.subject === k; // 진단 하나를 보는 중이면 그 과목 칩을 옅게 표시
  // [index5] '지금 보는 복습' — 과목 칩 · 선택 시트와 같은 상태를 크게 보여 줘요
  //          과목이 하나뿐이면 '모든 과목 모아보기'도 그 과목 이름으로 (선택 시트와 같게) · 집중 연습은 연습한 개념 이름으로(entryTitle)
  const soloAll = isAll && RT.reviewSubject === 'ALL' && subjects.length === 1;
  const view = isAll
    ? (RT.reviewSubject === 'ALL' && !soloAll
      ? { ic: '📚', t: '모든 과목 모아보기', d: `진단 ${entries.length}개의 복습을 한 덱에서` }
      : { ic: BANK_EMOJI[h.bankId] || '📘', t: `${esc(soloAll ? subjects[0].subject : RT.reviewSubject)} 모아보기`, d: `이 과목 진단 ${entries.length}개의 복습을 한 덱에서` })
    : (h.kind || 'main') === 'practice'
      ? { ic: BANK_EMOJI[h.bankId] || '📘', t: esc(entryTitle(h)), d: `${esc(h.subject)} · ${practiceTag(h)} · ${relDay(h.date)} 하나만 보는 중` }
      : { ic: BANK_EMOJI[h.bankId] || '📘', t: esc(h.topic), d: `${esc(h.subject)} · ${relDay(h.date)} 진단 하나만 보는 중` };
  $('#view-review').innerHTML = `
  <div class="max-w-2xl mx-auto px-4 pt-2 pb-28 md:pb-12 space-y-3 anim-in">
    <!-- [index5] 헤더 압축: 제목 줄 · 지금 보는 복습 · 과목 칩을 space-y-2 한 묶음으로 (바깥 space-y-4는 묶음 아래부터 그대로) — 카드가 화면 위쪽에 더 많이 보여요
         · 바깥 pt-3 → pt-2 · 제목 24 → 22px · 보기 방식 버튼 h-11 → h-10(묶음 p-1 → p-0.5)
         · 지금 보는 복습 버튼: px-4 py-3 → px-3 py-2 · 아이콘 상자 w-10 → w-8 · 글자 11 / 15 / 12px + 줄 높이 고정(leading-4 · 5) · 화살표 w-9 → w-7
         · 과목 칩 h-10 → h-9 · 글자 14 → 13px -->
    <div class="space-y-2">
    <div class="px-1 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <h1 class="text-[22px] font-extrabold tracking-tight">복습 덱</h1>
      </div>
      ${all.length ? `
      <!-- [index5] 보기 방식 전환: 아이콘만 있던 작은 버튼을 '아이콘 + 글자' 큰 버튼으로 (높이 44px · 켜진 쪽은 메인 색 채움)
           aria-label = 스크린 리더 이름 · aria-pressed = 지금 켜진 보기 · data-hint 툴팁은 아래쪽(hint-below)으로 띄워 헤더에 가리지 않게 -->
      <div class="shrink-0 flex gap-1 p-0.5 rounded-2xl bg-surface shadow-card ring-1 ring-ink-200" role="group" aria-label="보기 방식">
        ${[['card', 'fa-regular fa-clone', '카드', '카드로 보기', '한 장씩 뒤집으며 보기'], ['list', 'fa-solid fa-list', '목록', '목록으로 보기', '한눈에 펼쳐 보기']].map(([k, ic, label, aria, hint], i) => `
        <button type="button" class="hint hint-below ${i ? 'hint-end' : ''} h-10 px-3.5 rounded-xl flex items-center gap-2 text-sm font-extrabold transition ${mode === k ? 'bg-solid-brand text-white shadow-sm' : 'text-ink-600 hover:bg-ink-100'}" data-action="review-mode" data-k="${k}" aria-pressed="${mode === k}" aria-label="${aria}" data-hint="${hint}"><i class="${ic} text-base" aria-hidden="true"></i>${label}</button>`).join('')}
      </div>` : ''}
    </div>
    <!-- [index5] 지금 보는 복습: 작은 회색 글씨 대신 큰 선택 버튼 (누르면 과목별로 묶인 선택 시트) -->
    <button type="button" class="w-full flex items-center gap-2.5 rounded-2xl bg-surface shadow-card ring-1 ring-ink-200 hover:ring-brand-300 px-3 py-2 text-left transition" data-action="pick-review-session" aria-label="지금 보는 복습: ${view.t}. 눌러서 다른 복습 고르기">
      <span class="w-8 h-8 shrink-0 rounded-lg bg-brand-50 grid place-items-center text-base" aria-hidden="true">${view.ic}</span>
      <span class="min-w-0 flex-1">
        <span class="block text-[11px] leading-4 font-bold text-brand-700">지금 보는 복습 · 눌러서 바꾸기</span>
        <span class="block text-[15px] leading-5 font-extrabold text-ink-900 truncate">${view.t}</span>
        <span class="block text-xs leading-4 font-medium text-ink-600 truncate">${view.d}</span>
      </span>
      <span class="shrink-0 w-7 h-7 rounded-full bg-ink-100 text-ink-700 grid place-items-center" aria-hidden="true"><i class="fa-solid fa-chevron-down text-[10px]"></i></span>
    </button>
    ${subjects.length > 1 ? `
    <!-- [index5] 과목별 분류: 누르면 모든 진단에서 그 과목 문항만 모아 한 덱으로 (RT.reviewScope = 'all' + RT.reviewSubject) -->
    <div class="-mx-4 px-4 py-0.5 -my-0.5 flex items-center gap-1.5 overflow-x-auto no-scrollbar" role="group" aria-label="과목별로 모아 보기">
      <span class="shrink-0 text-xs font-extrabold text-ink-700 mr-0.5">과목별</span>
      ${[{ subject: 'ALL', n: subjects.reduce((n, x) => n + x.n, 0) }, ...subjects].map((x) => `<button type="button" data-action="review-subject" data-k="${esc(x.subject)}" aria-pressed="${subjectOn(x.subject)}" class="shrink-0 h-9 px-3 rounded-full text-[13px] font-bold transition ${subjectOn(x.subject) ? 'bg-solid-brand text-white' : subjectSoft(x.subject) ? 'bg-brand-50 text-brand-700 ring-2 ring-brand-300' : 'bg-surface text-ink-800 ring-1 ring-ink-200 hover:ring-brand-300'}">${x.subject === 'ALL' ? '📚 전체 과목' : `${BANK_EMOJI[x.bankId] || '📘'} ${esc(x.subject)}`} <span class="tnum ${subjectOn(x.subject) ? 'text-white/80' : 'text-ink-500'}">${x.n}</span></button>`).join('')}
    </div>` : !isAll && multi ? '<div class="px-1"><button type="button" class="btn btn-sm btn-secondary" data-action="open-review-all"><i class="fa-solid fa-layer-group text-xs" aria-hidden="true"></i>모든 진단의 복습 모아보기</button></div>' : ''}
    </div>
    <!-- [index5] 진행률 카드 압축: p-5 → p-4 · 막대 h-2.5 → h-2 · '권장 복습' 칩을 제목 줄로 · 규칙 설명(두 줄)은 처음 한 번만 (뒤집거나 목록으로 바꾸면 '봤다'고 기억) — 375×812에서 150px → 약 70px, 첫 카드가 그만큼 위로 올라와요 -->
    <section class="card p-4" aria-label="복습 진행률">
      <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-sm font-bold"><span>복습 진행률</span>${!allDone && all.length ? `<span class="chip ${due <= Date.now() ? 'bg-illusion-50 text-illusion-700' : 'bg-ink-100 text-ink-600'}"><i class="fa-regular fa-clock"></i>권장 복습 ${fmtDue(due)}</span>${stage ? `<span class="chip bg-mastery-50 text-mastery-700">복습 ${stage}회차</span>` : ''}` : ''}<span class="ml-auto tnum ${allDone ? 'text-mastery-700' : 'text-brand-600'}">${done} / ${all.length} 해소</span></div>
      <div class="mt-2 h-2 rounded-full bg-ink-100 overflow-hidden"><div class="h-full rounded-full ${allDone || !all.length ? 'bg-mastery-500' : 'bg-brand-500'} transition-all" style="width:${all.length ? pct(done / all.length) : 100}%"></div></div>
      ${!all.length || allDone || !S.prefs.reviewIntroSeen ? `<p class="mt-2 text-xs text-ink-500 break-keep">${!all.length ? '복습할 문항이 없어요. 모두 확실한 내 지식이에요!' : allDone ? '모든 취약 문항을 해소했어요 🎉' : counts.ILLUSION ? '🚨 착각 문항이 가장 앞에 있어요. 착각은 ‘이해 완료’가 아니라 유사 문제를 😎 100% 확신으로 맞혀야 해소돼요.' : '급한 카드부터 놓여 있어요. 정답과 해설을 본 뒤 [유사 문제]로 확인하거나, 이해했으면 [이해 완료]를 눌러 해소해요.'}</p>` : ''}
    </section>
    ${all.length ? `
    ${showFilters ? `<div class="flex gap-1.5 overflow-x-auto no-scrollbar" role="group" aria-label="유형 필터">${filters.map(([k, v]) => `<button type="button" data-action="review-filter" data-k="${k}" aria-pressed="${RT.reviewFilter === k}" class="shrink-0 h-10 px-3.5 rounded-full text-[13px] font-bold transition ${RT.reviewFilter === k ? 'bg-ink-900 text-ink-50' : 'bg-surface text-ink-600 hover:bg-ink-50'}">${v} ${counts[k]}</button>`).join('')}</div>` : ''}
    ${items.length ? (mode === 'card' ? flashcardHTML(items) : reviewListHTML(items)) : '<p class="card p-8 text-center text-sm text-ink-500">이 유형의 카드가 없어요</p>'}` : ''}
    <!-- [index5] 맨 아래 [홈으로]와 [진단별로 보기]는 뺐어요 — 홈은 하단 탭 · 상단 메뉴에, 진단별로 보기는 위쪽 '지금 보는 복습' 버튼과 같은 시트예요
         진단 하나를 볼 때의 [결과 리포트]만 다른 길이 없어서 남겨요 -->
    ${isAll ? '' : `<div class="pt-2"><button type="button" class="btn btn-lg btn-surface w-full" data-action="open-result" data-id="${h.id}">결과 리포트</button></div>`}
  </div>`;
  // 지표: 이 진단의 복습 덱을 처음 연 시각 (착각 발견 → 복습 진입률)
  entries.forEach((x) => { if (!x.reviewOpenedAt) { x.reviewOpenedAt = new Date().toISOString(); saveSoon(); } });
}

function cardFrontHTML(i, q, r) {
  const h = i.h, m = STATUS[i.status], t = TONE[m.tone];
  return `
    <div class="flex flex-wrap items-center gap-1.5">
      ${r.pinned && !r.done ? `<span class="chip bg-solid-danger text-white">📌 1순위 · ${m.emoji} ${m.short}</span>` : `<span class="chip ${t.chip}">${m.emoji} ${m.short}</span>`}${levelChip(i.lv)}
      ${r.done ? '<span class="chip bg-solid-mastery text-white ml-auto"><i class="fa-solid fa-check"></i>해소</span>' : ''}
    </div>
    <p class="mt-2 text-xs font-bold text-ink-500">${RT.reviewScope === 'all' ? `${esc(h.topic)} · ` : ''}${esc(conceptOf(h.bankId, i.cid).name)}</p>
    <h2 class="mt-2 text-[16px] font-bold leading-relaxed break-keep">${esc(q.q)}</h2>
    ${i.correct
      ? `<div class="mt-4 rounded-2xl bg-ink-50 p-3.5"><p class="text-xs font-bold text-ink-500">맞혔지만 ${CONF[i.conf].emoji} ${CONF[i.conf].pct} 확신(${CONF[i.conf].word})으로 풀었어요</p></div>`
      : `<div class="mt-4 rounded-2xl bg-ink-50 p-3.5"><p class="text-xs font-bold text-illusion-600">내가 고른 답 · ${CONF[i.conf].emoji} ${CONF[i.conf].pct} 확신</p><p class="mt-1 text-sm text-ink-800 break-keep">${esc(q.o[i.chosen])}</p></div>`}
    <div class="mt-2.5 rounded-2xl ${t.soft} p-3.5 text-sm"><p class="text-xs font-bold ${t.text}">원인 분석</p><p class="mt-1 text-ink-800 break-keep">${i.reasons.map(esc).join(' · ')}</p></div>
    ${i.correct ? '' : misconceptionHTML(h.bankId, q, i.chosen)}`;
}
function cardBackHTML(i, q, r) {
  const kind = resolveKind(i);
  return `
    <span class="chip bg-mastery-50 text-mastery-700 self-start"><i class="fa-solid fa-check"></i>정답</span>
    <p class="mt-2 text-[16px] font-bold leading-relaxed break-keep">${esc(q.o[q.a])}</p>
    <div class="mt-4 rounded-2xl bg-ink-50 p-4 text-sm leading-relaxed text-ink-800 break-keep"><p class="text-xs font-bold text-ink-500 mb-1"><i class="fa-regular fa-lightbulb mr-1" aria-hidden="true"></i>해설</p>${esc(q.x)}</div>
    ${r.retry ? `<p class="mt-3 text-xs font-bold ${r.retry.correct ? 'text-mastery-700' : 'text-illusion-600'}"><i class="fa-solid fa-rotate-right mr-1"></i>유사 문제 재도전: ${r.retry.correct ? '정답' : '오답'} · ${CONF[r.retry.conf].emoji} ${CONF[r.retry.conf].pct}${kind === 'illusion' && r.retry.correct && r.retry.conf !== 'HIGH' && !r.done ? ' (100% 확신이어야 해소)' : ''}</p>` : ''}
    <p class="mt-3 rounded-2xl bg-brand-50 p-3.5 text-sm text-ink-700 break-keep"><b class="text-brand-700">복습 팁</b> ${STATUS[i.status].rx}</p>`;
}

function flashcardHTML(items) {
  const idx = RT.reviewIndex, i = items[idx], q = getQ(i.qid), r = i.h.review[i.qid] || {};
  const f = RT.flipped;
  return `
  <p class="px-1 -mb-1 flex items-center justify-between text-xs font-semibold text-ink-500">
    ${S.prefs.reviewIntroSeen ? '<span></span>' : '<span><i class="fa-regular fa-hand-pointer mr-1" aria-hidden="true"></i>카드를 탭하면 뒤집혀요</span>'}
    <span class="text-sm font-extrabold text-ink-700 tnum" aria-live="polite">${idx + 1} / ${items.length}</span>
  </p>
  <div id="flashcard" class="flip ${f ? 'is-flipped' : ''}" data-swipe data-tapflip>
    <div class="flip-inner">
      <article class="flip-face card p-5 sm:p-6 min-h-[330px] sm:min-h-[380px] flex flex-col cursor-pointer" ${f ? 'aria-hidden="true" inert' : ''}>

        <div class="grow min-h-[16px]"></div>

      </article>
