<script>
  // 모든 색은 CSS 변수(RGB)로 두고, 라이트 · 다크 테마에서는 변수 값만 바꿉니다
  const tok = (n) => `rgb(var(--${n}) / <alpha-value>)`;
  const scale = (name, steps) => Object.fromEntries(steps.map((s) => [s, tok(`${name}-${s}`)]));
  const ALL = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900];
  const STATUS_STEPS = [50, 100, 200, 500, 600, 700];
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', '"Apple SD Gothic Neo"', '"Noto Sans KR"', 'sans-serif'],
        },
        colors: {
          canvas: tok('canvas'), surface: tok('surface'),
          brand: scale('brand', ALL), ink: scale('ink', ALL),
          // 진단 4사분면 전용 색 (착각 · 불안정 · 노베이스 · 완벽) — 차트 색각 검증 통과 값
          illusion: scale('illusion', STATUS_STEPS), unstable: scale('unstable', STATUS_STEPS),
          deficit: scale('deficit', STATUS_STEPS), mastery: scale('mastery', STATUS_STEPS),
        },
        boxShadow: {
          card: 'var(--shadow-card)',
          float: 'var(--shadow-float)',
        },
      },
    },
  };
</script>

       @property로 등록한 --lp(각도)를 0deg → 360deg로 .6s 동안 transition하면 색이 칠해진 호가 테두리를 따라 한 바퀴 돌아요

     ▸ 링은 mask로 '가운데를 도려낸 4px 두께 테두리'만 남겨요 (padding-box를 빼는 mask-composite) → 손가락이 닿는 안쪽 면은 건드리지 않아요

  #view-quiz [data-action="option"] {

  #view-quiz [data-action="option"]::after {

    background: conic-gradient(from 0deg, rgb(var(--brand-500)) var(--lp), rgb(var(--brand-500) / .16) 0);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0; transition: opacity .18s ease-out, --lp 0s linear .18s;
  }
  #view-quiz [data-action="option"].is-pressing::after { opacity: 1; --lp: 360deg; transition: --lp .6s linear; }
  /* @property를 모르는 브라우저(구형 Firefox 등): 각도 전환이 안 되므로 링 전체가 .6초 동안 서서히 진해지는 방식으로 대신해요 */

  /* ---------- [index4] 배경 장식 ----------

   *  ① 위쪽 가운데에서 가장자리로 갈수록 사라지는 아주 옅은 그리드 (테마의 ink 색 · 4~6% 불투명)

  #bg-deco .b1 { width: 64vmax; height: 64vmax; left: -22vmax; top: -30vmax; background: radial-gradient(circle, rgb(var(--brand-300) / .6) 0%, rgb(var(--brand-300) / 0) 64%); }
  #bg-deco .b2 { width: 56vmax; height: 56vmax; right: -24vmax; top: 14vh; background: radial-gradient(circle, rgb(var(--deficit-200) / .55) 0%, rgb(var(--deficit-200) / 0) 64%); animation-duration: 48s; animation-delay: -14s; }
  #bg-deco .b3 { width: 50vmax; height: 50vmax; left: 8vw; bottom: -30vmax; background: radial-gradient(circle, rgb(var(--mastery-200) / .5) 0%, rgb(var(--mastery-200) / 0) 64%); animation-duration: 56s; animation-delay: -28s; }
  @keyframes bgDrift {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(4vmax, 3vmax, 0) scale(1.06); }
    100% { transform: translate3d(-3vmax, 5vmax, 0) scale(.95); }

  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #bg-deco { --blob-a: .7; --grid-a: .05; } }
  :root[data-theme="dark"] #bg-deco { --blob-a: .7; --grid-a: .05; }
  /* 문제 풀이 중에는 배경을 더 옅게 · 멈춰서 지문에 집중 */

     ② transition: height — 줄이 늘고 줄 때 부드럽게 (auto ↔ px는 전환이 안 되므로 항상 px → px로만 바꿔요 · 움직임 줄이기면 전역 규칙이 즉시로) */

<script>
'use strict';
/* =====================================================================
 * [index5] index4에서 바뀐 곳 — 기존 화면 · 데이터 구조 · 2×2 판정 · 탭 · 색은 그대로 두고 더하기만 했어요
 *  ① 회원가입 시트: 직업군 칩 2개(대학생(전공/교양) · 자격증/공시생) → S.user.persona  (openAuthSheet · handleAuth · 'pick-persona')
 *  ② 세부 요구사항(입력창 + 빠른 입력 칩)을 홈 '단원' 칸 바로 아래로 꺼냈어요 (promptFieldHTML · 키워드 · PDF 탭 공통)
 *     바인딩: <textarea data-bind="customPrompt"> → 공통 input 핸들러 → S.setup.customPrompt → syncQuickChips()가 칩 · 글자 수 갱신
 *     '학습 목적' 칩은 세부 요구사항과 겹쳐 없앴고, 진단 설정 시트(SH-02)는 진단 방식 · 문항 수만 다뤄요
 *     persona · customPrompt는 진단 시작 때 ① Api.extractConcepts 페이로드로 함께 보내요 (prepareDiagnosis)
 *  ③ 홈 진단 설정 박스: data-tip 툴팁 + aria-label · aria-describedby (자리는 ⑬)
 *  ④ 결과: 두 지표의 뜻 + 메타인지 오해 방지 문구 + 두 점수 바로 아래 '🎯 다음 진단 목표'(goalBlockHTML · 목표 지도 goalPlotSVG)
 *     요약 탭 '🎯 지금 해야 할 것'(todoHTML)
 *  바인딩 원리: 입력창은 기존처럼 data-bind="키" → 공통 input 핸들러가 S.setup[키]에 저장,
 *              칩은 data-action → ACTIONS가 값을 바꾸고 클래스 · aria-pressed만 갱신(다시 그리지 않음) → saveSoon()으로 localStorage 저장
 *
 *  ⑤ 내 서재 (S.library) — 하단 탭 · 상단 메뉴의 독립 메인 화면(view-library): 홈 / 내 서재 / 기록 / 복습
 *     계층: S.library = [ 과목 { id, name, createdAt, units: [ 단원 { id, name, uses, lastUsedAt } ] } ] (localStorage에 함께 저장)
 *     화면: renderLibrary() — 과목명 옆 드롭다운 화살표(▾, 'lib-toggle')를 누르면 단원이 펼쳐지는 아코디언
 *           펼친 과목은 RT.libOpen(Set)에 기억 · 버튼에 aria-expanded / aria-controls
 *     C  홈 키워드 · PDF 폼으로 진단을 시작하면 → 결과까지 봤을 때(finishSession) 자동으로 libAdd() (체크박스 없음 · 새 단원이면 토스트)
 *          준비만 하고 나가거나 [진단 삭제]한 단원은 저장하지 않아요 (prepareDiagnosis는 sess.libPending에 적어 두기만)
 *          키워드 = 입력한 과목 · 단원 / PDF = AI가 분류한 과목 + 단원 · 챕터(없으면 파일 이름)
 *        서재 화면의 추가 폼(#lib-add-form) · 과목별 [+ 단원] → libAdd()          ※ 같은 이름(대소문자 · 공백 무시)은 합쳐요
 *        서재 헤더 '내 서재' 옆 [+ 추가] 퀵 버튼 → libFocusAdd(): 맨 아래 추가 폼으로 부드럽게 스크롤 → 과목 입력창 포커스
 *     R  단원 줄의 [▶ 진단] → 'lib-start' → libStartUnit(): 단원에 저장한 출제 방법으로 바로 startDiagnosis({ fresh: true, plan }) → SCR-03 문항 준비
 *        (출제 방법은 단원 줄에 보이고 [수정]에서 바꿔요 · 준비 화면에 '어떤 출제 방법으로 내는지 · 어디서 바꾸는지' 한 줄)
 *     U  과목 [수정] → RT.libEdit = { kind, sid }로 그 줄만 입력칸으로 다시 그림 → Enter 저장(#lib-edit-form) · Esc 취소
 *        단원 [수정] → 'lib-unit-edit' → 단원 수정 시트(⑩, origin 'edit'): 단원 이름 + 출제 방법을 한 번에 고쳐요

      { id: 'os-c1-2a', c: 'c1', lv: 2, q: '폭이 좁은 단일 차선 다리 양 끝에서 두 차량이 동시에 진입해 한가운데서 마주쳤습니다. 두 운전자 모두 후진을 거부하고 버티는 중입니다. 이 상황에서 데드락 조건 중 "비선점"에 정확히 대응하는 것은?',
        o: ['다리 폭이 좁아 한 번에 한 대만 지나갈 수 있다', '상대가 먼저 비켜 주기를 기다리며 자기 차로를 계속 차지하고 있다', '견인차나 경찰이 개입해 상대 차를 강제로 치울 수 없다', '두 차량이 서로 상대가 차지한 공간을 요구하며 맞물려 있다'], a: 2,
        x: '비선점은 점유 중인 자원을 외부에서 강제로 빼앗을 수 없는 조건입니다. 한 대만 지나갈 수 있는 다리 폭은 상호 배제, 자기 차로를 쥔 채 기다리는 것은 점유 및 대기, 서로 맞물린 요구는 순환 대기에 해당합니다.' },
      { id: 'os-c1-2b', c: 'c1', lv: 2, q: '수강신청에서 학생 A는 "운영체제" 마지막 한 자리를, 학생 B는 "알고리즘" 마지막 한 자리를 잡았습니다. 둘 다 상대 과목과 맞바꾸고 싶어서 자기 과목은 취소하지 않은 채 상대가 취소하기만 기다립니다. "점유 및 대기"에 해당하는 행동은?',
        o: ['정원이 1명이라 두 사람이 한 자리에 동시에 등록할 수 없다', '자기 과목을 쥔 채로 상대 과목이 비기를 기다린다', '조교가 두 학생의 수강 내역을 강제로 지울 수 없다', '두 학생의 교환 요청이 서로 물려 원형 고리를 이룬다'], a: 1,
        x: '점유 및 대기(Hold and Wait)는 이미 자원을 하나 이상 가진 상태에서, 다른 프로세스가 가진 자원을 추가로 기다리는 것입니다.' },
      { id: 'os-c1-2c', c: 'c1', lv: 2, q: '원형 식탁에 다섯 명이 앉아 각자 왼쪽 젓가락을 먼저 집은 뒤 오른쪽 젓가락을 기다립니다. 모두가 동시에 왼쪽 젓가락을 집는 순간 아무도 식사를 못 합니다. 이 상황에서 "순환 대기"에 해당하는 것은?',
        o: ['젓가락 하나는 한 번에 한 사람만 쓸 수 있다', '각자 왼쪽 젓가락을 쥔 채 오른쪽 젓가락을 기다린다', '옆 사람의 젓가락을 억지로 빼앗을 수 없다', '1번은 2번을, 2번은 3번을 … 5번은 1번을 기다리는 고리가 생겼다'], a: 3,
        x: '순환 대기(Circular Wait)는 대기 관계가 P1→P2→…→Pn→P1처럼 닫힌 고리를 이루는 조건입니다. 식사하는 철학자 문제는 네 조건이 모두 드러나는 대표 사례입니다.' },
      { id: 'os-c1-3a', c: 'c1', lv: 3, q: '송금 서버에서 A→B 이체와 B→A 이체가 동시에 실행됩니다. 각 스레드는 보내는 계좌의 락을 먼저 잡고 받는 계좌의 락을 기다리다가 데드락에 빠졌습니다. "순환 대기"를 원천 차단하는 가장 올바른 설계는?',
        o: ['이체가 실패하면 3초 sleep 후 다시 시도한다', '두 계좌 ID를 비교해 항상 ID가 작은 계좌의 락부터 잡도록 순서를 고정한다', '락 대기 타임아웃을 10초로 늘린다', '모든 이체를 하나의 전역 락으로만 처리한다'], a: 1,
        x: '모든 자원에 전역 순서를 정하고 그 순서대로만 락을 잡으면 대기 고리가 생길 수 없습니다. 재시도와 타임아웃은 증상 완화일 뿐이고, 전역 락은 데드락은 없애지만 동시성을 통째로 포기합니다.' },
      { id: 'os-c1-3b', c: 'c1', lv: 3, q: '프린터와 스캐너를 모두 써야 하는 작업들이 서로 하나씩 쥔 채 데드락에 빠집니다. "점유 및 대기" 조건을 제거하는 설계로 가장 적절한 것은?',
        o: ['작업 시작 시 필요한 자원을 한꺼번에 요청하고, 전부 얻지 못하면 아무것도 쥐지 않고 기다린다', '자원에 번호를 매겨 오름차순으로만 요청하게 한다', '프린터를 스풀링해 여러 작업이 공유하는 것처럼 만든다', '데드락이 생기면 가장 오래 실행된 작업을 종료한다'], a: 0,
        x: '자원을 한 번에 모두 할당받거나 가진 자원을 전부 반납한 뒤 다시 요청하면 점유 및 대기가 사라집니다. 대신 자원 활용률이 떨어지고 기아가 생길 수 있습니다. 번호 순 요청은 순환 대기, 스풀링은 상호 배제 완화, 작업 종료는 사후 복구 기법입니다.' },

      { id: 'os-c2-1a', c: 'c2', lv: 1, q: '은행원 알고리즘에서 시스템이 "안전 상태(Safe State)"라는 것의 정확한 의미는?',
        o: ['할당된 자원이 하나도 없는 초기 상태', '모든 프로세스가 교착 없이 끝날 수 있는 실행 순서(Safe Sequence)가 하나 이상 존재하는 상태', '새 프로세스의 진입이 차단된 상태', 'CPU 사용률이 100%이고 대기 큐가 빈 상태'], a: 1,
        x: '안전 상태란 가용 자원으로 프로세스들을 어떤 순서로든 하나씩 끝내고 자원을 회수해, 결국 모두 완료시킬 수 있는 순서가 최소 하나 존재하는 상태입니다.' },
      { id: 'os-c2-1b', c: 'c2', lv: 1, q: '데드락 "예방(Prevention)"과 "회피(Avoidance)"의 차이로 옳은 것은?',
        o: ['예방은 4대 조건 중 하나를 구조적으로 없애고, 회피는 할당 요청마다 안전 상태가 유지되는지 검사해 불안전하면 할당을 미룬다', '회피는 데드락이 생긴 뒤 프로세스를 종료해 해결한다', '예방은 데드락을 허용하고 주기적으로 탐지한다', '둘은 같은 뜻의 다른 표현이다'], a: 0,
        x: '예방은 조건 자체를 설계로 제거하고, 회피는 조건은 그대로 두되 매 요청마다 "이 할당 후에도 Safe한가"를 계산해 위험한 할당을 피합니다. 은행원 알고리즘이 대표적인 회피 기법입니다.' },
      { id: 'os-c2-2a', c: 'c2', lv: 2, q: '클라우드 GPU 풀에 가용 GPU가 3장 남았습니다. 각 작업이 완료까지 추가로 필요한 GPU는 P1: 2장, P2: 4장, P3: 3장이고, 작업이 끝나면 가진 GPU를 모두 반납합니다. 지금 먼저 요구를 들어줘도 안전한(Safe Sequence의 시작이 될 수 있는) 작업은?',
        o: ['P2 — 가장 많이 필요하니 먼저 해결한다', 'P1 또는 P3 — 남은 3장으로 추가 요구량을 전부 채워 줄 수 있다', '어느 작업도 안전하지 않으니 모두 거절한다', '세 작업에 1장씩 균등하게 나눠 준다'], a: 1,
        x: '가용 자원으로 추가 필요량(Need)을 완전히 채울 수 있는 작업부터 끝내야 자원이 회수되어 다음 작업으로 이어집니다. 균등 분배는 아무도 끝내지 못하는 불안전 상태를 만듭니다.' },
      { id: 'os-c2-2b', c: 'c2', lv: 2, q: '은행 잔고가 50억 원 남았습니다. 대출자 A는 30억, B는 70억, C는 60억을 더 받아야 사업을 끝내고 전액 상환할 수 있습니다. 교착을 피하며 안전 순서를 만들려면 지금 누구에게 먼저 전액을 지원해야 할까요?',
        o: ['추가 자금이 가장 많이 필요한 B', '남은 50억으로 필요액을 모두 채워 줄 수 있는 A', '수익성이 좋아 보이는 C', '세 명에게 균등 분할해 지원'], a: 1,
        x: '은행원 알고리즘의 핵심은 "지금 가진 자원으로 끝까지 채워 줄 수 있는 대상"을 먼저 완료시켜 자원을 돌려받는 것입니다. A가 상환하면 잔고가 늘어 다음 대출자도 지원할 수 있습니다.' },
      { id: 'os-c2-2c', c: 'c2', lv: 2, q: '연회장 예약 시스템이 빈 방이 충분히 남아 있는데도 한 행사의 예약 승인을 보류했습니다. "지금 승인하면 이후 어떤 순서로도 모든 행사가 필요한 방을 다 확보하지 못할 수 있다"는 이유입니다. 이 동작을 가장 정확히 설명한 것은?',
        o: ['이미 교착상태가 발생해 복구 중이다', '할당 후 상태가 불안전(Unsafe)해지므로 데드락 가능성을 미리 피하려고 보류한 것이다 (회피)', '빈 방이 부족해 물리적으로 할당이 불가능하다', '상호 배제를 없애려고 방을 공유시키는 중이다'], a: 1,
        x: '회피 기법은 자원이 남아 있어도 할당 결과가 Unsafe라면 요청을 대기시킵니다. Unsafe가 곧 데드락은 아니지만 데드락으로 갈 수 있는 상태이므로 들어가지 않는 것입니다.' },
      { id: 'os-c2-3a', c: 'c2', lv: 3, q: 'Linux나 Windows 같은 범용 운영체제가 이론적으로 깔끔한 은행원 알고리즘을 실제 스케줄러에 쓰지 않는 결정적인 이유는?',
        o: ['알고리즘의 시간 복잡도가 O(N!)이라 계산이 불가능해서', '프로세스가 앞으로 쓸 최대 자원 요구량을 시작 시점에 미리 알 수 없어서', '멀티코어 환경에서는 상호 배제가 발생하지 않아서', '단일 인스턴스 자원에서는 수학적으로 동작하지 않아서'], a: 1,
        x: '실제 프로그램은 실행 중에 동적으로 메모리 · 파일 · 락을 요청하므로 최대 요구량(Max)을 미리 신고할 수 없습니다. 이 전제가 깨지면 은행원 알고리즘은 쓸 수 없습니다.' },
      { id: 'os-c2-3b', c: 'c2', lv: 3, q: '은행원 알고리즘 기반 배치 스케줄러에서, 일부 작업이 처음 신고한 최대 요구량(Max)을 넘겨 자원을 요청하는 버그가 발견됐습니다. 가장 정확한 분석은?',
        o: ['Safe 판정의 전제(최대 요구량 사전 신고)가 깨졌으므로 Safe로 판정돼도 데드락이 날 수 있다. Max 초과 요청은 오류로 거부해야 한다', '은행원 알고리즘은 가용 자원만 보므로 Max와 무관하다', 'Max를 넘기면 비선점 조건이 사라져 오히려 안전해진다', '가용 자원을 두 배로 늘리면 문제가 원천적으로 사라진다'], a: 0,
        x: '안전성 검사는 "각 작업이 Max 이상은 요구하지 않는다"는 가정 위에서만 성립합니다. 가정이 깨지면 판정 자체를 믿을 수 없으므로, Max 초과 요청은 즉시 거부하는 것이 표준 동작입니다.' },

      { id: 'os-c3-1a', c: 'c3', lv: 1, q: '모든 자원이 인스턴스 1개씩만 있는 시스템에서, 자원 할당 그래프로 교착상태를 판정하는 필요충분조건은?',
        o: ['그래프에 사이클이 존재한다', '모든 자원이 어떤 프로세스에 할당되어 있다', '대기 스레드 수가 CPU 코어 수보다 많다', '프로세스 사이에 부모-자식 관계가 있다'], a: 0,
        x: '자원 유형마다 인스턴스가 하나뿐이면 사이클이 곧 데드락입니다(필요충분조건). 인스턴스가 여러 개면 사이클은 필요조건일 뿐입니다.' },
      { id: 'os-c3-1b', c: 'c3', lv: 1, q: '자원 유형마다 인스턴스가 여러 개인 시스템에서 자원 할당 그래프에 사이클이 있다면, 이것이 의미하는 것은?',
        o: ['반드시 데드락이다', '데드락일 가능성이 있을 뿐, 반드시 데드락인 것은 아니다', '절대 데드락이 아니다', '기아가 발생했다'], a: 1,
        x: '다중 인스턴스에서는 사이클 밖의 프로세스가 자원을 반납해 사이클이 풀릴 수 있습니다. 그래서 사이클은 필요조건일 뿐이며, 탐지 알고리즘으로 추가 확인해야 합니다.' },
      { id: 'os-c3-2a', c: 'c3', lv: 2, q: '대규모 RDBMS가 두 트랜잭션 사이의 교착을 감지해 하나를 강제로 롤백하려 합니다. 시스템 전체의 낭비를 최소화하려면 어떤 트랜잭션을 희생자(Victim)로 골라야 할까요?',
        o: ['30분째 수백만 건을 갱신해 롤백 비용이 가장 큰 트랜잭션', '방금 시작해 잠근 행이 적고 롤백 비용이 가장 싼 트랜잭션', '이미 10번 연속 롤백된 트랜잭션', '관리자 권한으로 실행 중인 트랜잭션'], a: 1,
        x: '희생자 선택의 기본 원칙은 롤백 · 재작업 비용 최소화입니다. 지금까지 쓴 자원이 적고 되돌리기 쉬운 작업을 먼저 고릅니다.' },
      { id: 'os-c3-2b', c: 'c3', lv: 2, q: '마이크로서비스 환경에서 분산 트랜잭션 교착이 발생해 인스턴스 하나를 강제로 재시작하려 합니다. "재작업 비용 최소화" 원칙에 따라 가장 먼저 재시작을 고려할 대상은?',
        o: ['결제의 99%를 이미 처리한 결제 게이트웨이', '방금 큐에서 작업을 꺼냈을 뿐 아직 DB를 바꾸지 않은 알림 발송 워커', '스키마 마이그레이션을 전담하는 마스터 노드', '지난 1시간 동안 CPU를 가장 많이 쓴 분석 서비스'], a: 1,
        x: '되돌릴 작업이 가장 적은 가벼운 작업을 희생자로 삼아야 전체 손실이 최소화됩니다.' },

      { id: 'db-c1-2a', c: 'c1', lv: 2, q: '쇼핑몰 주문 트랜잭션이 같은 상품의 재고를 두 번 조회했는데, 그 사이 다른 트랜잭션이 재고를 수정 · 커밋해 처음엔 10개, 두 번째엔 7개로 보였습니다. 이 현상과, SQL 표준에서 이를 막는 최소 격리수준은?',

      { id: 'db-c1-2b', c: 'c1', lv: 2, q: '정산 배치가 한 트랜잭션 안에서 "오늘 주문 건수"를 두 번 집계했는데, 그 사이 새 주문이 INSERT · 커밋되어 두 번째 집계에 행이 하나 더 나타났습니다. 이 현상은?',

      { id: 'db-c1-3a', c: 'c1', lv: 3, q: 'SQL 표준의 REPEATABLE READ는 Phantom Read를 허용하지만, MySQL InnoDB의 기본 REPEATABLE READ에서는 일반 SELECT를 다시 해도 팬텀이 거의 보이지 않습니다. 가장 정확한 이유는?',
        o: ['InnoDB는 사실 SERIALIZABLE로 동작하기 때문', '일반 SELECT는 첫 읽기 시점의 MVCC 스냅샷을 계속 읽고, 잠금 읽기에는 넥스트 키 락(갭 락)을 쓰기 때문', 'INSERT가 트랜잭션 끝까지 테이블 전체 락을 잡기 때문', '팬텀은 인덱스가 없는 테이블에서만 생기기 때문'], a: 1,

      { id: 'db-c2-1a', c: 'c2', lv: 1, q: 'MVCC(다중 버전 동시성 제어)의 핵심 아이디어로 옳은 것은?',
        o: ['읽기와 쓰기가 같은 락을 공유해 순서대로 처리한다', '데이터를 바꿀 때 이전 버전을 남겨, 읽는 쪽이 잠금 없이 자기 시점에 맞는 버전을 읽게 한다', '모든 트랜잭션을 하나의 큐에 넣어 직렬로 실행한다', '커밋 전 데이터는 디스크에 쓰지 않는다'], a: 1,
        x: 'MVCC는 여러 버전을 유지해 "읽기는 쓰기를 막지 않고, 쓰기는 읽기를 막지 않게" 합니다. 각 트랜잭션은 자기 스냅샷 시점에 보이는 버전을 읽습니다.' },
      { id: 'db-c2-2a', c: 'c2', lv: 2, q: 'MVCC 기반 DB에서 REPEATABLE READ로 긴 보고서 조회가 도는 동안, 다른 사용자가 같은 행을 수정하고 커밋했습니다. 보고서 트랜잭션이 그 행을 다시 읽으면 어떻게 될까요?',
        o: ['새 값이 보이고, 수정한 사용자는 보고서가 끝날 때까지 기다렸다', '보고서는 자기 스냅샷 시점의 이전 값을 보고, 수정한 사용자는 기다림 없이 커밋했다', '에러가 나고 보고서 트랜잭션이 롤백된다', '두 값이 번갈아 보인다'], a: 1,

      { id: 'db-c2-2b', c: 'c2', lv: 2, q: 'PostgreSQL의 READ COMMITTED에서 한 트랜잭션이 SELECT를 두 번 실행합니다. 그 사이 다른 트랜잭션이 해당 행을 수정 · 커밋했다면 두 번째 SELECT는?',

      { id: 'db-c2-3a', c: 'c2', lv: 3, q: 'MVCC 기반 DB에서 몇 시간째 "idle in transaction" 상태로 열린 세션이 발견됐고, 테이블 크기가 계속 커지며 조회가 느려지고 있습니다. 가장 정확한 원인 분석은?',

      { id: 'db-c3-2a', c: 'c3', lv: 2, q: '"좋아요" 기능을 SELECT로 현재 값을 읽고 → 앱에서 +1 → UPDATE로 계산값을 저장하도록 만들었더니, 100명이 동시에 눌러도 가끔 97로 집계됩니다. 가장 간단하고 올바른 수정은?',

      { id: 'db-c3-2b', c: 'c3', lv: 2, q: '위키 편집 서비스에서 두 사람이 같은 문서를 열어 고친 뒤 저장하면, 나중에 저장한 사람이 앞사람의 변경을 조용히 덮어씁니다. 동시 편집 충돌이 드문 환경에서 가장 적합한 방지 전략은?',

        x: '충돌이 드물면 미리 잠그는 비관적 잠금보다, 저장 시점에 버전을 비교하는 낙관적 잠금이 처리량과 사용성 모두에서 유리합니다.' },
      { id: 'db-c3-3a', c: 'c3', lv: 3, q: '재고 차감에 SELECT … FOR UPDATE를 도입한 뒤, 주문 A는 상품1→상품2 순서로, 주문 B는 상품2→상품1 순서로 행을 잠그면서 간헐적으로 데드락 에러가 납니다. 근본적인 해결책은?',

        x: '명시적 비용(등록금 1,500만 원)과 암묵적 비용(포기한 연봉 4,000만 원)을 더한 5,500만 원입니다. 생활비는 어떤 선택이든 들기 때문에 기회비용에 넣지 않습니다.' },
      { id: 'ec-c1-2b', c: 'c1', lv: 2, q: '무료 콘서트 티켓이 생겼습니다. 같은 시간에 시급 1만 5천 원 아르바이트를 3시간 할 수 있었고, 다른 대안은 없습니다. 콘서트 관람의 기회비용은?',
        o: ['0원 — 티켓이 무료이므로', '4만 5천 원 — 포기한 아르바이트 소득', '1만 5천 원 — 1시간분 시급', '티켓 정가만큼'], a: 1,
        x: '돈을 내지 않아도 시간을 쓰는 순간, 그 시간으로 할 수 있었던 최선의 대안(아르바이트 3시간 = 4만 5천 원)을 포기한 것입니다.' },
      { id: 'ec-c1-3a', c: 'c1', lv: 3, q: '카페 사장이 자기 소유 건물 1층에서 영업하며 "임대료가 안 나가니 월 이익이 300만 원"이라고 계산합니다. 그 공간을 세놓으면 월 250만 원을 받을 수 있고, 사장이 다른 곳에 취업하면 월 280만 원을 벌 수 있습니다. 경제적 이윤 관점의 올바른 판단은?',
        o: ['회계상 이익이 300만 원이니 계속 영업이 최선이다', '포기한 임대료 250만 원과 급여 280만 원, 합계 530만 원이 암묵적 비용이므로 경제적 이윤은 −230만 원이다', '임대료 250만 원만 비용이므로 경제적 이윤은 50만 원이다', '급여 280만 원만 비용이므로 경제적 이윤은 20만 원이다'], a: 1,
        x: '공간과 노동은 서로 다른 자원이라 둘 다 동시에 다른 용도로 쓸 수 있었습니다. 두 암묵적 비용을 모두 빼면 경제적 이윤은 300 − 530 = −230만 원으로, 세를 놓고 취업하는 편이 낫습니다.' },

      { id: 'ec-c2-1a', c: 'c2', lv: 1, q: '매몰비용(Sunk Cost)에 대한 설명으로 옳은 것은?',
        o: ['앞으로 지출할 예정인 비용', '이미 지출해 어떤 선택을 해도 회수할 수 없는 비용으로, 합리적 의사결정에서 고려하지 않아야 한다', '기회비용과 같은 개념', '선택에 따라 달라지는 비용'], a: 1,
        x: '매몰비용은 어떤 대안을 골라도 똑같이 돌아오지 않으므로 대안 간 비교에 아무 차이를 만들지 않습니다. 그래서 판단에서 빼야 합니다.' },
      { id: 'ec-c2-2a', c: 'c2', lv: 2, q: '환불이 안 되는 영화표(1만 5천 원)로 영화를 보다가 30분 만에 너무 지루해졌습니다. 남은 1시간 반 동안 나가서 공부하면 훨씬 만족스러울 것 같습니다. 합리적인 판단은?',
        o: ['낸 돈이 아까우니 끝까지 본다', '1만 5천 원은 어떤 선택을 해도 돌아오지 않으니 무시하고, 남은 시간의 가치만 비교해 나간다', '절반만 보고 나가면 7,500원을 아낀 셈이다', '다음에 같은 영화를 한 번 더 본다'], a: 1,
        x: '표값은 이미 매몰되었습니다. 앞으로의 1시간 반을 영화에 쓸지 공부에 쓸지, 미래의 편익만 비교하는 것이 합리적입니다.' },
      { id: 'ec-c2-2b', c: 'c2', lv: 2, q: '회사가 신제품 개발에 이미 30억 원을 썼습니다. 완성하려면 10억 원이 더 필요한데, 경쟁사가 더 좋은 제품을 내놓아 완성 시 예상 매출은 8억 원에 그칩니다. 합리적인 결정은?',
        o: ['30억 원을 날릴 수 없으니 반드시 완성한다', '추가 10억 원을 들여 8억 원을 버는 것은 손해이므로 중단한다', '총 40억 원 대비 8억 원이라 판단할 수 없다', '30억 원을 회수할 때까지 계속 투자한다'], a: 1,
        x: '30억 원은 매몰비용입니다. 판단 기준은 "앞으로 들어갈 10억 원 vs 앞으로 얻을 8억 원"이며, 2억 원 손실이므로 중단이 합리적입니다.' },
      { id: 'ec-c2-3a', c: 'c2', lv: 3, q: '매몰비용 오류("콩코드 오류")를 줄이기 위한 조직 차원의 장치로 가장 효과적인 것은?',
        o: ['프로젝트 시작 전에 중단 기준(kill criteria)과 단계별 검토 시점을 정해 두고, 검토 때는 "지금부터 들 비용 대비 기대 편익"만으로 판단한다', '이미 투자한 금액이 클수록 우선순위를 높인다', '프로젝트를 시작한 담당자에게만 중단 권한을 준다', '누적 투자 규모를 비공개로 한다'], a: 0,

      { id: 'ec-c3-1a', c: 'c3', lv: 1, q: '한계적 사고에 따른 합리적 선택 원칙은?',

        x: '합리적 선택은 "한 단위 더"를 할 때 얻는 것(한계편익)과 잃는 것(한계비용)을 비교합니다. 한계편익이 한계비용 이상인 동안만 늘립니다.' },
      { id: 'ec-c3-2a', c: 'c3', lv: 2, q: '시험 전날 공부 시간을 정하려 합니다. 3시간째 공부로 오르는 점수는 5점, 4시간째는 2점입니다. 1시간 더 공부할 때마다 수면 부족으로 다음 날 약 3점씩 손해를 봅니다. 1~2시간째의 한계편익은 3점보다 크다고 할 때, 합리적인 공부 시간은?',
        o: ['2시간', '3시간', '4시간', '가능한 한 오래'], a: 1,
        x: '3시간째는 한계편익 5점이 한계비용 3점보다 크므로 공부하고, 4시간째는 2점이 3점보다 작으므로 멈춥니다. 따라서 3시간이 최적입니다.' },
      { id: 'ec-c3-2b', c: 'c3', lv: 2, q: '이륙 직전 항공기에 빈 좌석이 20석 있습니다. 승객 1명을 더 태우는 추가 비용(기내식 · 연료 등)은 2만 원이고, 좌석당 평균 비용은 15만 원입니다. 대기 승객이 5만 원에 타겠다고 할 때 합리적인 판단은?',
        o: ['평균 비용 15만 원보다 낮으니 거절한다', '한계비용 2만 원보다 높으니 태운다 (추가 이윤 3만 원)', '정가가 아니니 무조건 거절한다', '평균 비용인 15만 원을 요구한다'], a: 1,
        x: '이미 운항이 확정된 상황에서 평균 비용은 판단 기준이 아닙니다. 한 명을 더 태울 때의 한계수입(5만 원)이 한계비용(2만 원)보다 크면 태우는 것이 이득입니다.' },
      { id: 'ec-c3-3a', c: 'c3', lv: 3, q: '뷔페에서 "이미 3만 원을 냈으니 최대한 먹어야 이득"이라며 배가 불러도 계속 먹는 손님이 있습니다. 한계적 사고와 매몰비용 관점에서 올바른 분석은?',
        o: ['추가 음식은 공짜이므로 한계편익이 음수가 되어도 계속 먹는 것이 합리적이다', '입장료는 매몰비용이라 판단에서 빼야 한다. 한 접시 더의 한계비용은 0원이지만, 한계편익이 0 이하(불편 · 과식)가 되는 순간 멈춰야 한다', '3만 원어치를 먹기 전까지는 손해이므로 계속 먹어야 한다', '평균 편익이 최대가 되는 지점까지 먹어야 한다'], a: 1,
        x: '입장료는 이미 냈고 돌아오지 않는 매몰비용입니다. 추가 한 접시의 한계비용이 0이라도, 한계편익이 음수가 되면 먹을수록 손해입니다.' },
    ],

      { id: 'ps-c2-1a', c: 'c2', lv: 1, q: '앵커링 효과(Anchoring Effect)에 대한 설명으로 옳은 것은?',
        o: ['처음 제시된 정보(기준점)가 이후의 추정과 판단에 과도한 영향을 주는 현상', '최근에 떠오르는 사례로 확률을 판단하는 현상', '같은 크기의 손실을 이득보다 크게 느끼는 현상', '믿음을 지지하는 정보만 찾는 현상'], a: 0,

      { id: 'ps-c2-2a', c: 'c2', lv: 2, q: '중고거래 판매자가 "원래 100만 원짜리"라고 먼저 말한 뒤 60만 원에 내놓았습니다. 비슷한 상품의 실제 시세는 40만 원입니다. 구매자가 60만 원을 "싸다"고 느끼는 이유와 올바른 대응은?',
        o: ['시세 정보가 틀렸을 테니 바로 산다', '100만 원이 기준점이 되어 60만 원이 싸 보이는 것이므로, 제시가와 상관없이 시세 같은 독립적 기준으로 먼저 가치를 정한다', '판매자가 정직해 보이니 믿는다', '반값으로 깎으면 항상 이득이다'], a: 1,

    // [index5] 교재 PDF 여러 개: 예전 한 개짜리 값(pdfName · pdfSize '1.2MB')을 목록 첫 항목으로 옮겨요
    out.setup.pdfs = Array.isArray(out.setup.pdfs) ? out.setup.pdfs.filter((x) => x && x.name).slice(0, PDF_MAX_FILES) : [];
    if (!out.setup.pdfs.length && out.setup.pdfName) out.setup.pdfs = [{ id: 'pf-legacy', name: out.setup.pdfName, bytes: Math.round((parseFloat(out.setup.pdfSize) || 0) * 1048576) }];
    delete out.setup.pdfName; delete out.setup.pdfSize;
    // 이전 버전에서 이어받을 때: 효과음은 사용자가 고른 값이 아니라 옛 기본값(켜짐)이었으므로 새 기본값(꺼짐)으로
    if (!cur) out.prefs.sound = false;
    return out;
  } catch (e) {
    return freshState();
  }
}

/* ---------- 간격 반복 복습 일정 ----------
 *  - 기준 시각: 마지막 복습(lastReviewAt) — 복습하면 망각 곡선이 처음부터 다시 시작돼요
 *  - 회차(stage): 권장 시점에 맞춰 복습할 때마다 1 · 3 · 7 · 14일로 간격이 늘어나요
 *  - 회차가 오를수록 망각 속도를 늦춰 계산해요 (effMins)
 */
const reviewBase = (h) => new Date(h.lastReviewAt || h.date).getTime();

const effMinutes = (h, now = Date.now()) => (now - reviewBase(h)) / 60000 / (1 + 1.2 * reviewStage(h));
/** 복습 행동(재도전 · 이해 완료)이 있을 때: 곡선을 리셋하고, 권장 시점 무렵이면 회차를 올려요 */
function markReviewed(h) {
  if (!h || h.sample) return;
  const now = Date.now();
  if (now >= nextDueAt(h) - DAY_MS / 2) h.stage = reviewStage(h) + 1;
  h.lastReviewAt = new Date(now).toISOString();
}

/** 키워드로 문제은행 자동 분류. 단원 키워드가 맞으면 exact, 과목만 맞으면 그 과목의 샘플(exact=false)
 *  [변경] 아무것도 맞지 않으면 엉뚱한 샘플로 몰래 대체하지 않고 null → '준비 중인 과목' 안내 */
function matchBank(query) {
  const q = (query || '').toLowerCase();
  const scored = Object.values(BANKS)
    .map((b) => ({ b, topic: b.topicKeys.filter((k) => q.includes(k)).length, subject: b.subjectKeys.filter((k) => q.includes(k)).length }))
    .sort((x, y) => (y.topic * 2 + y.subject) - (x.topic * 2 + x.subject));
  const top = scored[0];
  if (top.topic || top.subject) return { bank: top.b, exact: top.topic > 0 };
  return null;
}

function createSession(o) {
  const bank = BANKS[o.bankId];
  const conceptIds = o.conceptIds || bank.concepts.map((c) => c.id);
  const startLv = o.mode === 'ADAPTIVE' ? 2 : o.fixedLevel;
  return {
    id: uid('s'), kind: o.kind || 'main', status: 'ready',
    bankId: o.bankId, subject: o.subject, topic: o.topic, domain: o.domain,
    exact: o.exact !== false, userTopic: o.userTopic || '',
    subjectName: o.subjectName || '', topicName: o.topicName || '', // 사용자가 입력한 과목 · 단원 원문 (다시 진단할 때 그대로 사용)
    customPrompt: o.customPrompt || '', // [index5] 이번 진단에 보낸 세부 요구사항 (진단 준비 화면에 표시)
    fresh: !!o.fresh, // [index5] 내 서재 ▶로 시작 — 안 푼 문항 우선 (진단 준비 화면에 남은 새 문항 수 표시)
    mode: o.mode, fixedLevel: o.fixedLevel, total: o.total,
    conceptIds, levels: Object.fromEntries(conceptIds.map((c) => [c, startLv])),
    turn: 0, seq: 0, used: {}, logs: [], pendingVerify: null, current: null,
    retryOf: o.retryOf || null, createdAt: new Date().toISOString(),
  };
}

/** 같은 개념·단계에서 안 쓴 문항을 우선 고르고, 모두 썼다면 가장 오래전에 낸 문항을 보기 순서만 바꿔 재출제 */
function pickQuestion(sess, cid, lv, opt = {}) {
  const pool = BANKS[sess.bankId].questions.filter((q) => q.c === cid && q.lv === lv && q.id !== opt.excludeId);
  const unused = pool.filter((q) => !(q.id in sess.used));
  if (unused.length) return { q: unused[Math.floor(Math.random() * unused.length)], repeat: false };
  if (opt.unusedOnly || !pool.length) return null;
  const oldest = pool.slice().sort((a, b) => sess.used[a.id] - sess.used[b.id])[0];
  return { q: oldest, repeat: true };
}

function setCurrent(sess, q, flags) {
  sess.seq += 1;
  sess.used[q.id] = sess.seq;
  sess.current = {
    qid: q.id, cid: q.c, lv: q.lv, order: shuffle([0, 1, 2, 3]),
    isVerify: !!flags.isVerify, repeat: !!flags.repeat,
    phase: 'answering', selected: null, hesitation: 0, firstClickMs: null,
    startedAt: Date.now(), pausedMs: 0, tabOutMs: 0, tabOut: false,
    logIndex: null, msg: '',
  };
  return sess.current;
}

/** 다음 문항 결정. 반환값이 null이면 세션 종료 */
function advance(sess) {
  // (1) Speed Limit 검증 문항이 대기 중이면 최우선 출제
  const pv = sess.pendingVerify;
  if (pv && !pv.served) {
    const pick = pickQuestion(sess, pv.cid, pv.lv, { unusedOnly: true });
    if (pick) { pv.served = true; return setCurrent(sess, pick.q, { isVerify: true }); }
    const src = sess.logs[pv.logIndex];
    if (src) src.verifyPending = false;
    sess.pendingVerify = null;
  }
  // (2) 선택한 문항 수를 채우면 종료
  if (sess.logs.length >= sess.total) return null;
  // (3) 개념을 순환하며 각 개념의 현재 단계로 출제
  const cid = sess.conceptIds[sess.turn % sess.conceptIds.length];
  sess.turn += 1;
  const lv = sess.levels[cid];
  const last = [...sess.logs].reverse().find((l) => l.cid === cid);
  const pick = pickQuestion(sess, cid, lv, { excludeId: last && last.qid }) || pickQuestion(sess, cid, lv);
  return setCurrent(sess, pick.q, { repeat: pick.repeat });
}

/** 실제 풀이 시간(ms): 멈춤 · 화면 이탈 시간은 제외 */
function activeMs(cur, now = Date.now()) {
  let ms = now - cur.startedAt - cur.pausedMs - cur.tabOutMs;
  if (RT.pausedAt) ms -= now - RT.pausedAt;
  if (RT.hiddenAt) ms -= now - RT.hiddenAt;
  return Math.max(0, ms);
}
function resetTiming(cur) { Object.assign(cur, { startedAt: Date.now(), pausedMs: 0, tabOutMs: 0 }); RT.pausedAt = null; RT.hiddenAt = null; }
function resetAnswer(cur) { Object.assign(cur, { selected: null, hesitation: 0, firstClickMs: null, tabOut: false }); }
function pauseTimer() { const cur = S.session && S.session.current; if (cur && cur.phase === 'answering' && !RT.pausedAt) RT.pausedAt = Date.now(); }
function resumeTimer() {
  const cur = S.session && S.session.current;
  if (RT.pausedAt && cur) cur.pausedMs += Date.now() - RT.pausedAt;
  RT.pausedAt = null;
}

/* =====================================================================
 * 5-1) API 계층 — 백엔드(AWS + Spring Boot REST) 연동 뼈대
 *  - 화면 코드는 fetch를 직접 부르지 않고 Api.* 비동기 함수만 await 해요.
 *  - API_CONFIG.mock = true 이면 mockFetch()가 fetch와 같은 모양(Request → Response)으로 로컬 로직을 돌려줘요.
 *    백엔드가 준비되면 mock: false · baseUrl만 바꾸면 되고, 호출하는 쪽 코드는 그대로예요.
 *  - request(): 타임아웃(AbortController) · HTTP 오류 → ApiError 변환 · 전역 로딩 카운트(상단 진행 바)
 *  - 오류 상태 시험: 주소 뒤에 ?mockFail=extract | submit | all
 * ===================================================================== */
const API_CONFIG = {
  baseUrl: '/api/v1',                 // 예) https://api.metacheck.kr/api/v1 (Spring Boot)
  mock: true,                         // false → 실제 fetch
  timeoutMs: 10000,
  mockDelay: { extract: 650, submit: 160 }, // 모의 네트워크 지연(ms)
  mockFail: (() => { try { return new URLSearchParams(location.search).get('mockFail') || ''; } catch (e) { return ''; } })(),
};

class ApiError extends Error {
  constructor(message, { status = 0, code = 'UNKNOWN', data = null } = {}) {
    super(message);
    this.name = 'ApiError';
    this.status = status;
    this.code = code;
    this.data = data; // 오류 응답 본문 (예: NO_MATCH일 때 준비된 과목 목록)
  }
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const apiErrorMessage = (e) => (e && e.message) || '알 수 없는 오류가 발생했어요.';
/** JWT 등 인증 토큰 자리 (로그인 연동 시 S.user.token에 저장) */
const authToken = () => (S.user && S.user.token) || null;

/** 전역 로딩 상태: 요청이 하나라도 150ms 넘게 걸리면 상단 진행 바를 보여 줘요 (짧은 요청은 깜빡임 없이) */
const Net = {
  pending: 0, t: null,
  begin() {
    this.pending += 1;
    document.documentElement.setAttribute('aria-busy', 'true');
    if (this.pending === 1) this.t = setTimeout(() => { const b = $('#net-bar'); if (b) b.classList.add('is-active'); }, 150);
  },
  end() {
    this.pending = Math.max(0, this.pending - 1);
    if (this.pending) return;
    clearTimeout(this.t);
    document.documentElement.removeAttribute('aria-busy');
    const b = $('#net-bar'); if (b) b.classList.remove('is-active');
  },
};

/** 공통 요청 래퍼: 모든 API 호출이 이 한 곳을 지나가요 (Promise 반환, 실패는 ApiError로 통일) */
async function request(method, path, body) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), API_CONFIG.timeoutMs);
  const init = { method, headers: { Accept: 'application/json', 'Content-Type': 'application/json' }, signal: ctrl.signal };
  const token = authToken();
  if (token) init.headers.Authorization = `Bearer ${token}`;
  if (body !== undefined) init.body = JSON.stringify(body);
  Net.begin();
  try {
    const res = API_CONFIG.mock ? await mockFetch(method, path, init) : await fetch(API_CONFIG.baseUrl + path, init);
    const data = await res.json().catch(() => null);
    // Spring Boot 기본 오류 응답 { status, error, message, path } 형식을 그대로 읽어요
    if (!res.ok) throw new ApiError((data && data.message) || `서버 오류가 발생했어요 (${res.status})`, { status: res.status, code: (data && data.code) || 'HTTP', data });
    return data;
  } catch (e) {
    if (e instanceof ApiError) throw e;
    if (e && e.name === 'AbortError') throw new ApiError('서버 응답이 너무 늦어요.', { code: 'TIMEOUT' });
    throw new ApiError('네트워크에 연결할 수 없어요.', { code: 'NETWORK' });
  } finally {
    clearTimeout(timer);
    Net.end();
  }
}

/** 화면에서 쓰는 API 목록 — 실제 엔드포인트와 1:1 */
const Api = {
  /** ① 과목 · 단원(subjectName · topicName) 또는 교재 PDF → 과목 자동 분류 · 핵심 개념 추출 · 진단 계획
   *  [index5] 맞춤 출제 힌트 persona · customPrompt도 함께 보내요 (모의 서버는 받기만 하고, 실제 AI 서버가 출제에 반영) */
  extractConcepts: (payload) => request('POST', '/diagnoses', payload),
  /** ② 답안 제출 → 채점 결과 · 다음 난이도(분기) */
  submitAnswer: (sessionId, payload) => request('POST', `/diagnoses/${encodeURIComponent(sessionId)}/answers`, payload),
};

/* ---------- 모의 서버: 실제 백엔드가 할 일을 지금은 로컬 데이터로 처리 ---------- */
const jsonResponse = (status, data) => new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
function abortableWait(ms, signal) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(resolve, ms);
    if (signal) signal.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('Aborted', 'AbortError')); }, { once: true });
  });
}
const MOCK_ROUTES = [
  // 과목 · 단원을 따로 받아요: 키워드 탭은 둘 다 필수, PDF 탭은 교재 PDF만 있으면 돼요
  ['POST', /^\/diagnoses$/, 'extract', (b) => {
    const subjectName = String((b && b.subjectName) || '').trim(), topicName = String((b && b.topicName) || '').trim();
    const pdfNames = b && Array.isArray(b.pdfNames) ? b.pdfNames : b && b.pdfName ? [b.pdfName] : []; // [index5] 교재 PDF 여러 개
    if (!b || !((subjectName && topicName) || pdfNames.length)) return { status: 400, data: { status: 400, message: '진단할 과목과 단원, 또는 교재 PDF가 필요해요.' } };
    const m = matchBank(`${subjectName} ${topicName} ${b.pdfUnit || ''} ${pdfNames.join(' ')}`);
    if (!m) {
      return { status: 422, data: { status: 422, code: 'NO_MATCH', message: '아직 이 과목의 문항은 준비 중이에요.',
        available: Object.values(BANKS).map((x) => ({ subject: x.subject, topic: x.topic })) } };
    }
    return { status: 201, data: { bankId: m.bank.id, subject: m.bank.subject, topic: m.bank.topic, domain: m.bank.domain, exact: m.exact, subjectName, topicName, concepts: m.bank.concepts.map((c) => ({ id: c.id, name: c.name })) } };
  }],
  ['POST', /^\/diagnoses\/([^/]+)\/answers$/, 'submit', (b) => {
    const q = getQ(b && b.qid);
    if (!q) return { status: 404, data: { status: 404, message: '문항을 찾을 수 없어요.' } };
    const correct = b.chosen === q.a;
    // CAT 승강등: 정답이면 한 단계 위(최대 3), 오답이면 한 단계 아래(최소 1)
    const nextLevel = b.mode === 'ADAPTIVE' ? (correct ? Math.min(3, b.level + 1) : Math.max(1, b.level - 1)) : b.level;
    return { status: 200, data: { correct, answerIndex: q.a, stdSec: standardSec(q), nextLevel } };
  }],
];
async function mockFetch(method, path, init) {
  const route = MOCK_ROUTES.find(([m, re]) => m === method && re.test(path));
  const key = route ? route[2] : '';
  await abortableWait((API_CONFIG.mockDelay[key] || 300) * (0.8 + Math.random() * 0.4), init.signal);
  if (!route) return jsonResponse(404, { status: 404, message: '존재하지 않는 API예요.' });
  if (API_CONFIG.mockFail === key || API_CONFIG.mockFail === 'all') return jsonResponse(503, { status: 503, code: 'MOCK_FAIL', message: '서버가 잠시 응답하지 않아요.' });
  try {
    const out = route[3](init.body ? JSON.parse(init.body) : null, path.match(route[1]).slice(1));
    return jsonResponse(out.status, out.data);
  } catch (e) {
    return jsonResponse(500, { status: 500, message: '요청을 처리하지 못했어요.' });
  }
}

 * 6) 메타인지 판정 공식

/** 문항 단위 판정: 주관적 확신도 × 객관적 정답 × 행동 로그 */
function classifyItem(log) {
  if (!log.correct) {
    if (log.conf === 'HIGH') return { status: 'ILLUSION', reasons: ['100% 확신했지만 오답 — 가장 위험한 착각'] };
    if (log.conf === 'MEDIUM') return { status: 'ILLUSION', reasons: ['"대략 기억난다"고 느꼈지만 오답 — 익숙함의 착각'] };
    return { status: 'DEFICIT', reasons: ['30% 찍음 + 오답 — 모른다는 걸 스스로 알고 있어요'] };
  }
  const reasons = [];
  if (log.conf === 'LOW') reasons.push('30% 찍어서 맞힘');
  if (log.conf === 'MEDIUM') reasons.push('70% 확신 — 아직 아리송');
  if (log.speedFlag && log.verifyResult !== true) reasons.push(log.verifyResult === false ? '너무 빨리 맞혔고 확인 문항은 틀림 (요행)' : '최소 읽기 시간 미달 (성급한 풀이)');
  if (log.hesitation >= 2) reasons.push(`보기 번복 ${log.hesitation}회`);
  if (log.ratio > SLOW_LIMIT) reasons.push(`권장 시간의 ${log.ratio.toFixed(1)}배 소요`);
  if (log.tabOut) reasons.push('풀이 중 화면 이탈');
  if (!reasons.length) return { status: 'MASTERY', reasons: [log.speedFlag ? '빠르게 풀었고 확인 문항도 통과' : '확신 · 정답 · 풀이 행동 모두 안정적'] };
  return { status: 'INSTABILITY', reasons };
}

/** 개념 단위 판정 (복습 우선순위 · 기록용) */
function classifyConcept(c, its) {
  const n = its.length;
  const acc = its.filter((i) => i.correct).length / n;
  const conf = avg(its.map((i) => CONF[i.conf].v));
  const gap = conf - acc;
  const highWrong = its.some((i) => !i.correct && i.conf === 'HIGH');
  const confidentWrong = its.some((i) => !i.correct && i.conf !== 'LOW');
  const appFail = its.some((i) => i.lv === 1 && i.correct) && its.some((i) => i.lv >= 2 && !i.correct && i.conf !== 'LOW');
  const masteryRate = its.filter((i) => i.status === 'MASTERY').length / n;
  let status, why;
  if (highWrong) { status = 'ILLUSION'; why = '100% 확신했지만 틀린 문항이 있어요.'; }
  else if (appFail) { status = 'ILLUSION'; why = '기초 정의는 맞혔지만 실전 적용에서 확신하고 틀렸어요.'; }
  else if (confidentWrong && gap >= 0.2) { status = 'ILLUSION'; why = `확신도가 정답률보다 ${pct(gap)}%p 높아요.`; }
  else if (acc < 0.5) { status = 'DEFICIT'; why = '정답률이 50% 미만이에요. 기초 정의부터 다져요.'; }
  else if (acc >= 0.8 && masteryRate >= 0.6) { status = 'MASTERY'; why = '정확도 · 확신도 · 풀이 행동이 모두 안정적이에요.'; }
  else { status = 'INSTABILITY'; why = acc >= 0.8 ? '맞혔지만 확신이 낮거나 번복 · 지연이 있었어요.' : '맞힌 문항과 틀린 문항이 섞여 있어요.'; }
  return { id: c.id, name: c.name, desc: c.desc, status, why, n, acc, conf, gap, path: its.map((i) => ({ lv: i.lv, correct: i.correct })) };
}

function evaluate(entry) {
  const bank = BANKS[entry.bankId];
  const items = entry.logs.map((l, idx) => ({ ...l, idx, ...classifyItem(l) }));
  const counts = { ILLUSION: 0, INSTABILITY: 0, DEFICIT: 0, MASTERY: 0 };
  items.forEach((i) => { counts[i.status] += 1; });
  const accuracy = items.length ? items.filter((i) => i.correct).length / items.length : 0;
  const avgConf = avg(items.map((i) => CONF[i.conf].v));
  // 메타인지 정확도 = 100 × (1 − Brier 점수)
  const brier = avg(items.map((i) => (CONF[i.conf].v - (i.correct ? 1 : 0)) ** 2));
  const calibration = items.length ? Math.round(100 * (1 - brier)) : 0;
  const concepts = bank.concepts
    .map((c) => [c, items.filter((i) => i.cid === c.id)])
    .filter(([, its]) => its.length)
    .map(([c, its]) => classifyConcept(c, its));
  return { bankId: entry.bankId, items, counts, accuracy, avgConf, gap: avgConf - accuracy, calibration, concepts };
}

function refreshSummary(entry) {
  const ev = evaluate(entry);
  const key = ev.concepts.find((c) => c.status === 'ILLUSION');
  entry.summary = { counts: ev.counts, calibration: ev.calibration, accuracy: ev.accuracy, avgConf: ev.avgConf, keyIllusion: key ? key.name : null };
  return ev;
}

/** 복습 덱: 완벽 제외, 착각(100% 확신 → 70%) → 불안정 → 노베이스 순. 같은 문항은 가장 급한 기록 하나만 */
function reviewItems(h, ev) {
  if (!h || h.sample) return [];
  const e = ev || evaluate(h);
  const best = new Map();
  e.items.filter((i) => i.status !== 'MASTERY').forEach((i) => {
    // AI 분석에서 보완 판정(📌 pinned)을 받은 문항은 복습 덱 맨 앞(1순위)으로
    const score = ((h.review[i.qid] || {}).pinned ? -100 : 0) + STATUS[i.status].rank * 10 + (i.conf === 'HIGH' ? 0 : i.conf === 'MEDIUM' ? 1 : 2);
    const prev = best.get(i.qid);
    if (!prev || score <= prev.score) best.set(i.qid, { ...i, score });
  });
  return [...best.values()].sort((a, b) => a.score - b.score || a.idx - b.idx);
}
function unresolvedCount(h) {
  if (!h) return 0;
  if (h.sample) return h.summary.counts.ILLUSION;
  return reviewItems(h).filter((i) => i.status === 'ILLUSION' && !(h.review[i.qid] || {}).done).length;
}

/** [index5] 출제 방식 이름 — 홈 설정 · 설정 시트 · 진단 준비 · 결과 · 기록 · 내 서재가 모두 같은 이름을 써요
 *  ADAPTIVE = 🔀 셔플(개념을 섞어 실전부터, 맞히면 심화 · 틀리면 기초) / FIXED = 🪜 단계별 · 고른 단계만 */
const modeName = (mode, level) => (mode === 'ADAPTIVE' ? '🔀 셔플' : `🪜 단계별 · ${LEVELS[level] ? `${LEVELS[level].icon} ${LEVELS[level].short}` : `${level}단계`}`);
function modeLabel(s) {

  if (s.kind === 'retry') return '유사 문제 재도전';
  return `${modeName(s.mode, s.fixedLevel)} · ${s.total}문항`;
}
/** 기록에 저장된 방식 글자 — 예전 이름('적응형 · 10문항', '2단계 고정 · 5문항')으로 저장된 기록도 새 이름으로 보여 줘요 */
function histModeLabel(h) {
  if ((h.kind || 'main') === 'main' && h.mode && h.total) return modeLabel(h);
  return String(h.modeLabel || '').replace(/^적응형/, modeName('ADAPTIVE')).replace(/^(\d)단계 고정/, (m, n) => modeName('FIXED', Number(n)));
}
function greeting() {

/** [index5] opt.action = { label, run }: 글자만 있던 안내에 버튼을 달아요 — 누르면 run()을 실행하고 안내를 바로 닫아요 (예: 단원 삭제 [실행 취소])
 *  버튼을 달면 눌러 볼 시간이 필요하므로 기본 표시 시간을 5.5초로 늘려요 */
function toast(msg, opt = {}) {
  const el = document.createElement('div');
  el.className = `pointer-events-auto ${opt.tone === 'warn' ? 'bg-solid-danger text-white' : 'bg-ink-900 text-ink-50'} text-sm font-semibold px-4 py-3 rounded-2xl shadow-float anim-in text-center break-keep max-w-[420px]${opt.action ? ' flex items-center gap-3' : ''}`;
  const label = document.createElement('span'); label.textContent = msg; el.appendChild(label);
  let timer = 0;
  const close = () => { clearTimeout(timer); el.style.transition = 'opacity .2s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 220); };
  if (opt.action) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'shrink-0 -my-1.5 -mr-2 px-3 h-9 rounded-xl text-sm font-extrabold ' + (opt.tone === 'warn' ? 'text-white underline' : 'text-brand-300') + ' hover:opacity-80';
    b.textContent = opt.action.label;
    b.addEventListener('click', () => { close(); opt.action.run(); });
    el.appendChild(b);
  }
  $('#toast-root').appendChild(el);
  timer = setTimeout(close, opt.ms || (opt.action ? 5500 : 2400));
}

function confetti(count = 70) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;

/* ---------- 효과음 매니저: Web Audio API로 즉석 합성 (음원 파일 없음) ---------- */
const Sound = (() => {
  let ctx = null, master = null, noiseBuf = null;
  const init = () => {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(comp).connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const tone = (freq, at, dur, o = {}) => {
    const t0 = ctx.currentTime + at;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.08, t0 + (o.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  };
  const noise = (at, dur, gain, freq) => {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = ctx.currentTime + at;
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf;
    f.type = 'bandpass';
    f.frequency.setValueAtTime(freq, t0);
    f.frequency.exponentialRampToValueAtTime(freq * 2.5, t0 + dur);
    f.Q.value = 0.9;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  };
  const SFX = {
    tap:     () => tone(1300, 0, 0.035, { gain: 0.035 }),                                   // 일반 버튼
    select:  () => tone(760, 0, 0.06, { type: 'triangle', gain: 0.06 }),                     // 보기 선택
    correct: () => { tone(784, 0, 0.12, { type: 'triangle', gain: 0.1 }); tone(1175, 0.09, 0.22, { type: 'triangle', gain: 0.1 }); },       // 정답
    mastery: () => { tone(784, 0, 0.1, { type: 'triangle', gain: 0.09 }); tone(1047, 0.08, 0.1, { type: 'triangle', gain: 0.09 }); tone(1568, 0.16, 0.32, { type: 'sine', gain: 0.08 }); }, // 확실한 내 지식(완벽)
    wrong:   () => { tone(311, 0, 0.14, { type: 'square', gain: 0.03, to: 262 }); tone(233, 0.12, 0.22, { type: 'square', gain: 0.028, to: 196 }); }, // 오답 · 가벼운 경고
    alert:   () => { tone(988, 0, 0.08, { gain: 0.06 }); tone(988, 0.12, 0.08, { gain: 0.06 }); },                  // Speed Limit
    flip:    () => noise(0, 0.2, 0.08, 700),                                                  // 카드 뒤집기
    sheet:   () => noise(0, 0.14, 0.03, 1200),                                                // 바텀 시트
    fanfare: () => {                                                                           // 진단 · 복습 완료
      [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.1, 0.16, { type: 'triangle', gain: 0.09 }));
      [523, 659, 784, 1047].forEach((f) => tone(f, 0.42, 0.7, { gain: 0.045 }));
    },
  };
  return {
    play(name) {
      if (!S.prefs.sound || !SFX[name]) return;
      try { if (init()) SFX[name](); } catch (e) { /* 오디오를 쓸 수 없는 환경 */ }
    },
  };
})();

    <h3 class="text-[19px] font-extrabold">${o.title}</h3>
    <p class="mt-1.5 text-sm text-ink-600 leading-relaxed">${o.desc}</p>
    <div class="mt-5 grid grid-cols-2 gap-2">
      <button type="button" class="btn btn-lg btn-gray" data-action="${o.cancelAction || 'close-sheet'}">${o.cancel || '취소'}</button>
      <button type="button" class="btn btn-lg ${o.danger === false ? 'btn-primary' : 'bg-solid-danger hover:bg-solid-danger-hover text-white'}" data-action="${o.okAction}">${o.ok}</button>
    </div>`, { onClose: o.onClose });
}

/* =====================================================================
 * 8) 화면 렌더링
 * ===================================================================== */
const VIEWS = ['landing', 'home', 'library', 'ready', 'quiz', 'result', 'review', 'history'];
const TITLES = { landing: '메타인지 학습 진단', home: '홈', library: '내 서재', ready: '진단 준비', quiz: '진단 중', result: '진단 결과', review: '복습 덱', history: '학습 기록' };
// [index5] 내 서재를 하단 탭 · 상단 메뉴의 독립 메인 화면으로: 홈 / 내 서재 / 기록 / 복습
const NAV = [['home', 'fa-house', '홈'], ['library', 'fa-book-bookmark', '내 서재'], ['history', 'fa-clock-rotate-left', '기록'], ['review', 'fa-layer-group', '복습']];

function go(view, opt = {}) {
  if (!S.user) view = 'landing';
  else if (view === 'landing') view = 'home';
  if (view === 'quiz' && !(S.session && S.session.status === 'active' && S.session.current)) view = 'home';
  if (view === 'ready' && !(S.session && S.session.status === 'ready')) view = 'home';
  if (view === 'result') { const h = findEntry(S.resultId); if (!h || h.sample) view = 'home'; }
  if (view !== 'quiz') stopTicker();
  if (view !== 'home') stopReviewTimer();
  if (view === 'review' && S.view !== 'review') RT.flipped = false;
  // 학습 기록에 새로 들어오면 과목 필터를 '가장 최근에 진단한 과목'으로 (결과 화면에서 돌아올 때는 고르던 과목 유지)
  if (view === 'history' && (!RT.histVisited || (S.view !== 'history' && S.view !== 'result'))) S.histFilter.subject = defaultHistSubject();
  if (view === 'history') RT.histVisited = true;
  hideTip();
  const changed = S.view !== view;
  S.view = view;
  document.documentElement.dataset.view = view; // [index4] 배경 장식: 풀이 화면에서는 옅게
  save();
  VIEWS.forEach((v) => $('#view-' + v).classList.toggle('hidden', v !== view));
  RENDER[view]();
  chrome();
  document.title = `${TITLES[view]} · 메타체크`;
  try {
    if (opt.push !== false && changed) history.pushState({ view }, '', '#' + view);
    else history.replaceState({ view }, '', '#' + view);
  } catch (e) { /* file:// 등 일부 환경 */ }
  window.scrollTo(0, 0);
}

function chrome() {
  const v = S.view;
  $('#app-header').classList.toggle('hidden', v === 'landing' || v === 'quiz');
  $('#bottom-nav').classList.toggle('hidden', !['home', 'library', 'history', 'review', 'result'].includes(v));
  const active = v === 'result' ? 'history' : v;
  const badge = totalUnresolved(); // 모든 진단의 미해결 착각
  const badgeHTML = (cls) => (badge ? `<span class="${cls} min-w-[18px] h-[18px] px-1 rounded-full bg-solid-danger text-white text-[10px] leading-[18px] text-center font-bold">${badge}</span>` : '');
  $('#top-nav').innerHTML = NAV.map(([id, , label]) => `
    <button type="button" data-action="go" data-view="${id}" ${active === id ? 'aria-current="page"' : ''}
      class="h-9 px-3.5 rounded-xl text-sm font-bold transition inline-flex items-center gap-1.5 ${active === id ? 'bg-surface text-ink-900 shadow-sm' : 'text-ink-500 hover:text-ink-800'}">
      ${label}${id === 'review' ? badgeHTML('') : ''}</button>`).join('');
  $('#bottom-nav').innerHTML = `
    <div class="grid grid-cols-4 max-w-md mx-auto">${NAV.map(([id, ic, label]) => `
      <button type="button" data-action="go" data-view="${id}" ${active === id ? 'aria-current="page"' : ''}
        class="relative h-16 flex flex-col items-center justify-center gap-1 text-[11px] font-bold ${active === id ? 'text-ink-900' : 'text-ink-500'}">
        <i class="fa-solid ${ic} text-[18px]"></i>${label}${id === 'review' ? badgeHTML('absolute top-2 left-1/2 ml-2') : ''}</button>`).join('')}
    </div>
    <div style="height: env(safe-area-inset-bottom)"></div>`;
  const ini = $('#avatar-initial');
  if (ini) ini.innerHTML = S.user && !S.user.guest ? esc(S.user.nickname.charAt(0)) : '<i class="fa-solid fa-user text-[12px]"></i>';
  syncToggles();
}

/* ---------- 홈: 진입점 탭 (키워드 직접 입력 · 교재 PDF 업로드) ----------
 * [변경] 구글형 단일 검색창을 폐기하고 세그먼트 탭 2개로 나눴어요.
 *  - 키워드 탭(기본): '과목' · '단원' 입력창 2개 → S.setup.subjectName · topicName에 바인딩.
 *    [진단 시작]은 두 값이 모두 있을 때만 활성화 (입력할 때마다 syncStartBtn으로 다시 그리지 않고 즉시 갱신)
 *  - PDF 탭: 기존 '교재 PDF 끌어다 놓기' 영역과 업로드 로직(handlePdf)을 바텀 시트에서 이 탭으로 옮겼어요
 *  [변경] 배치: 입력 카드 → 예시 키워드 칩(검색창 바로 아래) → 진단 설정 박스 버튼
 *  [변경] 진단 설정: 메인 색 테두리 + 옅은 틴트 배경의 가로형 박스 버튼 (아이콘 · 현재 설정 · [변경 ›], 전체를 눌러 설정 시트)
 *  [변경] 사용자 유형(역할)별 분기 · 자격증 카탈로그를 없애고 누구나 같은 화면으로 바로 시작
 */
const TRY_PAIRS = [['운영체제 (OS)', '데드락'], ['데이터베이스 (DB)', '트랜잭션'], ['미시경제학', '기회비용']];
// [키, 아이콘, 라벨 앞부분, 줄바꿈 없이 붙일 뒷부분]
// [index5] 라벨을 짧게 — '교재·슬라이드 PDF 업로드'가 두 줄로 꺾여 왼쪽 탭과 높이가 안 맞던 것 정리 (교재 · 슬라이드 설명은 PDF 탭 안 안내 문구에 있어요)
const HOME_TABS = [['keyword', 'fa-keyboard', '키워드 입력', ''], ['pdf', 'fa-file-pdf', 'PDF 업로드', '']]; // [index5] 내 서재는 하단 탭(view-library)으로 옮겼어요
const keywordReady = () => !!(S.setup.subjectName.trim() && S.setup.topicName.trim());

const homeTab = () => (RT.homeTab === 'pdf' ? 'pdf' : 'keyword');

/** [index5] 홈 [진단 시작] 고정 바 — 예전엔 폼 맨 아래라 375×812 폰에서 첫 화면 밖(808px)이었어요
 *  ① 화면 아래에 고정(진단 준비 화면과 같은 방식): 모바일은 하단 탭 바(76px) 바로 위 · 데스크톱은 맨 아래
 *  ② 폼 밖에 있으므로 키워드 탭은 form="kw-form"으로 폼을 제출해요 (칸에서 Enter를 눌러도 같은 버튼이 기본 제출 버튼이라 그대로 동작)
 *  ③ 비활성일 때는 별도 안내 줄 대신 버튼 글자가 이유를 말해요: '과목과 단원을 입력해 주세요' / 'PDF를 올려 주세요' (syncStartBtn이 입력할 때마다 갱신)
 *  ④ position: fixed는 transform이 걸린 조상 안에서 깨지므로(.anim-in) 애니메이션 컨테이너 '밖'(형제)에 둬요
 *  ⑤ 키보드가 열려 하단 탭 바가 숨겨지면(.kb-open) 바닥으로 내려요 */
function startBarHTML(tab) {
  const n = (S.setup.pdfs || []).length;
  const kw = tab !== 'pdf';
  const ready = kw ? keywordReady() : n > 0;
  const label = kw ? (ready ? '진단 시작' : '과목과 단원을 입력해 주세요') : (n > 1 ? `PDF ${n}개로 진단 시작` : n ? '이 PDF로 진단 시작' : 'PDF를 올려 주세요');
  const attrs = kw ? 'type="submit" form="kw-form" id="kw-start"' : 'type="button" id="kw-start" data-action="start-pdf"';
  return `
  <div class="home-cta fixed inset-x-0 z-20 bottom-[calc(76px+env(safe-area-inset-bottom))] md:bottom-0 bg-gradient-to-t from-canvas via-canvas to-canvas/0 pt-5 pb-3 md:pb-4">
    <div class="max-w-xl mx-auto px-4 sm:px-5">
      <button ${attrs} class="btn btn-lg btn-primary w-full shadow-float disabled:opacity-100 disabled:bg-ink-200 disabled:text-ink-500 disabled:shadow-none" ${ready ? '' : 'disabled'}><span id="kw-start-label">${label}</span><i id="kw-start-arrow" class="fa-solid fa-arrow-right text-sm ${ready ? '' : 'hidden'}" aria-hidden="true"></i></button>
    </div>
  </div>`;
}

/** [index5] 홈 첫 화면 정리 — 375×812에서 [진단 시작]이 화면 밖으로 밀리던 문제
 *  · 헤더 로고와 똑같이 생긴 큰 'M' 로고(장식)를 뺐어요 · 제목은 한 단계 작게 · 세로 가운데 정렬 대신 위에서부터 (입력칸이 바로 보이게)

        <button type="button" role="tab" id="home-tab-${k}" aria-controls="home-panel" aria-selected="${tab === k}" data-action="home-tab" data-k="${k}"

          <i class="fa-solid ${ic} text-xs ${tab === k ? 'text-brand-500' : ''}" aria-hidden="true"></i><span>${a} <span class="whitespace-nowrap">${b}</span></span></button>`).join('')}
      </div>
      <div id="home-panel" role="tabpanel" aria-labelledby="home-tab-${tab}" class="mt-3">${tab === 'pdf' ? pdfPanelHTML() : keywordPanelHTML()}</div>

  </div>
  ${startBarHTML(tab)}`;

/* [index5] 세부 요구사항 — 홈 '단원' 칸 바로 아래 (키워드 · PDF 탭 공통)
 *  바인딩: <textarea data-bind="customPrompt"> → 공통 input 핸들러가 S.setup.customPrompt에 저장 → syncQuickChips()로 글자 수 · 칩 켜짐 갱신
 *          빠른 입력 칩 'quick-prompt' → 문구를 ', '로 붙이거나 빼고 textarea 값도 같이 바꿔요
 *  홈을 다시 그리지 않고 칩 클래스 · aria-pressed만 바꿔요 (다시 그리면 입력 중인 칸의 포커스 · 한글 조합이 끊겨요)
 *  [index5] 칩 줄: 줄바꿈(flex-wrap) 대신 한 줄 가로 스와이프(flex-nowrap overflow-x-auto no-scrollbar) — 칩이 늘어도 세로 공간을 안 늘려요
 *     · 부모 flex 안에서 줄어들 수 있게 min-w-0 · 칩은 shrink-0 whitespace-nowrap(quickChipCls)이라 찌그러지거나 글자가 꺾이지 않아요
 *     · overflow가 생기면 칩의 ring-1이 위 · 아래 · 왼쪽에서 잘리므로 px-1 py-1을 주고 -mx-1 -my-1로 원래 위치를 맞춰요
 *     · 홈(promptFieldHTML)과 단원 출제 방법 시트(SH-10, openLibPlanSheet)가 같은 클래스를 써요
 *  값은 진단 시작 때 prepareDiagnosis()가 Api.extractConcepts 요청에 customPrompt로 실어 보내요 */
const quickChipCls = (on) => `shrink-0 whitespace-nowrap h-9 px-3 rounded-full text-[13px] font-semibold transition ${on ? 'bg-solid-brand text-white ring-1 ring-brand-500' : 'bg-surface text-ink-700 ring-1 ring-ink-200 hover:ring-brand-400 hover:text-brand-700'}`;
const quickChipInner = (t, on) => `${on ? '<i class="fa-solid fa-check text-[10px] mr-1" aria-hidden="true"></i>' : '<span aria-hidden="true">+ </span>'}${esc(t)}`;
const quickChipHTML = (t, on) => `<button type="button" class="${quickChipCls(on)}" data-action="quick-prompt" data-t="${esc(t)}" aria-pressed="${on}">${quickChipInner(t, on)}</button>`;
/** 세부 요구사항을 쉼표로 나눈 조각 — 빠른 입력 칩이 이미 들어 있는지 판단할 때 써요 */
const promptParts = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean);
const hasPrompt = (s, t) => promptParts(s).includes(t);
/** 세부 요구사항 입력칸 + 빠른 입력 칩 + 글자 수 (한 번에 한 탭만 그려지므로 id가 겹치지 않아요) */
const promptFieldHTML = () => `
    <div>
      <label class="label" for="in-prompt">세부 요구사항 <span class="font-medium text-ink-500">(선택) · 어떤 부분의 문제를 풀고 싶나요?</span></label>
      <textarea id="in-prompt" class="field !h-auto py-3 leading-relaxed resize-none" rows="2" data-autosize data-bind="customPrompt" placeholder="예: 은행원 알고리즘으로 안전 상태를 판단하는 부분만 풀고 싶어요" maxlength="${PROMPT_MAX}" autocomplete="off">${esc(S.setup.customPrompt)}</textarea>
      <div class="mt-1.5 flex items-start gap-2">

/* ---------- [index5] 내 서재 (S.library) — 구조 · CRUD 흐름은 스크립트 맨 위 ⑤ 설명 참고 ---------- */
const normName = (s) => String(s || '').trim().replace(/\s+/g, ' ');
const sameName = (a, b) => normName(a).toLowerCase() === normName(b).toLowerCase();
const libSubject = (sid) => S.library.find((x) => x.id === sid);
const libFindByName = (name) => S.library.find((x) => sameName(x.name, name));
/** 단원 id로 { sub, u } 찾기 (결과 화면의 [다시 진단하기]에서 그 단원 출제 방법을 다시 열 때) */
function libFindUnit(unitId) {
  for (const sub of S.library) { const u = sub.units.find((x) => x.id === unitId); if (u) return { sub, u }; }
  return null;
}
/** [index5] 'ㅈㅁㄱ'처럼 자음 · 모음만 있는 이름 — 한글 입력이 덜 끝난 채 저장 · 진단되는 걸 막아요 (이미 저장된 이름엔 '이름 확인' 표시) */
const isJamoOnly = (s) => /^[\sㄱ-ㅎㅏ-ㅣ]+$/.test(normName(s));
const JAMO_MSG = '자음 · 모음만으로는 저장할 수 없어요. 과목 · 단원 이름을 완성해 주세요';
const JAMO_CHIP = ' <span class="chip !py-0 bg-unstable-50 text-unstable-700 align-middle">이름 확인</span>';
/** [index5] 단원마다 기억하는 '출제 방법'(u.plan) — 세부 요구사항 · 풀이 방식(🔀 셔플 / 🪜 단계별) · 단계 · 문항 수
 *  같은 과목이라도 단원마다 따로 정해요. 아직 정하지 않은 단원은 예전 버전의 과목 출제 방법(sub.plan) → 홈 진단 설정 순으로 이어받아요 */
function unitPlan(sub, u) {
  const p = (u && u.plan) || sub.plan || {};
  return {
    prompt: p.prompt != null ? p.prompt : '',
    mode: p.mode === 'FIXED' || p.mode === 'ADAPTIVE' ? p.mode : S.setup.mode,
    level: [1, 2, 3].includes(p.level) ? p.level : S.setup.fixedLevel,
    count: COUNT_OPTIONS.includes(p.count) ? p.count : S.setup.count,
  };
}
function libSetPlan(u, p) {
  u.plan = {
    prompt: String(p.prompt || '').trim().slice(0, PROMPT_MAX),
    mode: p.mode === 'FIXED' ? 'FIXED' : 'ADAPTIVE',
    level: [1, 2, 3].includes(p.level) ? p.level : 2,
    count: COUNT_OPTIONS.includes(p.count) ? p.count : RECOMMENDED.count,
  };
}
const planText = (p) => `${modeName(p.mode, p.level)} · ${p.count}문항`;
/** C: 과목 · 단원 추가. 같은 이름(대소문자 · 공백 무시)이 있으면 합쳐요 → { ok, added, reason, sub, unit }
 *  plan을 주면 '새로 만든 단원'의 출제 방법으로 기억해요 (이미 있는 단원의 출제 방법은 덮어쓰지 않아요) */
function libAdd(subjectName, topicName, plan) {
  const sName = normName(subjectName).slice(0, 40), tName = normName(topicName).slice(0, 60);
  if (!sName || !tName) return { ok: false, reason: '과목과 단원을 모두 입력해 주세요' };
  if (isJamoOnly(sName) || isJamoOnly(tName)) return { ok: false, reason: JAMO_MSG };
  let sub = libFindByName(sName);
  if (!sub) {
    if (S.library.length >= LIB_MAX_SUBJECTS) return { ok: false, reason: `과목은 ${LIB_MAX_SUBJECTS}개까지 저장할 수 있어요` };
    sub = { id: uid('ls'), name: sName, units: [], createdAt: new Date().toISOString() };
    S.library.push(sub);
  }
  const hit = sub.units.find((u) => sameName(u.name, tName));
  if (hit) return { ok: true, added: false, sub, unit: hit };
  if (sub.units.length >= LIB_MAX_UNITS) return { ok: false, reason: `한 과목에 단원은 ${LIB_MAX_UNITS}개까지 저장할 수 있어요` };
  const unit = { id: uid('lu'), name: tName, uses: 0, lastUsedAt: null };
  if (plan) libSetPlan(unit, plan);
  sub.units.push(unit);
  return { ok: true, added: true, sub, unit };
}
/** 서재에 있는 과목 · 단원으로 진단을 준비하면 사용 횟수 · 최근 사용 시각을 갱신 → 그 단원 반환 */
function libTouch(subjectName, topicName) {
  const sub = libFindByName(subjectName), u = sub && sub.units.find((x) => sameName(x.name, topicName));
  if (u) { u.uses = (u.uses || 0) + 1; u.lastUsedAt = new Date().toISOString(); }
  return u || null;
}
/** 이 단원으로 푼 본 진단들 (오래된 → 최근) — 진단에 남긴 단원 id(libUid) 또는 입력한 과목 · 단원 이름으로 찾아요 */
function libUnitEntries(sub, u) {
  return realHistory()
    .filter((h) => (h.kind || 'main') === 'main' && h.summary && (h.libUid === u.id || (sameName(h.subjectName, sub.name) && sameName(h.topicName, u.name))))
    .sort((a, b) => new Date(a.date) - new Date(b.date));
}
/** 이름을 바꾸기 전에 호출: 이름으로만 이어져 있던 지난 진단에 단원 id(libUid)를 남겨, 이름을 바꿔도 지난 결과 · 가이드라인이 끊기지 않게 해요 */
function libPinEntries(sub, u) { libUnitEntries(sub, u).forEach((h) => { if (!h.libUid) h.libUid = u.id; }); }
/** [index5] 셔플 vs 단계별 가이드라인: 지난 결과(단원 또는 과목의 가장 최근 진단)로 풀이 방식을 추천해요 → { mode, level, t, d } */
function libRecommend(es, what = '단원') {
  const last = es[es.length - 1];
  if (!last) return { mode: 'ADAPTIVE', level: 2, t: '🔀 셔플로 지금 수준부터 찾기', d: `처음 푸는 ${what}이에요. 실전(2단계)에서 시작해 맞히면 심화, 틀리면 기초로 옮겨 가며 내 수준을 찾아 줘요.` };
  const acc = last.summary.accuracy, cal = last.summary.calibration, un = unresolvedCount(last), a = pct(acc);
  if (acc < 0.5) return { mode: 'FIXED', level: 1, t: '🪜 단계별 · 🌱 기초부터 다지기', d: `지난번 정답률 ${a}% — 개념의 기본이 아직 흔들려요. 기초 정의 문제만 모아 풀면서 원리부터 잡아요.` };
  if (un) return { mode: 'ADAPTIVE', level: 2, t: '🔀 셔플로 착각이 반복되는지 확인', d: `지난번 정답률 ${a}% · 남은 착각 ${un}개 — 섞어서 다시 풀며 같은 착각이 또 나오는지 확인해요. 복습 덱의 유사 문제로 먼저 해소해도 좋아요.` };
  if (acc >= 0.8 && cal >= 80) return { mode: 'FIXED', level: 3, t: '🪜 단계별 · 🚀 심화로 응용력 확인', d: `지난번 정답률 ${a}% · 메타인지 ${cal}점으로 안정적이에요. 심화 문제만 풀며 응용까지 되는지 확인해 보세요.` };
  return { mode: 'ADAPTIVE', level: 2, t: '🔀 셔플로 흔들리는 단계 찾기', d: `지난번 정답률 ${a}% — 섞어서 다시 풀면 어느 개념 · 단계에서 흔들리는지 드러나요.` };
}
/** U: 과목 이름 고치기 · 과목에 단원 추가(new-unit) — #lib-edit-form 제출(Enter)
 *  단원 이름은 단원 [수정] 시트(openLibPlanSheet origin 'edit')에서 출제 방법과 함께 고쳐요 */
function libSaveEdit() {
  const e = RT.libEdit, f = $('#lib-edit-input'), sub = e && libSubject(e.sid);
  if (!e || !f) return;
  if (!sub) { RT.libEdit = null; refreshLibrary(); return; }
  const name = normName(f.value);
  const fail = (m) => { toast(m, { tone: 'warn' }); f.focus(); };
  if (!name) return fail('이름을 입력해 주세요');
  if (isJamoOnly(name)) return fail(JAMO_MSG); // [index5] 'ㅈㅁㄱ'처럼 덜 끝난 한글 막기
  let added = null;
  if (e.kind === 'subject') {
    if (S.library.some((x) => x !== sub && sameName(x.name, name))) return fail('같은 이름의 과목이 이미 있어요');
    sub.units.forEach((u) => libPinEntries(sub, u));
    sub.name = name.slice(0, 40);
  } else {
    const r = libAdd(sub.name, name);
    if (!r.ok) return fail(r.reason);
    if (!r.added) return fail('이 과목에 같은 이름의 단원이 이미 있어요');
    added = r.unit;
  }
  RT.libEdit = null;
  save();
  refreshLibrary();
  // [index5] 새 단원이면 바로 출제 방법 시트(세부 요구사항 · 셔플/단계별 가이드라인)를 열어요
  if (added) openLibPlanSheet({ sid: sub.id, uid: added.id, origin: 'added' }); else toast('이름을 바꿨어요');
}
/** 편집 취소(Esc · [취소]) → 고치던 줄의 [수정] 버튼으로 포커스를 돌려줘요 */
function libCancelEdit() {
  const e = RT.libEdit;
  RT.libEdit = null;
  refreshLibrary();
  const b = e && $(`[data-action="lib-edit"][data-kind="${e.kind}"][data-sid="${e.sid}"]${e.uid ? `[data-uid="${e.uid}"]` : ''}`);
  if (b) b.focus({ preventScroll: true });
}
/** C: 서재 화면 아래 추가 폼 */
function libSubmitAdd(form) {
  const fd = new FormData(form);
  const r = libAdd(fd.get('subject'), fd.get('topic'));
  if (!r.ok) { toast(r.reason, { tone: 'warn' }); return; }
  RT.libOpen.add(r.sub.id); // 추가한 과목을 펼쳐서 바로 보이게
  if (!r.added) { refreshLibrary(); toast('이미 내 서재에 있는 단원이에요'); return; }
  save();
  refreshLibrary();
  openLibPlanSheet({ sid: r.sub.id, uid: r.unit.id, origin: 'added' }); // [index5] 과목 · 단원을 넣은 직후 세부 요구사항 · 풀이 방식을 바로 정해요
}
/** [index5] 헤더 [+ 추가] 퀵 버튼 — 추가 폼(#lib-add-form)으로 부드럽게 스크롤한 뒤 과목 입력창에 포커스
 *  바인딩: 버튼 data-action="lib-add-focus" → 공통 click 위임(document) → ACTIONS['lib-add-focus'] → 이 함수 (버튼마다 리스너를 달지 않아요)
 *  ① form.scrollIntoView({ behavior: 'smooth', block: 'center' }) — 폼을 화면 가운데로 (움직임 줄이기 설정이면 즉시 이동)
 *  ② 스크롤이 멈춘 걸 확인한 뒤(scrollY가 약 6프레임 그대로) input.focus({ preventScroll: true })
 *     · 스크롤 도중에 포커스하면 모바일 키보드가 올라오며 화면이 덜컥거려서 '멈춘 뒤'에 포커스해요
 *     · 이미 폼이 보이는 자리면 스크롤이 없어 약 0.1초 뒤 바로 포커스돼요 (scrollend 이벤트는 iOS Safari 등에서 늦게 지원돼 쓰지 않았어요)
 *     · preventScroll: 포커스가 스크롤을 또 일으켜 방금 맞춘 위치가 흔들리지 않게 (터치 기기의 키보드 가림 보정은 Keyboard가 이어서 처리) */
function libFocusAdd() {
  const form = $('#lib-add-form'), input = $('#lib-add-subject');
  if (!form || !input) return;
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  form.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
  const focusNow = () => { if (input.isConnected) input.focus({ preventScroll: true }); };
  if (reduce) { focusNow(); return; }
  let last = -1, still = 0, frames = 0;
  const settle = () => {
    const y = window.scrollY;
    still = Math.abs(y - last) < 1 ? still + 1 : 0; last = y;
    if (still >= 6 || ++frames > 60) focusNow(); else requestAnimationFrame(settle); // 최대 약 1초까지만 기다려요
  };
  requestAnimationFrame(settle);
}
/** [index5] 단원 삭제 되돌리기 — 같은 객체(id · 출제 방법 · 사용 기록 그대로)를 원래 자리에 다시 넣어요
 *  그 사이 과목이 지워졌거나 · 같은 이름이 새로 생겼거나 · 한도(LIB_MAX_UNITS)가 찼으면 되돌리지 않고 이유를 알려 줘요 */
function libUndoDelUnit(sid, u, at) {
  const sub = libSubject(sid);
  if (!sub) { toast('과목이 이미 지워져서 되돌릴 수 없어요', { tone: 'warn' }); return; }
  if (sub.units.some((x) => sameName(x.name, u.name))) { toast('같은 이름의 단원이 이미 있어요', { tone: 'warn' }); return; }
  if (sub.units.length >= LIB_MAX_UNITS) { toast(`과목당 단원은 ${LIB_MAX_UNITS}개까지예요`, { tone: 'warn' }); return; }
  sub.units.splice(Math.min(at, sub.units.length), 0, u);
  RT.libOpen.add(sub.id);
  save(); refreshLibrary();
  toast(`‘${u.name}’ 단원을 되돌렸어요`);
}
/** 서재 화면이 열려 있으면 다시 그려요 (CRUD · 펼침 뒤 공통) */
function refreshLibrary() { if (S.view === 'library') renderLibrary({ quiet: true }); }
/** 과목 아코디언: 처음 들어오면 가장 최근에 쓴 과목(없으면 첫 과목)을 펼쳐 둬요 */
function libEnsureOpen() {
  if (!RT.libOpen) RT.libOpen = new Set();
  if (RT.libOpenInit || !S.library.length) return;
  RT.libOpenInit = true;
  const recent = S.library.slice().sort((a, b) => libLastUsed(b) - libLastUsed(a))[0];
  RT.libOpen.add(recent.id);
}
const libLastUsed = (sub) => Math.max(0, ...sub.units.map((u) => (u.lastUsedAt ? new Date(u.lastUsedAt).getTime() : 0)));

/** R: 하단 탭 '내 서재'(view-library) — 과목을 누르면 단원이 펼쳐지는 아코디언
 *  과목 줄: [과목명 · 단원 N개 ▾] [수정 = 과목 이름] [삭제]
 *  단원 줄: 단원명 · 출제 방법 · 지난 결과 [▶ 진단] [수정 = 단원 이름 + 출제 방법] [삭제]  /  맨 아래 과목 · 단원 추가 폼 */
function renderLibrary(opt = {}) {

  const editForm = (value, max, label, placeholder) => `

  const unitRow = (sub, u) => {

    return `
      <li class="flex items-center gap-1 pl-5 pr-1 py-2">
        <div class="min-w-0 flex-1">${unitMetaHTML(sub, u)}</div>

        <button type="button" class="${sm} text-ink-600 hover:bg-ink-100" data-action="lib-unit-edit" data-sid="${sub.id}" data-uid="${u.id}" title="단원 이름과 출제 방법을 함께 바꿔요" aria-label="${esc(u.name)} 단원 이름 · 출제 방법 수정">수정</button>

      ${e && e.kind === 'subject' && e.sid === sub.id ? editForm(sub.name, 40, `${sub.name} 과목 이름`, '과목 이름') : `
      <div class="flex items-center gap-1 pr-1">

          <span class="flex-1"></span>
        </button>
        <button type="button" class="${sm} text-ink-600 hover:bg-ink-100" data-action="lib-edit" data-kind="subject" data-sid="${sub.id}" aria-label="${esc(sub.name)} 과목 이름 수정">수정</button>
        <button type="button" class="${sm} text-illusion-600 hover:bg-illusion-50" data-action="lib-del-subject" data-sid="${sub.id}" aria-label="${esc(sub.name)} 과목 삭제">삭제</button>
      </div>`}
      <div id="lib-units-${sub.id}" class="pb-2" ${open ? '' : 'hidden'}>
        ${sub.units.length ? `<ul class="divide-y divide-ink-100">${sub.units.map((u) => unitRow(sub, u)).join('')}</ul>` : '<p class="pl-9 py-2 text-xs text-ink-500">단원이 없어요. [+ 단원]으로 추가해 보세요.</p>'}
        <div class="pl-8 pt-1">${e && e.kind === 'new-unit' && e.sid === sub.id
          ? editForm('', 60, `${sub.name}에 추가할 단원 이름`, '새 단원 이름')
          : `<button type="button" class="${sm} text-brand-600 hover:bg-brand-50" data-action="lib-edit" data-kind="new-unit" data-sid="${sub.id}"><i class="fa-solid fa-plus text-[10px] mr-1" aria-hidden="true"></i>단원</button>`}</div>
      </div>

    <form id="lib-add-form" class="card p-4" autocomplete="off" novalidate>

/** 단원 줄 요약: 이름(자음 · 모음만이면 '이름 확인') · 이 단원 출제 방법 · 지난 결과(횟수 · 날짜 · 정답률) · 남은 착각 */
function unitMetaHTML(sub, u) {

  const p = unitPlan(sub, u), pText = `${planText(p)}${p.prompt ? ` · “${p.prompt}”` : ''}`;
  return `<p class="text-[15px] font-bold truncate">${esc(u.name)}${isJamoOnly(u.name) ? JAMO_CHIP : ''}</p>
    <p class="mt-0.5 text-xs font-bold text-brand-700 truncate" title="${esc(pText)}"><i class="fa-solid fa-sliders text-[10px] mr-1" aria-hidden="true"></i><span class="sr-only">출제 방법 </span>${esc(pText)}</p>
    <p class="mt-0.5 flex flex-wrap items-center gap-x-1.5 gap-y-0.5 text-[11px] font-semibold text-ink-500">
      <span>${last ? `진단 ${es.length}회 · ${relDay(last.date)} · 정답률 ${pct(last.summary.accuracy)}%` : '아직 진단 전'}</span>
      ${un ? `<span class="chip !py-0 bg-illusion-50 text-illusion-700">착각 ${un}</span>` : ''}
    </p>`;
}

/** [index5] 단원 ▶ 진단 · 서재 단원 결과의 [다시 진단하기] — 단원에 저장한 출제 방법으로 바로 시작해요
 *  예전엔 매번 출제 방법 시트를 거쳤지만, 출제 방법은 단원 줄에 보이고 [수정]에서 바꿀 수 있어 반복할 때마다 한 단계가 더 있었어요
 *  진단 준비 화면(freshRuleHTML)에 어떤 출제 방법으로 내는지 · 어디서 바꾸는지 알려 주고, [다시 고르기]로 서재에 돌아갈 수 있어요 */
function libStartUnit(sid, unitId) {
  const sub = libSubject(sid), u = sub && sub.units.find((x) => x.id === unitId);
  if (!u) return;
  Object.assign(S.setup, { subjectName: sub.name, topicName: u.name }); // 홈 키워드 탭에도 같은 값이 보이게
  save();
  startDiagnosis({ subjectName: sub.name, topicName: u.name, fresh: true, plan: unitPlan(sub, u), libUid: u.id });
}

/* ---------- [index5] 단원 출제 방법 시트 (SH-10) ----------
 *  여는 곳: 단원 [수정](origin 'edit' — 단원 이름 칸이 맨 위에 더 붙어요) · 단원 추가 직후('added')
 *          (▶ 진단 · 결과의 [다시 진단하기]는 이 시트 없이 libStartUnit()으로 바로 시작해요)
 *  저장 단위: 단원(u.plan) — 같은 과목이라도 단원마다 세부 요구사항 · 풀이 방식 · 단계 · 문항 수를 따로 기억해요
 *  시트는 초안(RT.libDraft)만 고치다가 [저장] · [진단 시작] 때 단원에 저장 — 그냥 닫으면 초안은 버려요
 *  가이드라인: libRecommend()가 그 단원의 가장 최근 진단 결과로 셔플/단계별을 추천 → [추천대로 설정]
 *  바인딩: input(#lp-name) → RT.libDraft.name · textarea(#lp-prompt) → RT.libDraft.prompt (둘 다 다시 그리지 않음)
 *          카드 · 칩 버튼 → 초안 변경 후 refreshLibPlan() — 다시 그려도 입력하던 이름 · 요구사항은 초안에서 그대로 채워요 */
function openLibPlanSheet({ sid, uid: unitId, origin = 'start' }) {
  const sub = libSubject(sid), u = sub && sub.units.find((x) => x.id === unitId);
  if (!u) return;
  RT.libDraft = { sid, uid: unitId, origin, name: u.name, ...unitPlan(sub, u) };
  openSheet(libPlanSheetHTML(), { name: 'libplan', footer: libPlanFooterHTML(), onClose: () => { RT.libDraft = null; } });

/* ---------- 에빙하우스 망각 곡선 기반 최적 복습 타이머 ---------- */
/** 에빙하우스(1885) 절약 공식 b = 184 / ((log10 t)^1.25 + 1.84), t = 경과 시간(분) → 0~1 */
function retention(minutes) {

  return Math.min(1, 1.84 / (Math.pow(Math.log10(minutes), 1.25) + 1.84));

const EBB_MAX = 10080; // 곡선 가로축 끝: 7일(분)
const ebbX = (m) => (m <= 1 ? 0 : Math.min(100, (Math.log10(m) / Math.log10(EBB_MAX)) * 100)); // 로그 눈금(%)
/** [index5] 경과 시간은 분 단위로 ('00:03:35'처럼 초가 계속 바뀌면 복습 시점 판단엔 도움 없이 시선만 끌었어요)
 *  1분 미만 → '1분 미만' · 1시간 미만 → 'N분' · 하루 미만 → 'N시간 M분' · 그 뒤 → 'N일 M시간' */
function fmtElapsed(mins) {
  const m = Math.max(0, Math.floor(mins));
  if (m < 1) return '1분 미만';
  if (m < 60) return `${m}분`;
  if (m < 1440) return `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ''}`;
  return `${Math.floor(m / 1440)}일 ${Math.floor((m % 1440) / 60)}시간`;
}
/** 아직 해소하지 않은 착각 문항 (복습 우선순위 순) */
function urgentOf(h) {
  if (!h || h.sample) return [];
  return reviewItems(h).filter((i) => i.status === 'ILLUSION' && !(h.review[i.qid] || {}).done);
}
/** 미해결 착각이 있는 진단들 — 기억이 가장 많이 증발한(유효 경과 시간이 긴) 진단부터 */
function urgentGroups() {
  return realHistory().map((h) => ({ h, items: urgentOf(h) })).filter((g) => g.items.length)
    .sort((a, b) => effMinutes(b.h) - effMinutes(a.h));

const startOfDay = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };

  if (d === 1) return '내일';
  return `${x.getMonth() + 1}월 ${x.getDate()}일`;
}

/* [변경] 최적 복습 타이머
 *  - 모든 진단의 미해결 착각을 모아, 가장 많이 잊은 진단의 곡선을 보여 줘요 (가장 최근 진단 1건만 보던 것 → 통합)

 *  [index5] 버튼 [🚨 착각 하나씩 해소하기]: 'solve-urgent'는 가장 급한 착각 하나의 유사 문제 1문항(startRetry)을 바로 시작해요.
 *          예전 문구('착각 N문항 바로 풀기')는 N문항을 다 푸는 것처럼, 그다음 문구('유사 문제 1문항 바로 풀기')는 바로 위 '착각 6문항 남음'과
 *          숫자가 어긋나 6개 중 1개만 푸는 것처럼 읽혔어요 → 숫자를 빼고 '하나씩'으로 (남은 개수는 제목 아래 칩, 마지막 하나면 '남은 착각 1문항 해소하기')
 */
function reviewTimerHTML() {
  const groups = urgentGroups();

  const start = reviewBase(h), stage = reviewStage(h);
  const mins = effMinutes(h);
  const r = retention(mins);
  const curve = Array.from({ length: 41 }, (_, k) => { const m = Math.pow(EBB_MAX, k / 40); return `${ebbX(m).toFixed(2)},${((1 - retention(m)) * 100).toFixed(2)}`; }).join(' ');
  const ticks = [[1, '방금'], [60, '1시간'], [1440, '1일'], [EBB_MAX, '7일']];
  const overdue = nextDueAt(h) <= Date.now();
  return `
  <section id="review-timer" class="card p-4 sm:p-5 ring-1 ring-illusion-200" aria-label="최적 복습 타이머" data-start="${start}" data-stage="${stage}">
    <div class="flex items-start gap-3">

        ? '<button type="button" class="btn btn-md btn-surface ring-1 ring-ink-200" data-action="open-review-all">모아서 복습</button>'

  </section>`;
}
/** 30초마다 경과 시간 · 증발량 · 곡선 위 점을 갱신 (홈에 있을 때만)
 *  [index5] 경과 시간을 분 단위로 바꿔서 1초마다 다시 그릴 필요가 없어요 → 30초 간격 (화면이 덜 움직이고 배터리도 덜 써요) */
function startReviewTimer() {
  stopReviewTimer();
  const el = $('#review-timer');
  if (!el) return;
  const t0 = Number(el.dataset.start), stage = Number(el.dataset.stage) || 0;
  const tick = () => {
    if (!el.isConnected) { stopReviewTimer(); return; }
    const real = (Date.now() - t0) / 60000, mins = real / (1 + 1.2 * stage), r = retention(mins);
    $('#ebb-elapsed').textContent = fmtElapsed(real);
    $('#ebb-ret').textContent = pct(r);
    $('#ebb-loss').textContent = 100 - pct(r);
    const dot = $('#ebb-dot');
    dot.style.left = `${ebbX(mins)}%`;
    dot.style.top = `${(1 - r) * 100}%`;
  };
  tick();
  RT.homeTimer = setInterval(tick, 30000);
}
function stopReviewTimer() { if (RT.homeTimer) clearInterval(RT.homeTimer); RT.homeTimer = null; }

/* ---------- 바텀 시트 콘텐츠: 진단 설정 (교재 PDF는 홈의 PDF 탭으로 옮겼어요) ----------

/* ---------- 진단 준비 (지식 체계 추출 결과) ---------- */
function renderReady(opt = {}) {

      <ul class="space-y-3.5 text-sm text-ink-700 leading-relaxed break-keep">

             첫 진단도 기본 설명은 2줄로: 확신도는 시작 직후 '확신도 안내' 시트에서 자세히 다시 보여 주고(랜딩 STEP 2까지 세 번 겹쳤어요),

/* ---------- 문제 풀이 ---------- */
const RING_C = 56.55; // 2πr (r = 9)

function renderQuiz(focusIndex) {
  const s = S.session, cur = s && s.current;
  if (!cur) return;
  const q = getQ(cur.qid);
  const concept = conceptOf(s.bankId, cur.cid);
  const reveal = cur.phase === 'feedback';
  const num = s.logs.length + (cur.phase === 'answering' ? 1 : 0);
  const progressLabel = s.kind === 'retry' ? '유사 문제 재도전' : num > s.total ? '추가 확인 문항' : `${num} / ${s.total}`;
  const progress = s.kind === 'retry' ? (reveal ? 100 : 0) : Math.min(100, pct(s.logs.length / s.total));
  const fresh = RT.lastQ !== cur.qid + s.seq; // 새 문항일 때만 등장 애니메이션
  RT.lastQ = cur.qid + s.seq;
  $('#view-quiz').innerHTML = `
  <div class="sticky top-0 z-20 bg-canvas/90 backdrop-blur-md safe-top">
    <!-- [index5] 풀이 화면엔 제목이 하나도 없었어요(문제 글이 h2) → 눈에는 안 보이는 h1 (스크린 리더 · 제목 이동용) -->
    <h1 class="sr-only">${s.kind === 'retry' ? '유사 문제 재도전' : `${s.kind === 'practice' ? '집중 연습' : '문제 풀이'} ${progressLabel}`}</h1>
    <div class="max-w-2xl mx-auto px-3 h-14 flex items-center gap-2">
      <button type="button" class="icon-btn" data-action="open-exit" aria-label="진단 멈추기"><i class="fa-solid fa-xmark text-lg"></i></button>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between text-xs font-bold"><span class="text-ink-800 tnum">${progressLabel}</span><span class="text-ink-500 truncate ml-2">${esc(s.subject)}</span></div>
        <div class="mt-1.5 h-1.5 rounded-full bg-ink-200 overflow-hidden" role="progressbar" aria-label="진행률" aria-valuemin="0" aria-valuemax="${s.total}" aria-valuenow="${s.logs.length}"><div class="h-full rounded-full bg-brand-500 transition-all duration-500" style="width:${progress}%"></div></div>
      </div>
      ${paceHTML(cur, q)}
    </div>
  </div>
  <div id="quiz-main" class="max-w-2xl mx-auto px-4 pt-2 ${fresh ? 'anim-in' : ''}">
    <div class="flex flex-wrap items-center gap-1.5">
      <span class="chip bg-surface text-ink-700">${esc(concept.name)}</span>
      ${levelChip(q.lv)}
      ${cur.isVerify ? '<span class="chip bg-ink-900 text-ink-50"><i class="fa-solid fa-shield-halved"></i>요행 방지 확인 문항</span>' : ''}
      ${cur.repeat ? '<span class="chip bg-ink-200 text-ink-700"><i class="fa-solid fa-repeat"></i>반복 확인 · 보기 순서 변경</span>' : ''}
      ${s.kind === 'retry' && cur.phase === 'answering' ? '<button type="button" class="ml-auto btn btn-sm btn-surface ring-1 ring-ink-200" data-action="regen-retry"><i class="fa-solid fa-rotate-right text-xs" aria-hidden="true"></i>다른 문제로 다시 생성</button>' : ''}
    </div>
    <h2 class="mt-4 text-[19px] sm:text-[21px] font-bold leading-[1.6] text-ink-900 break-keep">${esc(q.q)}</h2>
    <div class="mt-5 space-y-2.5" role="radiogroup" aria-label="보기">${cur.order.map((oi, i) => optionHTML(q, cur, oi, i, reveal)).join('')}</div>
    ${cur.tabOut && cur.phase === 'answering' && S.prefs.showPace ? '<p class="mt-3 text-xs text-ink-500"><i class="fa-regular fa-eye mr-1"></i>화면을 벗어난 시간은 풀이 시간에서 빼고 기록했어요.</p>' : ''}
  </div>
  <div id="dock" class="fixed bottom-0 inset-x-0 z-20 bg-surface/95 backdrop-blur-md border-t ${reveal ? `border-t-[3px] ${s.logs[cur.logIndex] && s.logs[cur.logIndex].correct ? 'border-mastery-500' : 'border-illusion-500'}` : 'border-ink-200'}">
    ${dockHTML(s, cur, q)}
  </div>`;
  fitDock();
  if (cur.phase === 'answering') startTicker(); else stopTicker();
  if (focusIndex != null) { const b = $(`[data-action="option"][data-i="${focusIndex}"]`); if (b) b.focus({ preventScroll: true }); }
}
/** 하단 도크(확신도 · 해설 서랍) 높이만큼 본문 아래 여백 확보 */
function fitDock() {
  const dock = $('#dock'), main = $('#quiz-main');
  if (dock && main) main.style.paddingBottom = `${dock.offsetHeight + 24}px`;
}

/** 타이머 대신 쓰는 페이스 인디케이터: 빨간색 · 깜빡임 · 카운트다운 없음
 *  [변경] 기본은 숨김 — 풀이 시간은 화면 뒤에서 조용히 기록해요 (보이는 순간 시간 압박 · 관찰자 효과). 계정 · 설정에서 켤 수 있어요 */
function paceHTML(cur, q) {
  if (!S.prefs.showPace) return '';
  const std = standardSec(q);
  const r = activeMs(cur) / 1000 / std;
  const off = (RING_C * (1 - Math.min(1, r))).toFixed(2);
  const hide = cur.phase !== 'answering';
  return `
  <button type="button" data-action="toggle-seconds" class="shrink-0 h-9 pl-1.5 pr-3 rounded-full bg-surface shadow-sm flex items-center gap-1.5 text-xs font-bold text-ink-600 ${hide ? 'invisible' : ''}" aria-label="풀이 페이스. 누르면 시간 표시를 켜거나 꺼요">
    <svg viewBox="0 0 24 24" class="w-6 h-6 -rotate-90" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke-width="3" style="stroke:rgb(var(--ink-200))"/>
      <circle id="pace-ring" cx="12" cy="12" r="9" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:rgb(var(${r <= 1 ? '--brand-500' : '--ink-400'}));transition:stroke-dashoffset .3s linear" stroke-dasharray="${RING_C}" stroke-dashoffset="${off}"/>
    </svg>
    <span id="pace-label">${paceText(r)}</span>${S.showSeconds ? '<span id="pace-secs" class="font-mono font-medium text-ink-500"></span>' : ''}
  </button>`;
}
const paceText = (r) => (r < SPEED_LIMIT ? '읽는 중' : r <= 1 ? '적정 페이스' : '천천히 생각 중');

function startTicker() { stopTicker(); RT.timer = setInterval(updatePace, 250); updatePace(); }
function stopTicker() { if (RT.timer) clearInterval(RT.timer); RT.timer = null; }
function updatePace() {
  const cur = S.session && S.session.current;
  if (!cur || cur.phase !== 'answering' || S.view !== 'quiz') { stopTicker(); return; }
  const ring = $('#pace-ring');
  if (!ring) return;
  const std = standardSec(getQ(cur.qid));
  const sec = activeMs(cur) / 1000;
  const r = sec / std;
  ring.setAttribute('stroke-dashoffset', (RING_C * (1 - Math.min(1, r))).toFixed(2));
  ring.style.stroke = `rgb(var(${r <= 1 ? '--brand-500' : '--ink-400'}))`;
  $('#pace-label').textContent = paceText(r);
  const secs = $('#pace-secs');
  if (secs) secs.textContent = `${Math.floor(sec)}/${std}s`;
}

function optionHTML(q, cur, oi, i, reveal) {

function coachLine(status, log) {
  if (status === 'MASTERY') return '확신도 · 정답 · 풀이 흐름이 모두 안정적이에요.';
  if (status === 'ILLUSION') return log.conf === 'HIGH' ? '이런 게 바로 ‘착각’이에요. 복습 카드 맨 앞에 올려 둘게요.' : '익숙해 보였지만 틀렸어요. 익숙함을 앎으로 착각했을 수 있어요.';
  if (status === 'DEFICIT') return '모른다고 솔직하게 체크했어요. 그것도 좋은 메타인지예요. 기초부터 다져 봐요.';
  return '맞혔지만 아직 흔들려요. 한 번 더 다지면 완전히 내 것이 돼요.';
}

  //          해소됐는지 · 왜 안 됐는지를 먼저 말해요 (조건은 finishRetry와 같아요: 착각 = 😎 100% 정답, 그 밖 = 🤔 70% 이상 정답)
  const retry = s.kind === 'retry' ? (() => {

        : needHigh ? '맞혔지만 착각 문항은 😎 100% 확신으로 맞혀야 해소돼요. 이번 결과는 기록만 남겨요.'
        : '맞혔지만 🎲 30% 확신으로는 해소되지 않아요. 🤔 70% 이상 확신으로 맞혀야 해요.',

  // [index5] 버튼을 스크롤 영역 밖으로: 예전엔 창 전체(max 62vh)가 스크롤돼서, 오답처럼 내용이 긴 피드백에선 [다음 문제]가 아래로 밀려 19px만 보였어요(375×812)
  //          → 내용만 스크롤(max-h = 62vh − 버튼 줄 5rem)하고 버튼 줄은 항상 창 맨 아래에 그대로 보여요

  //          → 틀린 문항(착각 · 기초 부족)은 이유 줄을 빼고, 부제도 칩과 겹치는 '확신했는데 틀렸어요.'를 뺐어요 (맞혔지만 흔들린 문항의 이유 줄은 번복 · 성급함 같은 새 정보라 그대로)
  return `
  <div class="max-w-2xl mx-auto anim-sheet" aria-live="polite">
   <!-- 아래 16px은 pb-4 + mask로 서서히 흐려져서 '더 있다'는 걸 알려 줘요 (맨 끝까지 내리면 빈 여백이라 글자가 흐려지지 않아요) -->
   <div class="px-4 pt-4 pb-4 max-h-[calc(62vh-5rem)] overflow-y-auto overscroll-contain [mask-image:linear-gradient(to_bottom,#000_calc(100%-16px),transparent)]">
    <div class="flex items-start gap-3">
      <span class="w-9 h-9 shrink-0 rounded-full grid place-items-center text-white ${log.correct ? 'bg-mastery-500' : 'bg-illusion-500'}"><i class="fa-solid ${log.correct ? 'fa-check' : 'fa-xmark'}"></i></span>
      <div class="min-w-0">
