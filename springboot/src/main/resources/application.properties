# 이 파일은 git에 올라간다 — DB 비밀번호 · 서버 주소를 직접 쓰지 말 것.
#  · 서버(EC2): 같은 서버 안의 DB를 쓰므로 URL 기본값(localhost)을 그대로 두고, 비밀번호만 환경변수 DB_PASSWORD로 준다.
#               (jar 옆에 application.properties 를 두고 spring.datasource.password 를 적어도 된다 — 그쪽이 우선한다)
#  · 내 PC:     springboot/config/application.properties (git이 무시) 에 실제 값을 적는다. 예시는 config/application.properties.example
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/metacheck?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI 모델: mock(기본 · 가짜 응답 · 비용 없음) 또는 bedrock(실제 호출 · 비용 발생).
# bedrock 은 로그인 · 호출 횟수 제한을 넣은 뒤에 켤 것. 키는 적지 않는다(EC2 인스턴스 프로파일 등 AWS 기본 경로로 찾는다).
metacheck.ai.client=${AI_CLIENT:mock}
metacheck.ai.bedrock.region=${BEDROCK_REGION:}
# 1 · 2단계용(Haiku급) · 3단계용(Sonnet급). Bedrock 콘솔의 모델 ID 또는 추론 프로필 ID 를 그대로
metacheck.ai.bedrock.basic-model-id=${BEDROCK_BASIC_MODEL_ID:}
metacheck.ai.bedrock.advanced-model-id=${BEDROCK_ADVANCED_MODEL_ID:}
# 호출 한 번의 상한(초). 사양서에 값이 없어 정한 시작값 — 실제 응답 시간을 재서 맞출 것
metacheck.ai.bedrock.timeout-seconds=${BEDROCK_TIMEOUT_SECONDS:60}
# 게이트 ③ 2차 풀이(생성된 문항을 다른 호출로 풀어 정답을 확인). 호출이 약 2배라 비용 · 시간을 보고 끌 수 있다(사양서 11쪽 결정 8)
metacheck.ai.verify=${AI_VERIFY:true}
